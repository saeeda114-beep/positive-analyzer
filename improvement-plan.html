<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل واقع المدرسة وخطة التحسين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0a2733;--navy-800:#0f3d4c;--teal-700:#155a6c;--teal-600:#1d5c6e;--teal-500:#237e93;
  --gold:#c99a45;--bg:#f3f6f8;--line:#dbe4ea;--muted:#5c7180;--ink:#16232b;--rd:#b3261e;
  --shadow:0 2px 8px rgba(10,39,51,.06),0 10px 30px rgba(10,39,51,.06);
  --lv-ex:#00a651;--lv-pr:#0070c0;--lv-st:#f0a800;--lv-pp:#e02020;
  --form:#0e7c7b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
button{font-family:inherit;}
header.top{background:linear-gradient(135deg,var(--navy-900),var(--navy-800) 60%,var(--teal-700));color:#fff;padding:22px 24px;}
header.top .in{max-width:1180px;margin:0 auto;}
header.top h1{margin:0 0 4px;font-size:22px;font-weight:900;}
header.top p{margin:0;font-size:13px;color:#cfe0e6;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px;}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;
  color:var(--navy-800);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.step .n{width:22px;height:22px;border-radius:50%;background:#e6eef2;color:var(--navy-800);display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
.step.done .n{background:#13824a;color:#fff;}
.step.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.step.active .n{background:var(--gold);color:#3a2a06;}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:16.5px;color:var(--navy-800);border-inline-start:4px solid var(--gold);padding-inline-start:10px;}
.card h3{margin:14px 0 8px;font-size:14.5px;color:var(--teal-600);}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
.note{background:#fff8e8;border-inline-start:4px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.sugg{background:#eef7f4;border-inline-start:4px solid #13824a;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.warnbar{background:#fbeceb;color:#8f2a22;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
label.lb{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd9de;border-radius:8px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-500);outline-offset:0;border-color:var(--teal-500);}
textarea{min-height:70px;resize:vertical;line-height:1.7;}
.g{display:grid;gap:12px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);} .g6{grid-template-columns:repeat(6,1fr);}
@media(max-width:860px){.g3,.g4,.g6{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.g2,.g3,.g4,.g6{grid-template-columns:1fr;}}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--teal-600);color:#fff;} .btn.primary:hover{background:var(--teal-500);}
.btn.gold{background:var(--gold);color:#3a2a06;} .btn.gold:hover{background:#dba94f;}
.btn.light{background:#eef3f5;color:var(--navy-800);border:1px solid var(--line);}
.btn.danger{background:#fdecea;color:var(--rd);border:1px solid #f4c7c2;padding:6px 10px;font-size:12.5px;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.between{justify-content:space-between;}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}

.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:right;}
.tbl th{background:#eef4f6;color:var(--navy-800);font-weight:800;}
.tbl td input,.tbl td select,.tbl td textarea{padding:6px 7px;font-size:13px;}
.tbl td textarea{min-height:54px;}
.scroll{overflow-x:auto;}
.num{text-align:center !important;}
.lv{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:20px;padding:1px 9px;white-space:nowrap;}
.lv.ex{background:var(--lv-ex);} .lv.pr{background:var(--lv-pr);} .lv.st{background:var(--lv-st);} .lv.pp{background:var(--lv-pp);} .lv.na{background:#a9b6bd;}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:#e8f3ef;color:#13704b;margin-inline-start:6px;}
.tag.opp{background:#eaf1fb;color:#1f5fa8;}

.ind{display:grid;grid-template-columns:72px 1fr 110px 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.ind:last-child{border-bottom:0;}
.ind .code{font-weight:800;color:var(--teal-600);direction:ltr;text-align:right;font-size:13px;}
.ind .tx{font-size:13.5px;}
.ind input{text-align:center;}
.grp{font-size:12.5px;font-weight:800;color:#3a2a06;background:#f6efe1;border-radius:8px;padding:4px 10px;margin:12px 0 2px;display:inline-block;}
@media(max-width:600px){.ind{grid-template-columns:60px 1fr;}.ind .tx{grid-column:2;}.ind input{grid-column:1/2;}}

.listbox{border:1px solid var(--line);border-radius:12px;padding:12px;}
.listbox h3{margin:0 0 8px;}
.li{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
.li textarea{min-height:40px;}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:760px){.sw{grid-template-columns:1fr;}}
.sw .s{border-top:4px solid #3cb44b;} .sw .w{border-top:4px solid #4aa3df;} .sw .o{border-top:4px solid #e3b21d;} .sw .t{border-top:4px solid #e02020;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.chip{background:#f1f6f8;border:1px dashed #b9cbd4;border-radius:16px;padding:3px 10px;font-size:12px;cursor:pointer;text-align:right;}
.chip:hover{background:#e3eff3;}
.pitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfdfd;}
.check li{margin-bottom:4px;}
.ok{color:#13824a;font-weight:800;} .no{color:var(--rd);font-weight:800;}
.hidden{display:none !important;}

/* ===================== PRINT ===================== */
#printArea{display:none;}
@media print{
  @page{size:A4 landscape;margin:9mm 10mm;}
  body{background:#fff;}
  body.printing > *:not(#printArea){display:none !important;}
  body.printing #printArea{display:block;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
#printArea{font-family:'Tajawal',Arial,sans-serif;color:#111;font-size:10.5pt;line-height:1.45;}
#printArea thead{display:table-header-group;}
#printArea .pg{page-break-after:always;break-after:page;}
#printArea .pg:last-child{page-break-after:auto;break-after:auto;}
#printArea .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--form);padding-bottom:4px;margin-bottom:6px;}
#printArea .ph .r{font-size:8.8pt;font-weight:800;line-height:1.4;text-align:center;min-width:42%;}
#printArea .ph .m{flex:1;text-align:center;}
#printArea .ph .m img{height:15mm;}
#printArea .ph .l{font-size:9pt;text-align:left;color:#333;line-height:1.4;min-width:20%;}
#printArea h1{font-size:15pt;text-align:center;color:var(--form);margin:4px 0 8px;}
#printArea h2{font-size:12pt;margin:8px 0 5px;}
#printArea h3{font-size:10.5pt;margin:7px 0 4px;}
#printArea table{width:100%;border-collapse:collapse;margin-bottom:6px;}
#printArea th,#printArea td{border:1px solid #333;padding:3px 5px;font-size:9.5pt;vertical-align:middle;text-align:right;}
#printArea th{background:var(--form);color:#fff;font-weight:800;text-align:center;}
#printArea th.gy{background:#f2f2f2;color:#111;}
#printArea td.gy{background:#f2f2f2;font-weight:700;text-align:center;}
#printArea table.it td,#printArea table.it th{font-size:8.8pt;padding:2px 4px;}
#printArea td.c{text-align:center;}
#printArea td.lbl{background:var(--form);color:#fff;font-weight:800;white-space:nowrap;}
#printArea tr{break-inside:avoid;page-break-inside:avoid;}
#printArea .avoid{break-inside:avoid;page-break-inside:avoid;}
#printArea .cb{display:inline-block;margin-inline-end:10px;white-space:nowrap;}
#printArea .cb i{display:inline-block;width:11px;height:11px;border:1.4px solid #222;margin-inline-end:4px;vertical-align:-1px;font-style:normal;font-size:9px;line-height:9px;text-align:center;font-weight:900;}
#printArea .pct{font-weight:800;font-size:9.5pt;}
#printArea .pct.ex{color:var(--lv-ex);} #printArea .pct.pr{color:var(--lv-pr);} #printArea .pct.st{color:var(--lv-st);} #printArea .pct.pp{color:var(--lv-pp);}
#printArea .foot{font-size:8.5pt;color:#c00000;margin:1px 0;}
#printArea .fn{font-size:8.5pt;color:#1f6fd1;margin:1px 0 6px;}
#printArea .cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140mm;text-align:center;}
#printArea .cover .t{font-size:20pt;font-weight:900;line-height:2.1;margin-bottom:26px;}
#printArea .cover .f{font-size:14pt;font-weight:800;margin:8px 0 2px;}
#printArea .cover .f small{font-size:8pt;color:#1f6fd1;font-weight:400;}
#printArea .cover .v{font-size:13pt;border-bottom:1.5px dotted #333;min-width:70mm;padding:2px 10px;margin-bottom:10px;}
#printArea .sig{display:flex;justify-content:space-between;margin-top:14px;font-weight:800;}
#printArea .recs{border:1px solid #333;padding:6px 8px;min-height:22mm;white-space:pre-wrap;}
#printArea ul.b{margin:0;padding-inline-start:18px;}
#printArea .swot td{vertical-align:top;}
#printArea .swot .side{width:7mm;padding:0;text-align:center;color:#fff;font-weight:900;writing-mode:vertical-rl;}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>تحليل واقع المدرسة وخطة التحسين</h1>
  <p>تحليل واقع المدرسة وبناء خطة التحسين وتنفيذها في مجالات الممارسات الإشرافية ونماذج التنفيذ — وفق النموذج الإشرافي المعتمد 1448هـ، مع مقترحات جاهزة قابلة للتعديل.</p>
</div></header>

<div class="wrap" id="app">
  <div id="backupWarn"></div>
  <nav class="steps" id="steps"></nav>
  <div id="view"></div>
</div>

<div id="printArea"></div>

 "2-1-1-7":["مهارات التفكير والبحث والابتكار","قلة المهام التي تنمي مهارات التفكير العليا والبحث والابتكار لدى المتعلمين","تضمين مهمة تفكير عليا أو بحث في 80% من الوحدات، ومشاركة 50% من الطلاب في مشروع بحثي أو ابتكاري",
   "تحديد مهارات التفكير المستهدفة لكل مادة؛ إعداد بنك أسئلة ومهام تفكير عليا؛ تدريب الطلاب على خطوات البحث وحل المشكلات؛ تنفيذ مشروعات بحثية قصيرة؛ تحكيم الأعمال وعرضها؛ قياس النمو بسلم تقدير","مهام حل المشكلات؛ بحث مصغر؛ تفكير ناقد؛ تحديات ابتكار؛ سلالم تقدير","فصل دراسي؛ متابعة كل أسبوعين؛ عرض ختامي","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: معلمو المواد ومعلم الموهوبين (إن وجد). المشاركة: رائد النشاط. الدعم: {S}."],
 "2-1-1-8":["المهارات العاطفية والاجتماعية","الحاجة إلى تنمية مهارات التواصل والتعاون وضبط الانفعالات لدى المتعلمين","تنفيذ برنامج للمهارات العاطفية والاجتماعية يشمل 100% من الفصول، وتحسن مؤشرات السلوك الصفي عن خط الأساس",
   "قياس المهارات الاجتماعية والعاطفية بأداة معتمدة؛ إعداد برنامج توجيهي جمعي؛ تضمين أنشطة تعاونية في الدروس؛ تنفيذ لقاءات توجيهية للفصول؛ متابعة الحالات الفردية؛ إعادة القياس","إرشاد جمعي؛ تعلم تعاوني؛ لعب أدوار؛ مواقف وقصص؛ تعزيز إيجابي","فصل دراسي؛ لقاء لكل فصل كل أسبوعين","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي والمعلمون. الدعم: {S}."],
 "2-1-1-9":["دافعية المتعلمين للتعلم والاستمتاع به","ضعف دافعية المتعلمين للتعلم وانخفاض المشاركة الصفية","رفع نسبة المشاركة الصفية الفاعلة في الدروس المرصودة إلى 80%، وتحسن نتائج استبانة الدافعية عن خط الأساس",
   "تطبيق استبانة الدافعية؛ تحديد أسباب ضعف الدافعية؛ تفعيل أساليب تحفيز وتعزيز صفية؛ توظيف التعلم باللعب والتحديات؛ تكريم المتقدمين والمتحسنين دوريًا؛ التواصل مع الأسر؛ إعادة القياس","التعلم باللعب؛ التحديات الصفية؛ لوحات الإنجاز؛ التعزيز الإيجابي؛ تكريم شهري","فصل دراسي؛ تكريم شهري؛ قياس قبلي وبعدي","المسؤول الأول: مدير المدرسة. التنفيذ: المعلمون والموجه الطلابي ورائد النشاط. الدعم: {S}."],
 "2-2-1-1":["تقويم مستويات أداء المتعلمين","الاعتماد على الاختبارات وقلة تنوع أدوات التقويم التشخيصي والتكويني","استخدام أدوات تقويم متنوعة (تشخيصية وتكوينية) في 85% من الوحدات",
   "بناء أدوات تشخيصية لكل مادة؛ إعداد بنك أدوات تقويم تكويني؛ تطبيقها بانتظام؛ تصنيف الطلاب وفق النتائج؛ تعديل التدريس بناءً عليها؛ مراجعة الأدوات في اجتماعات التخصص","ورشة بناء أدوات؛ بنك أدوات؛ سلالم تقدير؛ ملفات إنجاز","بناء: الأسابيع 1-4؛ تطبيق حتى نهاية الفصل؛ مراجعة كل أربعة أسابيع","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: لجنة التحصيل الدراسي ومعلمو المواد. الدعم: {S}."],
 "2-2-1-2":["تقويم نواتج التعلم المستهدفة","ضعف مواءمة أدوات التقويم مع نواتج التعلم المستهدفة في المناهج","مراجعة 100% من الاختبارات قبل تطبيقها وفق جدول مواصفات، وتطبيق مهام أداء في 80% من الوحدات",
   "إعداد جداول مواصفات للاختبارات؛ مراجعة الاختبارات قبل تطبيقها؛ تضمين أسئلة تقيس مستويات معرفية متنوعة؛ تصميم مهام أداء مرتبطة بالنواتج؛ تحليل نتائج كل اختبار","جداول مواصفات؛ مراجعة الأقران للاختبارات؛ مهام أداء؛ تحليل مفردات","الأسابيع 2-12؛ قبل كل اختبار","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: لجنة التحصيل الدراسي ورؤساء التخصصات. الدعم: {S}."],
 "2-2-1-3":["تحليل نتائج التقويم وتوظيفها","قصور تحليل نتائج التقويم وتوظيفها في تحسين عمليات التعليم والتعلم","تحليل 100% من نتائج الاختبارات الفترية والنهائية، وربط كل فجوة ذات أولوية بإجراء علاجي خلال 10 أيام عمل",
   "تجميع نتائج التقويم في نموذج موحد؛ تحليلها حسب الصف والمادة والمهارة؛ تحديد الفجوات وأسبابها؛ إعداد خطط علاجية وإثرائية؛ مناقشتها في اجتماع لجنة التحصيل الدراسي؛ متابعة أثرها في القياس التالي","لوحة بيانات؛ ورشة تحليل؛ اجتماع قرار؛ خطط علاجية","بعد كل فترة تقويم؛ تحديث شهري","المسؤول الأول: مدير المدرسة. التنفيذ: لجنة التحصيل الدراسي ومعلمو المواد. الدعم: {S}."],
 "2-2-1-4":["التغذية الراجعة ومتابعة تقدم المتعلمين","ضعف التغذية الراجعة المقدمة للمتعلمين وأولياء أمورهم ومتابعة تقدمهم","تقديم تغذية راجعة لـ100% من الطلاب بعد كل تقويم، وإشعار أولياء أمور 100% من الطلاب المتعثرين",
   "اعتماد نموذج تغذية راجعة محددة؛ تدريب المعلمين على التغذية الراجعة الفعالة؛ إرسال تقارير التقدم لأولياء الأمور عبر نظام نور والمنصة؛ عقد لقاءات مع أولياء أمور المتعثرين؛ متابعة تحسن الطلاب","نماذج تغذية راجعة؛ تقارير تقدم؛ لقاءات أولياء الأمور؛ رسائل نصية","فصل دراسي؛ بعد كل فترة تقويم","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: معلمو المواد. المشاركة: الموجه الطلابي. الدعم: {S}."],
 "3-2-1-1":["تعزيز القيم والهوية الوطنية لدى المتعلمين","الحاجة إلى تعزيز اعتزاز المتعلمين بالقيم والهوية الوطنية","تنفيذ برنامج قيمي ووطني يشمل 100% من الطلاب، وتحسن نتائج استبانة الطلاب عن خط الأساس",
   "تطبيق استبانة قبلية؛ إعداد برنامج قيمي ووطني فصلي؛ تفعيل الإذاعة المدرسية والمناسبات الوطنية؛ تنفيذ لقاءات توجيهية ومسابقات؛ دمج القيم في الأنشطة الصفية؛ قياس بعدي","إذاعة مدرسية؛ مسابقات؛ لقاءات توجيهية؛ مبادرات طلابية؛ مناسبات وطنية","فصل دراسي؛ برنامج شهري","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ورائد النشاط والمعلمون. الدعم: {S}."],
 "3-2-1-2":["الاتجاهات الإيجابية نحو الذات والآخرين","الحاجة إلى تعزيز ثقة المتعلمين بأنفسهم واتجاهاتهم الإيجابية نحو الآخرين","شمول 100% من الفصول ببرنامج توجيهي، وتحسن نتائج مقياس الاتجاهات عن خط الأساس",
   "قياس الاتجاهات بأداة معتمدة؛ تنفيذ برنامج توجيه جمعي في تقدير الذات والتعامل مع الآخرين؛ إسناد أدوار ومسؤوليات للطلاب؛ تعزيز السلوك الإيجابي؛ متابعة الحالات الفردية؛ إعادة القياس","إرشاد جمعي وفردي؛ أدوار قيادية؛ تعزيز إيجابي؛ قصص نجاح","فصل دراسي؛ لقاءات كل أسبوعين","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي والمعلمون. الدعم: {S}."],
 "3-2-1-3":["الممارسات الصحية السليمة","ضعف التزام المتعلمين بالممارسات الصحية السليمة (الغذاء، النشاط البدني، النظافة الشخصية)","تنفيذ برنامج توعية صحية يشمل 100% من الطلاب، وتحسن مؤشرات الممارسات الصحية عن خط الأساس",
   "رصد الممارسات الصحية بأداة مسحية؛ إعداد برنامج توعوي صحي؛ تفعيل حصص التربية البدنية والأنشطة الحركية؛ متابعة المقصف المدرسي؛ الشراكة مع المركز الصحي؛ إعادة القياس","توعية صحية؛ شراكة مع المركز الصحي؛ أنشطة رياضية؛ مسابقات","فصل دراسي؛ نشاط شهري","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ومعلم التربية البدنية والمعلمون. الشراكة: المركز الصحي. الدعم: {S}."],
 "3-2-1-4":["المشاركة المجتمعية والأعمال التطوعية","انخفاض مشاركة المتعلمين في الأنشطة المجتمعية والأعمال التطوعية","مشاركة 60% من الطلاب في فرصة تطوعية موثقة",
   "حصر الفرص التطوعية؛ تكوين فرق تطوع طلابية؛ تنفيذ مبادرات داخل المدرسة وخارجها؛ توثيق الساعات التطوعية؛ تكريم المتطوعين","فرق تطوعية؛ مبادرات مجتمعية؛ شراكات؛ توثيق الساعات","فصل دراسي؛ مبادرة شهرية","المسؤول الأول: رائد النشاط. التنفيذ: الموجه الطلابي والمعلمون والطلاب. الشراكة: جهات المجتمع المحلي. الدعم: {S}."],
 "3-2-1-5":["الالتزام بقواعد السلوك والانضباط المدرسي","ارتفاع المخالفات السلوكية والغياب والتأخر الصباحي","خفض المخالفات السلوكية والغياب غير المبرر 20% عن خط الأساس، ومعالجة 90% من الحالات ذات الأولوية",
   "توعية الطلاب وأولياء الأمور بقواعد السلوك والمواظبة وأخذ التعهدات؛ تحليل بيانات المخالفات والغياب في نظام نور؛ تطبيق الإجراءات وفق القواعد؛ تنفيذ برامج تعزيز السلوك الإيجابي؛ دراسة الحالات المتكررة وعرضها على لجنة التوجيه الطلابي؛ متابعة المؤشرات شهريًا","توعية؛ تحليل بيانات؛ دراسة حالة؛ تعزيز إيجابي؛ تواصل أسري؛ لجنة التوجيه الطلابي","فصل دراسي؛ متابعة أسبوعية ومراجعة شهرية","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ولجنة التوجيه الطلابي والمعلمون. الدعم: {S}."],
 "3-2-1-6":["الاستقلالية والتعلم الذاتي","ضعف قدرة المتعلمين على البحث والتعلم الذاتي وتحمل مسؤولية تعلمهم","تنفيذ مهمة تعلم ذاتي واحدة على الأقل لكل وحدة، وتحسن مؤشر الاستقلالية عن خط الأساس",
   "تدريب الطلاب على مهارات التعلم الذاتي وإدارة الوقت؛ تصميم مهام بحث ذاتي؛ تفعيل المنصة التعليمية ومصادر التعلم؛ إعداد ملفات إنجاز طلابية؛ متابعة الأعمال وتقويمها","تعلم ذاتي؛ مشروعات بحثية؛ ملفات إنجاز؛ صف مقلوب؛ منصات تعليمية","فصل دراسي؛ متابعة كل أسبوعين","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: معلمو المواد والموجه الطلابي. الدعم: {S}."],
 "3-2-1-7":["الاعتزاز بالثقافة واحترام التنوع الثقافي","الحاجة إلى تعزيز اعتزاز المتعلمين بثقافتهم واحترامهم للتنوع الثقافي","تنفيذ برنامج ثقافي يشمل 100% من الطلاب",
   "تنفيذ أنشطة تعرّف بالثقافة الوطنية والتراث؛ عقد لقاءات حوارية حول احترام الآخر؛ تنظيم مسابقات ثقافية؛ تفعيل المناسبات الوطنية؛ قياس الأثر","حوارات؛ معارض تراثية؛ مسابقات؛ إذاعة مدرسية","فصل دراسي؛ نشاط شهري","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ورائد النشاط. الدعم: {S}."],
 "1-2-1-1":["تعزيز القيم الإسلامية والهوية الوطنية في المدرسة","الحاجة إلى برامج مدرسية منظمة لتعزيز القيم الإسلامية والهوية الوطنية ومتابعتها","تنفيذ خطة قيمية ووطنية معتمدة ومتابعة 100% من برامجها",
   "إعداد خطة مدرسية للقيم والهوية الوطنية؛ توزيع المهام على المعلمين واللجان؛ تفعيل الاصطفاف الصباحي والإذاعة ونشيد العلم؛ دمج القيم في الدروس والأنشطة؛ توثيق البرامج وقياس أثرها","خطة قيمية؛ إذاعة مدرسية؛ مناسبات وطنية؛ دمج القيم في الدروس","فصل دراسي؛ متابعة شهرية","المسؤول الأول: مدير المدرسة. التنفيذ: وكيل شؤون الطلاب والموجه الطلابي ورائد النشاط. الدعم: {S}."],
 "1-2-1-2":["قيم مهنة التعليم وأخلاقياتها","الحاجة إلى تعزيز التزام منسوبي المدرسة بقيم مهنة التعليم وأخلاقياتها ومتابعة ذلك","اطلاع 100% من المنسوبين على ميثاق أخلاقيات مهنة التعليم والتوقيع عليه",
   "عرض ميثاق أخلاقيات مهنة التعليم في اجتماع عام؛ أخذ توقيعات المنسوبين؛ تكريم النماذج المتميزة؛ متابعة الالتزام ومعالجة الملاحظات وفق الأنظمة","اجتماعات؛ ميثاق مكتوب؛ تكريم؛ متابعة","الأسبوعان الأولان؛ متابعة فصلية","المسؤول الأول: مدير المدرسة. التنفيذ: الوكلاء. الدعم: {S}."],
 "1-2-1-3":["إجراءات دعم الانضباط المدرسي","ضعف تطبيق إجراءات محددة لدعم الانضباط المدرسي ومتابعة الالتزام بها","تطبيق 100% من إجراءات قواعد السلوك والمواظبة وتوثيقها في نظام نور",
   "تحديث إجراءات الانضباط وفق قواعد السلوك والمواظبة؛ توعية المنسوبين والطلاب وأولياء الأمور بها؛ توزيع المناوبة والإشراف اليومي؛ رصد المخالفات والغياب في نظام نور؛ متابعة تطبيق الإجراءات شهريًا","قواعد السلوك والمواظبة؛ جدول المناوبة والإشراف؛ نظام نور؛ تقارير شهرية","الأسبوع الأول؛ متابعة أسبوعية","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ولجنة التوجيه الطلابي. الدعم: {S}."],
 "1-2-1-4":["برامج دعم السلوك الإيجابي","قلة البرامج التربوية الداعمة للسلوك الإيجابي لدى المتعلمين، ومنهم ذوو الإعاقة والموهوبون، ومتابعتها","تنفيذ برنامجين توجيهيين على الأقل في الفصل الدراسي، وشمول 100% من الفئات المستهدفة",
   "تحديد الاحتياجات السلوكية من بيانات نظام نور والملاحظة؛ إعداد برامج وقائية وعلاجية للسلوك الإيجابي؛ تنفيذ برامج التعزيز (الطالب المثالي، لوحة الشرف)؛ مراعاة ذوي الإعاقة والموهوبين؛ قياس أثر البرامج قبليًا وبعديًا","برامج وقائية؛ تعزيز إيجابي؛ إرشاد جمعي؛ قياس قبلي وبعدي","فصل دراسي؛ تقويم بعد كل برنامج","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ورائد النشاط والمعلمون. الدعم: {S}."],
 "1-2-1-5":["اكتشاف المواهب وتهيئة المتعلمين للمستقبل","قلة البرامج الإثرائية لتطوير مواهب المتعلمين وتهيئتهم للمستقبل ومتابعتها","حصر مواهب 100% من الطلاب، ومشاركة 70% منهم في برنامج إثرائي أو إرشاد مهني",

  ["التدريس","تنفيذ التدريس بطرائق نشطة تراعي الفروق وتدمج التقنية","الاعتماد على الإلقاء وضعف تنوع الاستراتيجيات وإدارة الصف. المستهدف: تحقق مؤشرات التعلم النشط ومراعاة الفروق في 80% من الدروس المرصودة، مع بيئة صفية آمنة وجاذبة.","تنفيذ زيارات خط أساس؛ تحديد ممارستين ذواتي أولوية لكل تخصص؛ تقديم دروس تطبيقية؛ تبادل الزيارات؛ متابعة دمج التقنية وإدارة الوقت والسلوك الصفي؛ تقديم تغذية راجعة ومقارنة النتائج بالأساس.","دروس تطبيقية؛ زيارات تبادلية؛ ملاحظة صفية قصيرة؛ مجتمع تعلم مهني؛ تدريب مصغر.","الأسابيع 3-10؛ قياس قبلي وبعدي.","المسؤول الأول: مدير المدرسة. التنفيذ: لجنة التحصيل والمعلمون المتميزون. الدعم: مقدم خدمة دعم التميز."],
  ["التدريس","تقويم التعلم والتغذية الراجعة وجودة الاختبارات","الاعتماد على الاختبارات وقلة تنوع أدوات التقويم وضعف التغذية الراجعة. المستهدف: استخدام تقويم تكويني موثق في 80% من الدروس المرصودة، ومراجعة 100% من الاختبارات قبل التطبيق.","بناء أدوات تقويم تكويني مشتركة؛ تطبيقها بانتظام؛ تقديم تغذية راجعة محددة؛ مراجعة الاختبارات وفق جدول مواصفات؛ تحليل الأخطاء؛ مناقشة النتائج في مجتمعات التعلم المهنية؛ تعديل التدريس بناء على البيانات.","ورشة بناء أدوات؛ تحليل أعمال طلاب؛ زيارات صفية؛ مراجعة اختبارات؛ حلقات نقاش.","الأسابيع 2-12؛ مراجعة كل أربعة أسابيع.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: لجنة التحصيل ومعلمو المواد. الدعم: مقدم خدمة دعم التميز والمشرف التخصصي عند الحاجة."],
  ["نواتج التعلم","دراسة نتائج تعلم الطلاب وتحليلها وتحديد الفجوات","قصور تحليل النتائج وعدم وضوح الفجوات. المستهدف: تحليل 100% من مصادر النتائج المتاحة، وتحديد الفجوات ذات الأولوية، وربط كل فجوة بإجراء علاجي ومسؤول وزمن.","تجميع نتائج التقويم والاختبارات الوطنية والتشخيصية؛ تحليلها حسب الصف والمهارة والفئة؛ تحديد ثلاث فجوات كبرى؛ تحليل الأسباب؛ إسناد تدخل لكل فجوة؛ متابعة شهرية للاتجاهات واتخاذ قرارات تصحيحية.","لوحة بيانات؛ ورشة تحليل؛ لقاءات تخصصية؛ اختبارات تشخيصية ومحاكية هادفة.","تحليل أولي خلال أسبوعين؛ تحديث شهري.","المسؤول الأول: مدير المدرسة. التنفيذ: لجنة التحصيل وفريق الاختبارات الوطنية. الدعم: مقدم خدمة دعم التميز."],
  ["نواتج التعلم","تحسين المهارات الأساسية ودعم الطلاب ذوي الاحتياج وإثراء الموهوبين","فجوات في المهارات الأساسية ووجود طلاب متعثرين. المستهدف: رفع متوسط إتقان المهارات ذات الأولوية 20 نقطة مئوية عن القياس القبلي، وإعداد خطة دعم لـ100% من الطلاب ذوي الاحتياج.","تطبيق تشخيص قبلي؛ تصنيف الطلاب حسب المهارة؛ تصميم مجموعات دعم وخطط فردية للحالات الأشد؛ تنفيذ حصص علاج وإثراء؛ متابعة قصيرة متكررة؛ التواصل مع الأسر؛ إعادة القياس وتعديل التدخل.","تدريس علاجي؛ تعلم متمايز؛ خطط دعم فردية؛ إثراء؛ منصات تعليمية؛ شراكة أسرية.","فصل دراسي؛ متابعة كل أسبوعين.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: معلمو المواد ولجنة التحصيل بالشراكة مع الموجه الطلابي والأسرة. الدعم: مقدم خدمة دعم التميز."],
  ["التوجيه الطلابي","الدافعية والانضباط والأمان النفسي والاجتماعي والشراكة مع الأسرة","ضعف الدافعية وارتفاع الغياب ووجود سلوكيات سلبية. المستهدف: خفض الغياب غير المبرر والمخالفات 20% عن خط الأساس، ومعالجة 90% من الحالات ذات الأولوية.","تحليل بيانات الغياب والتأخر والمخالفات؛ تحديد الطلاب والفصول الأعلى احتياجًا؛ تنفيذ تدخلات متدرجة؛ متابعة يومية والتواصل المبكر مع الأسر؛ تفعيل مسار آمن للإبلاغ عن التنمر؛ قياس الدافعية والمناخ المدرسي ومراجعة الأثر شهريًا.","تدخلات وقائية؛ إرشاد فردي وجماعي؛ تعزيز إيجابي؛ شراكة أسرية؛ تحليل سجلات.","فصل دراسي؛ متابعة أسبوعية ومراجعة شهرية.","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي ولجنة التوجيه والمعلمون. بالشراكة مع الأسرة. الدعم: مقدم خدمة دعم التميز."],
  ["الأنشطة المدرسية","البرامج والأنشطة الصفية وغير الصفية المرتبطة بالتعلم والهوية","ضعف انتظام الأنشطة وارتباطها بالمنهج والهوية. المستهدف: ارتباط 80% من الأنشطة المنفذة بهدف تعليمي أو حاجة موثقة، ومشاركة 70% من الطلاب في نشاط نوعي واحد على الأقل.","حصر الأنشطة الحالية؛ ربط كل نشاط بهدف تعليمي أو حاجة طلابية؛ إعداد خطة فصلية متوازنة؛ إتاحة أدوار متنوعة للطلاب؛ دمج الهوية الوطنية والقيم؛ قياس المشاركة والأثر؛ إيقاف الأنشطة منخفضة الأثر وتطوير الناجح منها.","مشروعات ومسابقات؛ إذاعة هادفة؛ معارض؛ أندية طلابية؛ تعلم خدمي؛ شراكات مجتمعية.","فصل دراسي؛ تقويم بعد كل برنامج.","المسؤول الأول: رائد النشاط. التنفيذ: لجنة النشاط والمعلمون والطلاب بالشراكة مع الأسرة والمجتمع. الدعم: مقدم خدمة دعم التميز."],
  ["التطوير المستمر","تأسيس منظومة التطوير المستمر الفردي والفريقي والمدرسي والتفاعل مع التربويين والمجتمع","حاجة المدرسة إلى تنظيم التطوير المهني وربطه بأولويات التدريس ونواتج التعلم. يُثبت خط الأساس بتحليل الاحتياجات المهنية وبطاقات الملاحظة الصفية. المستهدف: إعداد خطة تطوير فردية لـ100% من المعلمين، وتطبيق 80% منهم ممارسة تطويرية واحدة على الأقل، وتفعيل مجتمع تعلم مهني شهري في كل تخصص.","تحليل الاحتياجات المهنية وربطها بأولويات الخطة؛ إعداد خطط تطوير فردية؛ تشكيل مجتمعات تعلم مهنية؛ تنفيذ تدريب مصغر ودروس تطبيقية؛ تفعيل تعلم الأقران والزيارات المتبادلة؛ متابعة التطبيق داخل الصف؛ تحليل الشواهد وتقديم التغذية الراجعة؛ تعديل برامج التطوير وفق النتائج.","التأمل الذاتي؛ التدريب المصغر؛ التوجيه الفردي؛ مجتمعات التعلم المهنية؛ تعلم الأقران؛ الدروس التطبيقية؛ الزيارات الصفية المتبادلة.","تحليل الاحتياج خلال الأسبوعين الأولين؛ التنفيذ من الأسبوع الثالث حتى نهاية الفصل؛ متابعة شهرية وقياس ختامي.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: لجنة التميز المدرسي ومنسقو التخصصات والمعلمون. المتابعة: مدير المدرسة. الدعم: مقدم خدمة دعم التميز المدرسي وفق حاجة المدرسة والتكليف."]],
  recs:"تركيز جهود التحسين على الاحتياجات الأكثر أثرًا في التدريس ونواتج التعلم، ومتابعة التنفيذ شهريًا وفق شواهد واضحة. وتخصيص وقت منتظم لمجتمعات التعلم المهنية والزيارات المتبادلة، والاستفادة من خدمات دعم التميز المدرسي في الأولويات التي تتطلب دعمًا تخصصيًا."},
 pr:{name:"التقدم", rows:[
  ["التدريس","التخطيط المتمايز والتدريس.","تفاوت محتمل في اتساق التخطيط مع الفروق الفردية ونواتج التعلم. يُثبت من تحليل الخطط والمشاهدة. المستهدف المبدئي: استيفاء 90% من الخطط المعايير المعتمدة.","تحليل عينة قبلية من الخطط والمشاهدات؛ تحديد معايير التخطيط المتمايز؛ بناء نماذج مرتبطة بنواتج قابلة للقياس؛ تخطيط مشترك؛ فحص عينات دورية؛ تعديل التخطيط وفق أعمال الطلاب ونتائج التقويم التكويني.","تحليل خطط؛ ورشة تطبيقية؛ تخطيط مشترك؛ تعلم أقران؛ تغذية راجعة.","الأسابيع 1-6؛ مراجعة كل 4 أسابيع حتى نهاية الفصل.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: رؤساء التخصصات والمعلمون. لجنة التحصيل. دعم استشاري: عند الطلب."],
  ["التدريس","تنفيذ التدريس والتقنية ذات القيمة التعليمية.","الحاجة إلى رفع اتساق التدريس النشط والاستجابة للفروق دون جعل التقنية غاية. يُثبت بالملاحظة الصفية. المستهدف: تحقق المعايير في 85% من الدروس المرصودة.","تحديد ممارستين عاليتي الأثر لكل تخصص؛ تنفيذ دروس نموذجية وتبادل زيارات؛ تفعيل التعلم النشط والمشروعات عند ملاءمتها؛ تجربة تقنية مرتبطة بهدف تعلم؛ تحليل مشاركة الطلاب وأعمالهم؛ تعديل الممارسة.","دروس تطبيقية؛ زيارات تبادلية؛ ملاحظة قصيرة؛ مشروع/صف مقلوب؛ تقنية هادفة.","الأسابيع 3-12؛ قياس قبلي وبعدي ومتابعة شهرية.","المسؤول الأول: مدير المدرسة. التنفيذ: رؤساء التخصصات والمعلمون المتميزون. لجنة التحصيل. دعم تخصصي: عند الحاجة."],
  ["التدريس","جودة التقويم والتغذية الراجعة.","الحاجة إلى ضمان صدق وتنوع التقويم وتحويل نتائجه إلى قرارات تدريس. يُثبت من عينات الأدوات. المستهدف: مراجعة 100% من الاختبارات وتطبيق أدوات متنوعة في 85% من الوحدات.","بناء مواصفات جودة موحدة؛ إعداد أدوات تكوينية ومهام أداء وسلالم تقدير؛ مراجعة الاختبارات قبل تطبيقها؛ تضمين أسئلة تفكير متقدم بحسب المادة والمرحلة؛ تحليل الأخطاء؛ تقديم تغذية راجعة؛ تعديل التدريس.","بنك أدوات؛ سلالم تقدير؛ مهام أداء؛ تحليل أعمال؛ مراجعة أقران للاختبارات.","الأسابيع 2-12؛ مراجعة كل 4 أسابيع وقبل الاختبارات.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: لجنة التحصيل ومعلمو المواد. المراجعة: رؤساء التخصصات. الدعم: عند الطلب."],
  ["نواتج التعلم","تحليل النواتج والاختبارات الوطنية.","الحاجة إلى توحيد تحليل بيانات التعلم وربطها بالتدخلات. يُثبت من آخر النتائج. المستهدف: تحليل 100% من المصادر المتاحة وربط كل فجوة ذات أولوية بتدخل موثق خلال 10 أيام عمل.","تجميع نتائج التقويم الداخلي والوطني؛ التحقق من جودة البيانات؛ تحليلها حسب المهارة والصف والفئة؛ تحديد الفجوات والأسباب؛ إسناد تدخل ومسؤول وزمن؛ محاكاة محدودة للتشخيص؛ مراجعة الاتجاهات واتخاذ قرار تصحيحي.","لوحة بيانات؛ تحليل مهاري؛ اختبار تشخيصي؛ اجتماع قرار؛ محاكاة هادفة.","تحليل تأسيسي خلال أسبوعين؛ تحديث شهري وبعد كل قياس.","المسؤول الأول: مدير المدرسة. التنفيذ: لجنة التحصيل وفريق الاختبارات الوطنية. الدعم عند الطلب."],
  ["نواتج التعلم","تقليص الفجوات وتنمية مهارات التفكير العليا.","تفاوت محتمل في المهارات العليا ووجود فجوات بين الصفوف/الفئات. يُثبت بقياس قبلي. المستهدف: خفض الفجوة ذات الأولوية 20% نسبيًا ورفع متوسط سلم التفكير مستوى.","تشخيص المهارات والتفكير المتقدم؛ تصنيف الاحتياج؛ تصميم دعم وإثراء؛ إدراج مهام تحليل واستدلال وحل مشكلات؛ متابعة أعمال الطلاب بسلم تقدير؛ مقارنة القياس القبلي والبعدي؛ معالجة الفجوات بين الصفوف والفئات.","تعلم متمايز؛ دعم وإثراء؛ مهام بحث وحل مشكلات؛ مشاريع؛ ملفات تعلم.","فصل دراسي؛ متابعة كل أسبوعين وقياس ختامي.","المسؤول الأول: وكيل الشؤون التعليمية. التنفيذ: معلمو المواد ولجنة التحصيل. الشراكة: الأسرة والموجه الطلابي. الدعم: عند الحاجة."],
  ["التوجيه الطلابي","الإرشاد والهوية والشراكة الأسرية.","الحاجة إلى تكامل المسار الأكاديمي والمهني والهوية. يُثبت من الاستبانات والسجلات. المستهدف: ملف مسار لـ100% من الفئة المستهدفة ومعالجة 90% من الحالات ذات الأولوية ضمن المدة المعتمدة.","قياس الاحتياج؛ إعداد ملفات مسار للصفوف المستهدفة؛ برامج هوية واحترام التنوع؛ رصد مؤشرات الغياب والسلوك وفق أدوات معتمدة؛ تدخل وقائي؛ إحالة الحالات حسب الصلاحيات؛ متابعة مشاركة الأسرة وأثرها.","إرشاد أكاديمي ومهني؛ دعم وقائي؛ قيادة طلابية؛ تواصل أسري؛ إحالة مختصة.","فصل دراسي؛ متابعة أسبوعية ومراجعة شهرية.","المسؤول الأول: وكيل شؤون الطلاب. التنفيذ: الموجه الطلابي والمعلمون. الشراكة: الأسرة والتوجيه الطلابي."],

/* ===================== الحالة والتخزين ===================== */
function blank(){
  return {
    v:1,
    school:{admin:"",hdr:"الشؤون التعليمية\nإدارة أداء التعليم - قسم الإشراف التربوي",sector:"",name:"",principal:"",stage:"",gender:"",
            ministryNo:"",building:"",buildingInd:"",period:"",adminInd:"",sharedSchool:"",year:"1448"},
    staff:{}, teachers:DEFAULT_SPECS.map(s=>({spec:s,actual:"",quota:""})), students:{},
    evalType:"", evalVals:{},
    nafs:{vals:{}}, sec:{},
    ind:{},
    swot:{s:[],w:[],o:[],t:[]},
    prio:[], domLevel:{},
    team:[],
    plan:{rows:[], recs:""},
    exec:[],
    step:0
  };
}
function load(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ d=null; }
  const b=blank();
  if(!d||typeof d!=="object") return b;
  /* دمج آمن مع البيانات السابقة: أي حقل ناقص يأخذ قيمته الافتراضية */
  for(const k in b){ if(d[k]===undefined||d[k]===null) d[k]=b[k]; }
  for(const k in b.school){ if(d.school[k]===undefined) d.school[k]=b.school[k]; }
  for(const k of ["s","w","o","t"]){ if(!Array.isArray(d.swot[k])) d.swot[k]=[]; }
  if(!d.plan||typeof d.plan!=="object") d.plan=b.plan;
  if(!Array.isArray(d.plan.rows)) d.plan.rows=[];
  if(typeof d.plan.recs!=="string") d.plan.recs="";
  if(!d.nafs||typeof d.nafs!=="object") d.nafs={vals:{}};
  if(!d.nafs.vals) d.nafs.vals={};
  ["prio","team","exec","teachers"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=b[k]; });
  /* توحيد مسمى «عال» كما في النموذج */
  d.prio.forEach(p=>{ if(p.level==="عالٍ") p.level="عال"; });
  for(const k in d.domLevel){ if(d.domLevel[k]==="عالٍ") d.domLevel[k]="عال"; }
  if(!(d.step>=0 && d.step<9)) d.step=0;
  return d;
}
let S = load();
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ S.updated=new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ alert("تعذر الحفظ في المتصفح: "+e.message); } renderBackupWarn(); markSteps(); },250);
}

/* ===================== أدوات مساعدة ===================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function num(v){
  if(v==null) return null;
  let s=String(v).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,".").replace(/[%٪\s]/g,"");
  if(s==="") return null; const n=parseFloat(s); return isFinite(n)?n:null;
}
function pctOk(v){ const n=num(v); return n!==null && n>=0 && n<=100; }
function fmt(n){ if(n==null) return ""; return (Math.round(n*100)/100).toString(); }
function level(p){ const n=num(p); if(n===null||n<0||n>100) return null; if(n>=90) return "ex"; if(n>=75) return "pr"; if(n>=50) return "st"; return "pp"; }
const LV_NAME={ex:"التميز",pr:"التقدم",st:"الانطلاق",pp:"التهيئة"};
const LV_SHORT={ex:"تميز",pr:"تقدم",st:"انطلاق",pp:"تهيئة"};
function lvBadge(p){ const l=level(p); return l?`<span class="lv ${l}">${LV_NAME[l]}</span>`:`<span class="lv na">—</span>`; }
function getPath(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k],S); }
function setPath(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
function inp(path,ph,extra){ const v=getPath(path); return `<input data-k="${path}" value="${esc(v==null?"":v)}" placeholder="${esc(ph||"")}" ${extra||""}>`; }
function sel(path,opts,ph){ const v=getPath(path)||""; return `<select data-k="${path}"><option value="">${esc(ph||"— اختر —")}</option>${opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`; }
function ta(path,ph,h){ const v=getPath(path); return `<textarea data-k="${path}" placeholder="${esc(ph||"")}"${h?` style="min-height:${h}px"`:""}>${esc(v==null?"":v)}</textarea>`; }
function field(label,html){ return `<div><label class="lb">${label}</label>${html}</div>`; }
function stageGrades(){ return GRADES[S.school.stage] || []; }
function allItems(){
  const seen={}, out=[];
  SUP.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
    const id=it[2]||it[0]; if(seen[id]) return; seen[id]=1;
    out.push({id, code:it[0], text:it[1], dom:d.id});
  })));
  return out;
}
function domById(id){ return SUP.find(d=>d.id===id); }
function domName(did){ const d=domById(did); return d?d.name:""; }
function schoolLv(){ return level(S.evalVals.overall); }
function supportText(){ const l=schoolLv(); return (l==="ex"||l==="pr")?"المشرف التربوي عند الطلب":"مقدم خدمة دعم التميز المدرسي"; }
function teachersWord(){ return S.school.gender==="بنات"?"والمعلمات":"والمعلمين"; }

  switch(i){
    case 0: return !!(S.school.name && S.school.stage && S.school.principal);
    case 1: return Object.values(S.staff).some(v=>v!=="" && v!=null);
    case 2: return EVAL_ROWS.some(r=>pctOk(S.evalVals[r[0]]));
    case 3: return Object.values(S.ind).some(pctOk);
    case 4: return S.swot.s.length+S.swot.w.length>0;

}

function justText(code,text,p,opp){
  const l=level(p);
  if(opp) return `حقق المؤشر (${code}) الخاص بـ(${text}) نسبة ${fmt(p)}% (مستوى ${LV_NAME[l]})، وتبقى فجوة تبلغ ${fmt(100-p)}% تمثل فرصة للارتقاء بالأداء إلى مستوى التميز.`;
  return `سجل المؤشر (${code}) الخاص بـ(${text}) نسبة ${fmt(p)}% (مستوى ${LV_NAME[l]})، مما يشير إلى فجوة أداء تبلغ ${fmt(100-p)}%، ويتطلب ذلك إجراءات تحسين تنقله إلى مستوى التقدم.`;
}
function prioGen(){
  if(!allItems().some(x=>pctOk(S.ind[x.id]))){ alert("أدخل نسب المؤشرات أولًا في خطوة «تحليل المؤشرات»."); return; }
  let added=0;
  PRIO_ORDER.forEach(did=>{
    const d=domById(did), cand=[];
    d.groups.forEach(g=>g.items.forEach(it=>{ const id=it[2]||it[0], p=num(S.ind[id]); if(p!==null&&p>=0&&p<=100) cand.push({id,code:it[0],text:it[1],p}); }));
    let picks=cand.filter(c=>c.p<75).sort((a,b)=>a.p-b.p).map(c=>({...c,opp:false}));
    if(!picks.length){ const low=cand.filter(c=>c.p<100).sort((a,b)=>a.p-b.p)[0]; if(low) picks=[{...low,opp:true}]; }
    picks.forEach(c=>{
      if(S.prio.some(x=>x.dom===did && x.ind===c.id)) return;
      S.prio.push({id:uid(), dom:did, ind:c.id, opp:c.opp, text:c.text, level:suggestLevel(c.p,did,c.opp), just:justText(c.code,c.text,c.p,c.opp)});
      added++;
    });
    const rs=S.prio.filter(x=>x.dom===did && x.level);
    if(rs.length && !S.domLevel[did]) S.domLevel[did]=rs.reduce((a,x)=>RANK[x.level]>RANK[a]?x.level:a,"منخفض");
  });
  save(); render(); toast(added?`أُضيفت ${added} أولوية مقترحة — راجعها وعدّل ما يلزم`:"لا توجد أولويات جديدة");
}

function libRow(p){
  const L=libFor(p.ind,p.dom), pv=num(S.ind[p.ind]), Sx=supportText();
  const lv=level(pv);
  const tgtLv = p.opp ? "90% فأكثر (مستوى التميز)" : "75% فأكثر (مستوى التقدم)";
  const need = `${p.opp?"فرصة: الارتقاء بـ":""}${p.opp?L[0]:L[1]}${pv!==null?`، إذ سجل المؤشر (${codeOf(p.ind)}) نسبة ${fmt(pv)}% (${LV_NAME[lv]})`:""}. المستهدف: ${L[2]}، ورفع نسبة المؤشر إلى ${tgtLv} في التقويم القادم.`;
  return {id:uid(), fromPrio:p.id, src:"lib", dom:domName(p.dom), el:L[0], need, act:L[3]+".", meth:L[4]+".", dur:L[5]+".", resp:L[6].replace("{S}",Sx)};
}
function codeOf(id){ const x=allItems().find(i=>i.id===id); return x?x.code:id; }
function sampleRows(key,domFilter){
  return SAMPLES[key].rows.filter(r=>!domFilter||r[0]===domFilter).map(r=>({id:uid(),src:"sample",dom:r[0],el:r[1],need:r[2],act:r[3],meth:r[4],dur:r[5],resp:r[6]}));
}
function sortPlan(){
  const order=PRIO_ORDER.map(domName);
  S.plan.rows.sort((a,b)=>{ const ia=order.indexOf(a.dom), ib=order.indexOf(b.dom); return (ia<0?99:ia)-(ib<0?99:ib); });
}
function planGen(){
  let added=0;
  const sk=sampleKey();
  PRIO_ORDER.forEach(did=>{
    const ps=S.prio.filter(p=>p.dom===did);
    if(ps.length){
      ps.forEach(p=>{
        if(S.plan.rows.some(r=>r.fromPrio===p.id)) return;
        if(!p.ind){ S.plan.rows.push({id:uid(),fromPrio:p.id,src:"",dom:domName(did),el:p.text,need:p.just,act:"",meth:"",dur:"",resp:""}); added++; return; }
        S.plan.rows.push(libRow(p)); added++;
      });
    } else if(!S.plan.rows.some(r=>r.dom===domName(did))){
      sampleRows(sk,domName(did)).forEach(r=>{ S.plan.rows.push(r); added++; });
    }
  });
  if(!S.plan.recs.trim()) S.plan.recs=SAMPLES[sk].recs;
  sortPlan();
  save(); render(); toast(added?`أُضيف ${added} صفًا مقترحًا — راجع الصياغة وعدّلها`:"الخطة تحتوي جميع الأولويات مسبقًا");
}

function committeeOf(resp){
  const m=(resp||"").match(/لجنة [^.،؛:]+?(?=\s(?:و|بالشراكة|ورؤساء|ومعلمو|والمعلمون)|[.،؛:]|$)/);
  return m?m[0].trim():"لجنة التميز";
}
function weekFill(wi){
  if(!S.plan.rows.length){ alert("لا توجد صفوف في استمارة (1). أنشئ الخطة أولًا."); return; }
  const w=S.exec[wi], k=Math.max(0,WEEKS.indexOf(w.week));
  w.rows=(w.rows||[]).filter(r=>r.dom||r.el||r.done);
  S.plan.rows.forEach(r=>{
    const steps=(r.act||"").replace(/\.$/,"").split("؛").map(x=>x.trim()).filter(Boolean);
    if(!steps.length) return;
    const st=steps[Math.min(k,steps.length-1)];
    if(w.rows.some(x=>x.el===r.el && x.done===st)) return;
    w.rows.push({dom:r.dom, el:r.el, done:st, time:"خلال الأسبوع", com:committeeOf(r.resp), sup:""});
  });
  save(); render(); toast("أُضيفت إجراءات مقترحة — احذف ما لم يُنفذ وعدّل الصياغة");
}

function parseTextSeq(txt,res){
  const tok=txt.match(/\d-\d-\d-\d|\d{1,3}(?:\.\d+)?\s*%/g)||[], used={};
  tok.forEach((t,i)=>{
    if(!/^\d-\d-\d-\d$/.test(t)) return;
    const isP=j=>j>=0&&j<tok.length&&!used[j]&&/%$/.test(tok[j]);
    const j=isP(i-1)?i-1:(isP(i+1)?i+1:-1);
    if(j>-1){ used[j]=1; const v=parseFloat(tok[j]); if(v<=100) res.ind[t]=pv(v); }
  });
  const m=txt.match(/[S$5]-(\d{4,6})/); if(m&&!res.mno) res.mno="S-"+m[1];
}
function findBadge(cv,X0,Y0,X1,Y1){
  /* يحدد أول شارة ملونة (نص أبيض على خلفية ملونة) داخل المنطقة، ويجهزها للقراءة */
  X0=Math.max(0,Math.round(X0)); Y0=Math.max(0,Math.round(Y0)); X1=Math.min(cv.width,Math.round(X1)); Y1=Math.min(cv.height,Math.round(Y1));
  const w0=X1-X0, h0=Y1-Y0; if(w0<10||h0<10) return null;
  const d=cv.getContext("2d").getImageData(X0,Y0,w0,h0).data;
  const sat=(x,y)=>{ const i=(y*w0+x)*4, r=d[i],g=d[i+1],b=d[i+2]; return Math.max(r,g,b)-Math.min(r,g,b)>70 && Math.max(r,g,b)>80; };
  let top=-1,bot=-1;
  for(let y=0;y<h0;y++){ let c=0; for(let x=0;x<w0;x+=2) if(sat(x,y)) c++; if(c>12){ if(top<0) top=y; bot=y; } else if(top>=0 && y-bot>4) break; }
  if(top<0||bot-top<12) return null;
  let l=-1,rr=-1;
  for(let y=top;y<=bot;y+=Math.max(1,Math.floor((bot-top)/6))) for(let x=0;x<w0;x++) if(sat(x,y)){ if(l<0||x<l) l=x; if(x>rr) rr=x; }
  if(l<0||rr-l<20) return null;
  /* إزالة الحواف الدائرية للشارة قبل القراءة */
  const ix=Math.round(Math.min((bot-top)/2,(rr-l)*0.15)), iy=2;
  l+=ix; rr-=ix; top+=iy; bot-=iy;
  const w=rr-l, h=bot-top, k=h<80?4:3, c=document.createElement("canvas"); c.width=w*k; c.height=h*k;
  const cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height); cx.drawImage(cv,X0+l,Y0+top,w,h,0,0,w*k,h*k);
  const im=cx.getImageData(0,0,c.width,c.height), p=im.data;
  for(let i=0;i<p.length;i+=4){ const v=Math.min(p[i],p[i+1],p[i+2])>170?0:255; p[i]=p[i+1]=p[i+2]=v; }
  cx.putImageData(im,0,0);
  return {canvas:c, box:{x0:X0+l,x1:X0+rr,y0:Y0+top,y1:Y0+bot}};
}
async function readBadge(worker,badge){
  if(!badge) return null;
  const r=await worker.recognize(badge.canvas), m=String(r.data.text||"").replace(/[ \t]/g,"").match(/(\d{1,3}(?:\.\d+)?)%/);
  if(!m) return null; const v=parseFloat(m[1]); return (v>=0&&v<=100)?v:null;
}
async function importReport(file){
  if(!file) return;
  try{
    impSet("جارٍ تحميل أدوات القراءة...");
    await loadScript(CDN.pdf);
    pdfjsLib.GlobalWorkerOptions.workerSrc=CDN.pdfWorker;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const res={ind:{},eval:{},name:"",type:"",mno:"",pages:pdf.numPages};
    try{
      const meta=await pdf.getMetadata(), title=(meta&&meta.info&&meta.info.Title)||file.name||"";
      const m=title.match(/^(.+?)\s*-\s*تقرير التقويم المدرسي\s*-\s*(\S+)/);
      if(m){ res.name=m[1].trim(); res.type=/خارجي/.test(m[2])?"خارجي":/ذاتي/.test(m[2])?"ذاتي":""; }
    }catch(e){}
    let worker=null;
    for(let p=1;p<=pdf.numPages;p++){
      impSet(`قراءة الصفحة ${p} من ${pdf.numPages}...`);
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent(), txt=tc.items.map(i=>i.str).join(" ");
      if(/\d-\d-\d-\d/.test(txt)){ parseTextSeq(txt,res); continue; }
      const vp=page.getViewport({scale:1650/page.getViewport({scale:1}).width});
      const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      if(!worker){
        impSet(`تحميل محرك التعرف على الأرقام (مرة واحدة)... الصفحة ${p} من ${pdf.numPages}`);
        await loadScript(CDN.tess);
        worker=await Tesseract.createWorker("eng",1,{workerPath:CDN.tessWorker,corePath:CDN.tessCore,langPath:CDN.tessLang});
        impSet(`قراءة الصفحة ${p} من ${pdf.numPages}...`);
      }
      await worker.setParameters({tessedit_pageseg_mode:"11",tessedit_char_whitelist:""});
      const {data}=await worker.recognize(cv);
      const W=cv.width, H=cv.height, codes=[], pcts=[];
      wordsOf(data).forEach(w=>{
        const t=String(w.text||"").replace(/[|,،]/g,"").trim(), b=w.bbox||{};
        const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;
        let m=t.match(/^(\d)-(\d)-(\d)-(\d)$/); if(m) codes.push({code:m.slice(1).join("-"),cx,cy});
        m=t.match(/^(\d{1,3}(?:\.\d+)?)%$/); if(m && parseFloat(m[1])<=100) pcts.push({v:parseFloat(m[1]),cx,cy,used:false});
        m=t.match(/^[S$5]-(\d{4,6})$/); if(m && !res.mno) res.mno="S-"+m[1];
      });
      /* قراءة شارة النسبة لكل مؤشر مباشرة (أدق)، ثم المطابقة بالموضع احتياطًا */
      await worker.setParameters({tessedit_pageseg_mode:"6",tessedit_char_whitelist:""});
      for(const c of codes){
        const v=await readBadge(worker,findBadge(cv,0,c.cy-H*0.04,W*0.3,c.cy+H*0.035));
        if(v!==null){ res.ind[c.code]=pv(v); pcts.forEach(q=>{ if(Math.abs(q.cy-c.cy)<H*0.03 && q.cx<c.cx) q.used=true; }); continue; }
        let best=null,bd=1e9;
        pcts.forEach(q=>{ if(q.used||q.cx>c.cx) return; const d=Math.abs(q.cy-c.cy); if(d<H*0.03&&d<bd){bd=d;best=q;} });
        if(best){ best.used=true; res.ind[c.code]=pv(best.v); }
      }
      let pill=null;
      if(p===1){
        pill=findBadge(cv,0,H*0.3,W*0.35,H*0.5);
        const v=await readBadge(worker,pill); if(v!==null) res.eval.overall=pv(v);
      }
      if(p===1 && !codes.length){
        /* أعمدة «أداء المدرسة وفق المجالات» من اليمين: الإدارة المدرسية، التعليم والتعلم، نواتج التعلم، البيئة المدرسية */
        const band=pcts.filter(q=>q.cy>H*0.33&&q.cy<H*0.75&&!(pill&&q.cx<=pill.box.x1+5&&q.cy>=pill.box.y0-5&&q.cy<=pill.box.y1+5)).sort((a,b)=>b.cx-a.cx);
        if(band.length===4) ["adm","tl","out","env"].forEach((k,i)=>res.eval[k]=pv(band[i].v));
      }
    }
    if(worker) await worker.terminate();
    res.ind=mapReport(res.ind);
    if(!Object.keys(res.ind).length && !Object.keys(res.eval).length) throw new Error("لم أتمكن من قراءة نسب من هذا الملف. تأكد أنه تقرير التقويم المدرسي المنزّل من المنصة، أو أدخل النسب يدويًا.");
    IMP={res};
  }catch(err){ IMP={err:String((err&&err.message)||err)}; }
  renderImport();
}
function applyImport(){
  if(!IMP||!IMP.res) return;
  const r=IMP.res; let n=0;
  for(const k in r.eval){ S.evalVals[k]=r.eval[k]; n++; }
  if(r.type) S.evalType=r.type;
  allItems().forEach(x=>{ if(x.id.indexOf("SEC-")===0) return; if(r.ind[x.id]!==undefined){ S.ind[x.id]=r.ind[x.id]; n++; } });
  const cbx=document.getElementById("impBasic");
  if(cbx&&cbx.checked){ if(r.name&&!S.school.name) S.school.name=r.name; if(r.mno&&!S.school.ministryNo) S.school.ministryNo=r.mno; }
  IMP=null; save(); render(); toast(`تم اعتماد ${n} قيمة من التقرير ✓ راجع خطوة «تحليل المؤشرات»`);
}

    case "planSample": { const lv=document.getElementById("smpLevel").value; const rs=sampleRows(lv); rs.forEach(r=>S.plan.rows.push(r)); sortPlan(); if(!S.plan.recs.trim()) S.plan.recs=SAMPLES[lv].recs; toast(`أُدرج ${rs.length} صفًا من النموذج الاسترشادي — عدّلها لتناسب مدرستك`); break; }
    case "planAdd": S.plan.rows.push({id:uid(),src:"",dom:"",el:"",need:"",act:"",meth:"",dur:"",resp:""}); break;

    case "planUp": { const r=S.plan.rows; [r[i-1],r[i]]=[r[i],r[i-1]]; break; }

    case "weekAdd": { const nx=WEEKS[S.exec.length]||""; S.exec.push({id:uid(),week:nx,from:"",to:"",rows:[],recs:""}); break; }
    case "weekDel": if(!confirm("حذف استمارة هذا الأسبوع بالكامل؟")) return; S.exec.splice(i,1); break;
    case "weekFill": weekFill(i); return;
    case "exRowAdd": S.exec[i].rows.push({dom:"",el:"",done:"",time:"",com:"",sup:""}); break;

    {id:"improvement", href:"improvement-plan.html", title:"تحليل الواقع وخطة التحسين", keys:["IMPPLAN_"]},
    {id:"activity", href:"activity-plan.html", title:"خطة النشاط الطلابي وبطاقات التنفيذ", keys:["ACTPLAN_"]}
  ];
  var ALL_PREFIXES = ["moe_","SCV2","JOBDESC_","VIOL_","IMPPLAN_","ACTPLAN_"];

        items.push(((p.plan && p.plan.rows) || []).length + " إجراء تحسين");
        items.push((p.exec || []).length + " أسبوع تنفيذ");
      } else if(k === "ACTPLAN_V1" && p && typeof p === "object"){
        items.push((p.entries || []).length + " برنامج نشاط");
        items.push((p.teachers || []).length + " معلم في الإسناد");
      } else if(Array.isArray(p) && LABELS[k]){
        items.push(p.length + " " + LABELS[k]);
      }
    });
    var meta = keys.filter(function(k){ return k.indexOf("moe_meta_")===0 && s.getItem(k); }).length;
    if(meta) items.push("بيانات المدرسة");
    var RECORD_KEYS = ["moe_behavior_records_v1","moe_absence_records_v1","moe_compensation_records_v1","JOBDESC_PRINTLOG_V1"];
    var hasData = keys.some(function(k){
      var p = null; try{ p = JSON.parse(s.getItem(k)); }catch(e){ return false; }
      if(k === "VIOL_LAST_V1") return !!(p && Array.isArray(p.arr) && p.arr.length);
      if(k === "SCV2") return !!(p && ["staff","comms","decs","meets"].some(function(x){ return (p[x]||[]).length; }));
      if(k === "IMPPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.plan && p.plan.rows && p.plan.rows.length) || (p.exec && p.exec.length) || (p.prio && p.prio.length)));
      if(k === "ACTPLAN_V1") return !!(p && typeof p === "object" && ((p.entries && p.entries.length) || (p.teachers && p.teachers.length)));
      return RECORD_KEYS.indexOf(k) > -1 && Array.isArray(p) && p.length > 0;
    });
    return {keys:keys, items:items, hasData:hasData};
  }

  /* ---- export ---- */
  function doExport(scope){
    var s = ls(); if(!s){ alert("المتصفح لا يسمح بالوصول للتخزين المحلي."); return; }
    var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
    var keys = keysFor(prefixes);
    if(keys.indexOf("SCV2") > -1){ // مزامنة تاريخ آخر نسخة مع تنبيه نظام اللجان
      try{
        if(PAGE === "committees" && typeof db === "object" && db && db.meta){
          db.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(db));
          if(typeof renderDbWarn === "function") renderDbWarn();
          if(typeof renderBackupInfo === "function") renderBackupInfo();
        } else {
          var sc = JSON.parse(s.getItem("SCV2")||"null");
          if(sc && typeof sc === "object"){ sc.meta = sc.meta || {}; sc.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(sc)); }
        }
      }catch(e){}
    }
    if(!keys.length){ toast("لا توجد بيانات محفوظة لتصديرها"); return; }
    var data = {}; keys.forEach(function(k){ data[k] = s.getItem(k); });
    var now = new Date();
    var pack = {app:APP, v:1, scope:scope, title: scope==="all" ? "جميع الأقسام" : cur.title,
                createdAt: now.toISOString(), keys:data};
    var name = (scope==="all" ? "جميع-الأقسام" : cur.title.replace(/\s+/g,"-")) + "-نسخة-احتياطية-" + now.toISOString().slice(0,10) + ".json";
    var blob = new Blob([JSON.stringify(pack)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    s.setItem(lastKey(scope), now.toISOString());
    if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), now.toISOString()); });
    else s.setItem(lastKey(scope), now.toISOString());
    render(); refreshDot();
    toast("تم تنزيل النسخة الاحتياطية ✓ احفظها في بريدك أو OneDrive");
  }

  /* ---- import ---- */
  function doImport(scope, file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var p; try{ p = JSON.parse(r.result); }catch(e){ alert("الملف ليس نسخة احتياطية صالحة (JSON)."); return; }
      var s = ls(); if(!s) return;
      var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
      var incoming = {};
      if(p && p.app === APP && p.keys && typeof p.keys === "object"){
        Object.keys(p.keys).forEach(function(k){ if(matches(k, prefixes) && typeof p.keys[k] === "string") incoming[k] = p.keys[k]; });
      } else if(p && Array.isArray(p.staff) && Array.isArray(p.comms) && matches("SCV2", prefixes)){
        incoming.SCV2 = JSON.stringify(p); // نسخة قديمة من نظام اللجان
      } else {
        alert("هذا الملف لا يطابق نسخ هذا الموقع، لم تتم الاستعادة."); return;
      }
      var n = Object.keys(incoming).length;
      if(!n){ alert("الملف لا يحتوي بيانات خاصة بهذا القسم. جرّب الاستيراد من «النسخة الشاملة» أو من القسم الصحيح."); return; }
      var when = p.createdAt ? "\nتاريخ النسخة: " + fmtDate(p.createdAt) : "";
      if(!confirm("سيتم استبدال بيانات " + (scope==="all" ? "جميع الأقسام" : "هذا القسم") + " على هذا الجهاز ببيانات الملف." + when + "\n\nمتابعة؟")) return;
      keysFor(prefixes).forEach(function(k){ s.removeItem(k); });
      Object.keys(incoming).forEach(function(k){ s.setItem(k, incoming[k]); });
      var stamp = p.createdAt || new Date().toISOString(); // البيانات مطابقة لهذه النسخة
      s.setItem(lastKey(scope), stamp);
      if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), stamp); });
      alert("تمت الاستعادة بنجاح ✓ سيُعاد تحميل الصفحة لعرض البيانات.");
      location.reload();
    };
    r.readAsText(file);
  }

  /* ---- UI ---- */
  var icoHome = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M3.5 11L12 4l8.5 7"/><path stroke-linejoin="round" d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
  var icoSave = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>';

  function box(scope, title, prefixes, extra){
    var sm = summary(prefixes), last = getLast(scope);
    return '<div class="pn-box"><h3>' + title + '</h3>' + (extra||"") +
      '<div class="pn-meta">آخر نسخة احتياطية من هذا الجهاز: <b>' + (last ? fmtDate(last) : "لم تُنشأ بعد") + '</b></div>' +
      (sm.items.length ? '<ul class="pn-sum">' + sm.items.map(function(x){return "<li>"+x+"</li>";}).join("") + '</ul>'
                       : '<p class="pn-note" style="margin-bottom:10px">لا توجد بيانات محفوظة على هذا الجهاز حاليًا.</p>') +
      '<div class="pn-acts"><button type="button" class="pn-exp" data-exp="' + scope + '">⬇️ تصدير نسخة</button>' +
      '<label class="pn-imp">⬆️ استيراد نسخة<input type="file" accept=".json,application/json" data-imp="' + scope + '"></label></div></div>';
  }

  function render(){
    var body = $("pnBody"); if(!body) return;
    var html = '<div class="pn-steps"><b>لنقل بياناتك إلى جهاز آخر:</b><ol>' +
      '<li>اضغط «تصدير نسخة» على هذا الجهاز، فيُنزَّل ملف بصيغة JSON.</li>' +
      '<li>أرسل الملف لنفسك (البريد، OneDrive، واتساب…).</li>' +
      '<li>افتح نفس القسم على الجهاز الآخر، ثم «استيراد نسخة» واختر الملف.</li></ol></div>';
    if(cur && cur.keys.length){
      var stale = isStale(cur.id, cur.keys);
      html += box(cur.id, "نسخة هذا القسم: " + cur.title, cur.keys,
        stale ? '<p class="pn-warn">⚠️ لديك بيانات بدون نسخة احتياطية حديثة. البيانات محفوظة في متصفح هذا الجهاز فقط، ومسح المتصفح يفقدها.</p>' : "");
    } else if(cur){
      html += '<div class="pn-box"><h3>' + cur.title + '</h3><p class="pn-note">هذا القسم لا يحفظ بيانات على الجهاز؛ فهو يحلل الملفات التي ترفعها مباشرة، لذلك لا يحتاج نسخة خاصة. لنقل بيانات الأقسام الأخرى استخدم النسخة الشاملة.</p></div>';
    }
    html += box("all", "نسخة شاملة لجميع الأقسام", ALL_PREFIXES,
      '<p class="pn-note" style="margin-bottom:6px">تشمل: نماذج السلوك والمواظبة، وآخر تحليل لمحلل المخالفات، واللجان والتكليفات، والوصف الوظيفي، وتحليل الواقع وخطة التحسين، وخطة النشاط الطلابي — في ملف واحد.</p>');
    body.innerHTML = html;
  }

  function isStale(scope, prefixes){
    if(!summary(prefixes).hasData) return false;
    var last = getLast(scope) || getLast("all");
    if(!last) return true;
    return (Date.now() - new Date(last).getTime()) / 86400000 >= REMIND_DAYS;
  }
  function refreshDot(){
    var b = $("pnBackupBtn"); if(!b) return;
    var warn = cur && cur.keys.length ? isStale(cur.id, cur.keys) : false;
    b.classList.toggle("warn", !!warn);
    b.title = warn ? "لا توجد نسخة احتياطية حديثة لبيانات هذا القسم" : "النسخ الاحتياطي ونقل البيانات";
  }

  function open(){ render(); $("pnOv").classList.add("open"); var x=$("pnOv").querySelector(".pn-x"); if(x) x.focus(); }
  function close(){ $("pnOv").classList.remove("open"); }

  function build(){
    if(PAGE !== "home"){
      var bar = document.createElement("nav");
      bar.className = "pn-bar"; bar.setAttribute("aria-label","التنقل بين الأقسام");
      var opts = SECTIONS.map(function(s){
        return '<option value="' + s.href + '"' + (s.id===PAGE?" selected":"") + (s.disabled?" disabled":"") + '>' +
          s.title + (s.disabled?" (مغلق للتطوير)":"") + '</option>';
      }).join("");
      bar.innerHTML = '<a class="pn-home" href="index.html">' + icoHome + '<span>الرئيسية</span></a>' +
        '<div class="pn-sec"><label for="pnSel">الانتقال إلى:</label><select id="pnSel">' + opts + '</select></div>' +
        '<button type="button" class="pn-btn" id="pnBackupBtn">' + icoSave + '<span class="pn-t">النسخ الاحتياطي</span><span class="pn-dot"></span></button>';
      document.body.insertBefore(bar, document.body.firstChild);
      $("pnSel").addEventListener("change", function(){ if(this.value) location.href = this.value; });
      $("pnBackupBtn").addEventListener("click", open);
    }
    var ov = document.createElement("div");
    ov.className = "pn-ov"; ov.id = "pnOv";
    ov.innerHTML = '<div class="pn-modal" role="dialog" aria-modal="true" aria-labelledby="pnTitle">' +
      '<div class="pn-mh"><h2 id="pnTitle">النسخ الاحتياطي ونقل البيانات</h2><button type="button" class="pn-x" aria-label="إغلاق">✕</button></div>' +
      '<div class="pn-mb" id="pnBody"></div></div>';
    document.body.appendChild(ov);
    var t = document.createElement("div"); t.className = "pn-toast"; t.id = "pnToast"; document.body.appendChild(t);
    ov.addEventListener("click", function(e){
      if(e.target === ov || e.target.closest(".pn-x")) return close();
      var ex = e.target.closest("[data-exp]"); if(ex) doExport(ex.getAttribute("data-exp"));
    });
    ov.addEventListener("change", function(e){
      var inp = e.target.closest("[data-imp]"); if(inp){ doImport(inp.getAttribute("data-imp"), inp.files[0]); inp.value = ""; }
    });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && ov.classList.contains("open")) close(); });
    refreshDot();
  }

  window.PN = {open:open};
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
})();
</script>
<!-- ===== /PORTAL NAV & BACKUP ===== -->
</body>
</html>
