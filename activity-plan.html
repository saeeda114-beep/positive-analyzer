<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطة النشاط الطلابي وبطاقات التنفيذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0a2733;--navy-800:#0f3d4c;--teal-700:#155a6c;--teal-600:#1d5c6e;--teal-500:#237e93;
  --gold:#c99a45;--bg:#f3f6f8;--line:#dbe4ea;--muted:#5c7180;--ink:#16232b;--rd:#b3261e;
  --shadow:0 2px 8px rgba(10,39,51,.06),0 10px 30px rgba(10,39,51,.06);
  --form:#0e7c7b;--card-lbl:#d3e3e8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
button{font-family:inherit;}
header.top{background:linear-gradient(135deg,var(--navy-900),var(--navy-800) 60%,var(--teal-700));color:#fff;padding:22px 24px;}
header.top .in{max-width:1180px;margin:0 auto;}
header.top h1{margin:0 0 4px;font-size:22px;font-weight:900;}
header.top p{margin:0;font-size:13px;color:#cfe0e6;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px;}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--navy-800);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.step .n{width:22px;height:22px;border-radius:50%;background:#e6eef2;color:var(--navy-800);display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
.step.done .n{background:#13824a;color:#fff;}
.step.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.step.active .n{background:var(--gold);color:#3a2a06;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:16.5px;color:var(--navy-800);border-inline-start:4px solid var(--gold);padding-inline-start:10px;}
.card h3{margin:14px 0 8px;font-size:14.5px;color:var(--teal-600);}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
.note{background:#fff8e8;border-inline-start:4px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.sugg{background:#eef7f4;border-inline-start:4px solid #13824a;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.warnbar{background:#fbeceb;color:#8f2a22;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
label.lb{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd9de;border-radius:8px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-500);outline-offset:0;border-color:var(--teal-500);}
textarea{min-height:60px;resize:vertical;line-height:1.7;}
.g{display:grid;gap:12px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--teal-600);color:#fff;} .btn.primary:hover{background:var(--teal-500);}
.btn.gold{background:var(--gold);color:#3a2a06;} .btn.gold:hover{background:#dba94f;}
.btn.light{background:#eef3f5;color:var(--navy-800);border:1px solid var(--line);}
.btn.danger{background:#fdecea;color:var(--rd);border:1px solid #f4c7c2;padding:6px 10px;font-size:12.5px;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.between{justify-content:space-between;}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:right;}
.tbl th{background:#eef4f6;color:var(--navy-800);font-weight:800;}
.tbl td input,.tbl td select{padding:6px 7px;font-size:13px;}
.scroll{overflow-x:auto;}
.num{text-align:center !important;}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:20px;padding:1px 9px;background:#e8f3ef;color:#13704b;}
.pill.warn{background:#fdecea;color:var(--rd);}
.pill.blue{background:#eaf1fb;color:#1f5fa8;}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.libi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fbfdfd;font-size:13px;}
.libi b{font-weight:700;}
.libi .s{font-size:11.5px;color:var(--muted);}
.libi.added{border-color:#13824a;background:#f0f8f4;}
.ent{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfdfd;}
.ent.done{border-inline-start:5px solid #13824a;}
details.dom{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
details.dom summary{cursor:pointer;font-weight:800;color:var(--navy-800);}
.example{display:inline-block;border:1.5px solid var(--navy-800);border-radius:6px;padding:6px 10px;text-align:center;font-size:12.5px;line-height:1.5;background:#fff;min-width:150px;}
.example .t{font-weight:800;}
.example .p{color:#b3261e;font-weight:800;}
.hidden{display:none !important;}

/* ===================== PRINT ===================== */
#printArea{display:none;}
.gc{background:#eef7f3;border:1px solid #cfe5da;border-radius:7px;padding:4px 6px;margin:2px 0;font-size:11.5px;line-height:1.45;display:flex;flex-direction:column;}
.gc b{color:#0b3d2e;} .gc .p{background:#fde9c9;color:#7a4b00;border-radius:4px;padding:0 4px;font-size:10px;font-weight:800;}
.gc.day{background:#fff6e5;border-color:#f1d9a8;}
table.wg td{vertical-align:top;min-width:110px;} table.wg td.dn{font-weight:800;white-space:nowrap;min-width:80px;}
.cbox{margin-top:10px;border:1px dashed #b9d8cb;border-radius:10px;padding:8px 12px;background:#fbfefc;}
.cbox summary{cursor:pointer;font-weight:800;color:#0b3d2e;}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-top:8px;}
@media(max-width:700px){.cgrid{grid-template-columns:1fr;}}
.magic{border:2px solid #c99a45;background:linear-gradient(180deg,#fffaf0,#fff);}
.pctwarn{color:#c0392b;font-size:11px;font-weight:800;display:block;}
@media print{
  @page{size:A4 portrait;margin:10mm;}
  @page land{size:A4 landscape;margin:9mm 10mm;}
  body{background:#fff;}
  body.printing > *:not(#printArea){display:none !important;}
  body.printing #printArea{display:block;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #printArea .land{page:land;}
}
#printArea{font-family:'Tajawal',Arial,sans-serif;color:#111;font-size:11pt;line-height:1.5;}
#printArea thead{display:table-header-group;}
#printArea .pg{page-break-after:always;break-after:page;}
#printArea .pg:last-child{page-break-after:auto;break-after:auto;}
#printArea table{width:100%;border-collapse:collapse;}
#printArea th,#printArea td{border:1px solid #333;padding:4px 6px;font-size:10pt;vertical-align:middle;text-align:right;}
#printArea th{background:var(--form);color:#fff;font-weight:800;text-align:center;}
#printArea td.c{text-align:center;}
#printArea tr{break-inside:avoid;page-break-inside:avoid;}
#printArea .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--form);padding-bottom:4px;margin-bottom:8px;}
#printArea .ph .r{font-size:9pt;font-weight:800;line-height:1.45;text-align:center;}
#printArea .ph img{height:15mm;}
#printArea .ph .l{font-size:9pt;text-align:left;line-height:1.45;}
#printArea h1{font-size:16pt;text-align:center;color:var(--form);margin:4px 0 6px;}
#printArea h2{font-size:12pt;color:var(--form);margin:8px 0 5px;}
#printArea table.pp td{font-size:10pt;} #printArea td.l{background:#eef5f2;font-weight:800;width:18%;}
#printArea .ctl{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:10pt;}
#printArea table.ops td,#printArea table.ops th{font-size:7.6pt;padding:1px 3px;line-height:1.25;}
#printArea section.pp-pg p{margin:2px 0;font-size:10pt;} #printArea section.pp-pg h2{margin:5px 0 3px;font-size:11pt;}
#printArea table.wg td{vertical-align:top;font-size:8pt;padding:2px;} #printArea table.wg td.dn{width:12%;font-weight:800;text-align:center;}
#printArea .gc{border:1px solid #999;border-radius:3px;padding:1px 3px;margin:1px 0;font-size:7.8pt;line-height:1.3;background:#f4f9f6;}
#printArea .gc .p{font-size:7pt;}
#printArea .gc{display:block;font-size:7.2pt;padding:0 2px;} #printArea .gc span{margin-inline-start:4px;} #printArea section.land table.wg td{height:auto;}
#printArea .goal{border:1.5px solid var(--form);border-radius:8px;padding:8px 12px;margin:6px 0 10px;background:#f2f9f8;}
#printArea .doms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
#printArea .doms div{border:1px solid #9cc;border-radius:8px;padding:6px 8px;font-size:9.5pt;}
#printArea .doms b{display:block;color:var(--form);font-size:10.5pt;}
#printArea .sig{display:flex;justify-content:space-between;margin-top:14px;font-weight:800;}
/* بطاقة التنفيذ */
#printArea .cardpg{max-width:180mm;margin:0 auto;}
#printArea .cardhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
#printArea .cardhd img{height:16mm;}
#printArea .cardhd h1{flex:1;margin:0;font-size:15pt;color:#111;}
#printArea table.ec td{font-size:11pt;padding:7px 8px;height:11mm;}
#printArea table.ec td.l{width:32%;font-weight:800;}
#printArea table.ec tr:nth-child(even) td{background:var(--card-lbl);}
#printArea table.ec td.sub{font-size:9.5pt;width:22%;text-align:center;}
#printArea .cb{display:inline-block;white-space:nowrap;margin-inline-end:8px;}
#printArea .cb i{display:inline-block;width:10px;height:10px;border:1.3px solid #222;border-radius:50%;margin-inline-end:4px;vertical-align:-1px;font-style:normal;font-size:8px;line-height:8px;text-align:center;font-weight:900;}
#printArea .sigs{display:flex;justify-content:space-between;margin-top:12px;font-weight:700;line-height:2;}
#printArea .fnote{font-size:9.5pt;margin-top:12px;}
#printArea table.mx td,#printArea table.mx th{font-size:8.8pt;padding:2px 4px;text-align:center;}
#printArea table.mx th{background:#dbe5f1;color:#111;}
#printArea table.mx td.p{text-align:right;font-weight:700;}
#printArea table.mx td.d{font-weight:900;font-size:10pt;}

/* ===== ملاءمة الجوال ===== */
@media(max-width:700px){
  header.top{padding:14px 16px;} header.top h1{font-size:18px;} header.top p{font-size:12px;line-height:1.6;}
  .wrap{padding:10px 10px 30px;}
  .steps{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:0;z-index:30;background:var(--bg);margin:0 -10px 12px;padding:8px 10px;}
  .steps::-webkit-scrollbar{display:none;}
  .step{flex:0 0 auto;white-space:nowrap;}
  .card{padding:14px 12px;border-radius:12px;}
  .card h2{font-size:15.5px;}
  .tbl.stack thead{display:none;}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%;}
  .tbl.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fbfdfd;}
  .tbl.stack td{border:0;padding:4px 0;text-align:right !important;}
  .tbl.stack td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px;}
  .navbtns{position:sticky;bottom:0;z-index:20;background:var(--bg);padding:8px 0;margin-top:0;}
  .btn{padding:9px 13px;}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>خطة النشاط الطلابي وبطاقات التنفيذ</h1>
  <p>خطة برامج النشاط الطلابي وإسنادها للمعلمين، وبطاقات تنفيذ البرامج والمسابقات، ونموذج ربط البرامج بالمستهدفات — وفق دليل الخطط الدراسية (الإصدار السادس) لعام 1448هـ.</p>
</div></header>
<div class="wrap" id="app">
  <div id="backupWarn"></div>
  <nav class="steps" id="steps"></nav>
  <div id="view"></div>
</div>
<div id="printArea"></div>

/* ===================== الحالة والتخزين ===================== */
function blank(){ return {v:1, school:{name:"",admin:"",stage:"",gender:"",year:"1448",sem:"",leader:"",principal:"",dayPeriods:"7"},
  teachers:[], entries:[], cal:{start:"",weeks:"",hol:"",off:{},opts:{comps:true,days:true,start:"3"}}, step:0}; }
function load(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  const b=blank(); if(!d||typeof d!=="object") return b;
  for(const k in b) if(d[k]===undefined||d[k]===null) d[k]=b[k];
  for(const k in b.school) if(d.school[k]===undefined) d.school[k]=b.school[k];
  if(!Array.isArray(d.teachers)) d.teachers=[]; if(!Array.isArray(d.entries)) d.entries=[];
  d.entries.forEach(e=>{ if(!e.card||typeof e.card!=="object") e.card={}; });
  if(!d.cal||typeof d.cal!=="object") d.cal=b.cal;
  for(const k in b.cal) if(d.cal[k]===undefined||d.cal[k]===null) d.cal[k]=b.cal[k];
  for(const k in b.cal.opts) if(d.cal.opts[k]===undefined) d.cal.opts[k]=b.cal.opts[k];
  if(!(d.step>=0&&d.step<8)) d.step=0;
  return d;
}
let S=load(), saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ S.updated=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ alert("تعذر الحفظ: "+e.message); } renderBackupWarn(); markSteps(); },250); }

/* ===================== أدوات ===================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function num(v){ if(v==null) return null; const s=String(v).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,".").replace(/[^\d.]/g,""); if(s==="") return null; const n=parseFloat(s); return isFinite(n)?n:null; }
function fmt(n){ return n==null?"":String(Math.round(n*100)/100); }
function getPath(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k],S); }
function setPath(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
function inp(p,ph,ex){ const v=getPath(p); return `<input data-k="${p}" value="${esc(v==null?"":v)}" placeholder="${esc(ph||"")}" ${ex||""}>`; }
function sel(p,opts,ph){ const v=getPath(p)||""; return `<select data-k="${p}"><option value="">${esc(ph||"— اختر —")}</option>${opts.map(o=>{ const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(lab)}</option>`; }).join("")}</select>`; }
function ta(p,ph){ const v=getPath(p); return `<textarea data-k="${p}" placeholder="${esc(ph||"")}">${esc(v==null?"":v)}</textarea>`; }
function field(l,h){ return `<div><label class="lb">${l}</label>${h}</div>`; }
function domName(id){ const d=DOMS.find(x=>x.id===id); return d?d.name:id; }
function stageGroups(){ const s=S.school.stage; return s==="ابتدائي"?[0,1]:s==="متوسط"?[2]:s==="ثانوي"?[3]:[]; }
function libItem(name){ return LIB.find(x=>x[1]===name); }
function sessOf(e){ const it=libItem(e.name); if(!it||e.kind==="comp") return e.sessions||""; const v=it[2][e.grp]; return v==null?"":String(v); }
function sessNum(e){ const n=num(sessOf(e)); return n==null?0:n; }
function yearLabel(){ const y=parseInt(num(S.school.year))||1448; return `${y} – ${y+1} هـ`; }
function teacherName(id){ const t=S.teachers.find(x=>x.id===id); return t?t.name:""; }
function cardDone(e){ const c=e.card||{}; return !!(c.participants && c.endDate); }

const STEPS=[{t:"البيانات الأساسية",r:vBasic},{t:"المعلمون والحصص المتاحة",r:vTeachers},{t:"خطة البرامج والإسناد",r:vPlan},{t:"التوزيع الأسبوعي",r:vDist},{t:"بطاقات التنفيذ",r:vCards},{t:"الربط بالمستهدفات",r:vLink},{t:"الجدول ونسبة النشاط",r:vSchedule},{t:"الطباعة",r:vPrint}];
function stepDone(i){ switch(i){ case 0: return !!(S.school.name&&S.school.stage); case 1: return S.teachers.length>0; case 2: return S.entries.length>0; case 3: return S.entries.some(e=>e.day!==undefined&&e.day!==""); case 4: return S.entries.some(cardDone); default: return false; } }
function markSteps(){ document.querySelectorAll(".step").forEach((b,i)=>{ b.classList.toggle("done",stepDone(i)); b.classList.toggle("active",i===S.step); }); }
function renderSteps(){ document.getElementById("steps").innerHTML=STEPS.map((s,i)=>`<button class="step" data-step="${i}"><span class="n">${i+1}</span>${s.t}</button>`).join(""); markSteps(); }
function go(i){ S.step=Math.max(0,Math.min(STEPS.length-1,i)); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function navBtns(){ return `<div class="navbtns">${S.step>0?`<button class="btn light" data-go="${S.step-1}">→ السابق</button>`:"<span></span>"}${S.step<STEPS.length-1?`<button class="btn primary" data-go="${S.step+1}">التالي ←</button>`:""}</div>`; }
function render(){ markSteps(); document.getElementById("view").innerHTML=STEPS[S.step].r()+navBtns(); document.querySelectorAll("[data-live]").forEach(updateLive); }

function avail(t){
  const w=num(t.weekly), k=num(t.weeks)!==null?num(t.weeks):(calWeeks()?studyWeeks().length:null), p=num(t.pct);
  if(w!==null&&k!==null&&p!==null) return Math.floor(w*k*Math.min(p,MAX_PCT)/100);
  return num(t.avail);
}
function used(tid){ return S.entries.filter(e=>e.teacher===tid).reduce((a,e)=>a+sessNum(e),0); }

    es.forEach(e=>{ const i=S.entries.indexOf(e);

        ${e.kind==="comp"?field("حصص الإعداد والتأهيل",inp(`entries.${i}.sessions`,"",'inputmode="numeric"')):field("عدد حصص البرنامج",`<input value="${esc(sessOf(e))}" disabled data-live="sess" data-i="${i}">`)}
        ${field("الصف / الفصل",inp(`entries.${i}.cls`,"مثال: 2/1"))}
        ${field("المعلم/ة المنفذ/ة",tOpts.length?sel(`entries.${i}.teacher`,tOpts):`<input disabled placeholder="أضف المعلمين أولًا">`)}
        ${field("تاريخ بداية التنفيذ",inp(`entries.${i}.start`,"1448/  /  هـ"))}
        ${field("الفصل الدراسي",sel(`entries.${i}.sem`,SEMS,S.school.sem||"— الفصل —"))}
        ${field(e.dom==="day"?"أسبوع المناسبة":"أسبوع البداية",inp(`entries.${i}.wk`,e.dom==="day"?"":String((S.cal.opts||{}).start||3),'inputmode="numeric"'))}
        ${e.dom==="day"?"":field("اليوم",sel(`entries.${i}.day`,DAYS.map((d,k)=>[String(k),d]),"تلقائي"))+field("الحصة",sel(`entries.${i}.per`,Array.from({length:perDay()},(_,k)=>String(k+1)),"تلقائي"))}
        <div class="row" style="justify-content:flex-end">${e.auto?'<span class="pill blue">تلقائي</span>':""}${cardDone(e)?'<span class="pill">✔ بطاقة مكتملة</span>':""}<button class="btn danger" data-act="eDel" data-i="${i}">حذف</button></div>
      </div>${contentBox(e,i)}</div>`; });
  });

  return h+`</div>`;
}

/* ===================== 4) بطاقات التنفيذ ===================== */

    ${S.entries.map((e,i)=>`<tr><td><b>${esc(e.name||"—")}</b></td><td>${e.kind==="comp"?"مسابقة":"برنامج"}</td><td>${esc(e.cls||"")}</td><td>${esc(teacherName(e.teacher))}</td>
      <td class="num">${cardDone(e)?'<span class="pill">✔ مكتملة</span>':'<span class="pill warn">لم تُعبأ</span>'}</td>
      <td class="num"><button class="btn light sm" data-act="cOpen" data-i="${i}">${OPEN_CARD===i?"إغلاق":"تعبئة"}</button> <button class="btn light sm" data-act="cPrint" data-i="${i}">🖨️</button></td></tr>`).join("")}

        ${field("نهاية التنفيذ — اليوم",sel(c+"endDay",DAYS))}${field("الأسبوع",inp(c+"endWeek"))}${field("التاريخ",inp(c+"endDate","1448/  /  "))}<div></div>
      </div>

        ${field(e.kind==="comp"?"عدد الطلبة المشاركين في المسابقة":"عدد الطلبة المشاركين",inp(c+"participants","",'inputmode="numeric"'))}
        ${field("عدد الطلبة المشاركين من ذوي الإعاقة",inp(c+"disabled","",'inputmode="numeric"'))}
        ${field(e.kind==="comp"?"عدد أولياء الأمور المشاركين في المسابقة":"عدد أولياء الأمور المشاركين في البرنامج",inp(c+"parents","",'inputmode="numeric"'))}
        ${field("عدد الشراكات المجتمعية",inp(c+"partnerCount","",'inputmode="numeric"'))}
        ${e.kind==="comp"?field("عدد الفائزين",inp(c+"winners","",'inputmode="numeric"'))+field("عدد الطلبة المتأهلين للمرحلة المقبلة",inp(c+"qualified","",'inputmode="numeric"'))+field("عدد الجوائز",inp(c+"prizes","",'inputmode="numeric"')):field("أيقونة التنفيذ عند المشاركة عبر منصة مدرستي",sel(c+"icon",ICONS))}

function printSelected(){

  if(on("pLink")) parts.push(printLink(S._linkScope==="all"?"all":"mine"));
  if(on("pOps")) parts.push(printOps());
  if(on("pProg")) S.entries.forEach(e=>parts.push(printProgPlan(e)));
  if(on("pDist")) parts.push(printDist());
  if(on("pFilled")) S.entries.forEach(e=>parts.push(cardOf(e)));

  doPrint(parts);
}

/* خطة الحصص: الأولى للتهيئة، والأخيرة للعرض والتقويم، وما بينهما يغطي المحاور بالتساوي */
function sessionPlan(e){
  if(e.sessTxt&&e.sessTxt.trim()) return e.sessTxt.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const n=e.kind==="comp"?(num(e.sessions)||0):sessNum(e), c=contentOf(e), T=c.themes;
  if(!n) return [];
  if(e.kind==="comp") return Array.from({length:n},(_,k)=>k===0?"الإعلان عن المسابقة وشروطها وحصر الراغبين واستيفاء الموافقات":k===n-1&&n>1?"التصفيات الداخلية واختيار الممثلين والترشيح والتسجيل":`حصة إعداد وتأهيل: ${T[Math.min(T.length-1,1+((k-1)%Math.max(1,T.length-2)))]}`);
  if(n===1) return [`${T.join("، ")} — وإنجاز: ${c.product}`];
  if(n===2) return [`التهيئة والتعريف بالبرنامج، ثم: ${T.slice(0,Math.ceil(T.length/2)).join("، ")}`,`${T.slice(Math.ceil(T.length/2)).join("، ")} — وعرض الناتج والتقويم`];
  const out=["التهيئة: التعريف بالبرنامج وأهدافه، وتشكيل الفرق وتوزيع الأدوار"], mid=n-2-(n>=5?1:0);
  for(let k=0;k<mid;k++){ const i=Math.floor(k*T.length/mid), first=Math.floor(Math.max(0,k-1)*T.length/mid)!==i||k===0; out.push(`${T[i]}${first?"":" (تطبيق عملي)"}`); }
  if(n>=5) out.push(`إعداد الناتج: ${c.product}`);
  out.push(`عرض النواتج (${c.product}) والتقويم وتكريم المتميزين`);
  return out;
}

function pd(s){ const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3],12):null; }
function addD(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function sunday0(){ const d=pd(S.cal.start); return d?addD(d,-d.getDay()):null; }
function calWeeks(){ const n=parseInt(num(S.cal.weeks)); return n>0&&n<=30?n:0; }
function holSet(){ return new Set(String(S.cal.hol||"").split(/[^\d٠-٩]+/).map(x=>parseInt(num(x))).filter(x=>x>0)); }
function offDays(w){ const o=(S.cal.off||{})[w]; return Array.isArray(o)?o:[]; }
function studyWeeks(){ const h=holSet(), out=[]; for(let w=1;w<=calWeeks();w++) if(!h.has(w)) out.push(w); return out; }
function dayDate(w,d){ const s=sunday0(); return s?addD(s,(w-1)*7+d):null; }
function hj(d){ if(!d) return ""; try{ const p={}; new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d).forEach(x=>p[x.type]=x.value); return `${parseInt(p.year)}/${p.month}/${p.day}`; }catch(e){ return ""; } }
function gD(d){ return d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:""; }
function weekOfDate(dt){ const s=sunday0(); if(!s) return 0; const w=Math.floor((dt-s)/(7*86400000))+1; return w>=1&&w<=calWeeks()?w:0; }
function importCal(){
  let d=null; try{ d=JSON.parse(localStorage.getItem("WSPLAN_V1")||"null"); }catch(e){}
  if(!d||!d.cal||!d.cal.start) return false;
  S.cal.start=d.cal.start; S.cal.weeks=d.cal.weeks||S.cal.weeks;
  const hol=[], off={}; Object.keys(d.weeks||{}).forEach(k=>{ const w=d.weeks[k]||{}; if(w.type==="hol") hol.push(+k); if(Array.isArray(w.off)&&w.off.length) off[k]=w.off.slice(); });
  S.cal.hol=hol.sort((a,b)=>a-b).join("، "); S.cal.off=off;
  if(d.school&&d.school.sem&&!S.school.sem) S.school.sem=d.school.sem;
  return true;
}

function grpForCls(cls){ const gs=stageGroups(); if(gs.length<2) return gs[0]; const g=parseInt(num(String(cls).split(/[\/\-]/)[0])); return g>=4?1:0; }
function progSess(name,grp){ const it=libItem(name); if(!it) return 0; const v=num(it[2][grp]); return v==null?0:v; }
function candidates(subject){ let list=null; SUBJ_MAP.forEach(([re,arr])=>{ if(!list&&re.test(subject||"")) list=arr; }); return (list||[]).concat(SUBJ_DEFAULT.filter(x=>!(list||[]).includes(x))); }
function isAutoFree(e){ const c=e.card||{}; return e.auto && !Object.keys(c).some(k=>String(c[k]||"").trim()); }
function autoBuild(){
  const gs=stageGroups(); if(!gs.length){ alert("حدد المرحلة في «البيانات الأساسية» أولًا."); return 0; }
  if(!S.teachers.length){ alert("أضف المعلمين أولًا."); return 0; }
  S.entries=S.entries.filter(e=>!isAutoFree(e));
  const o=S.cal.opts||{}, added=[];
  const taken=new Set(S.entries.map(e=>(e.cls||"")+"|"+e.name));
  S.teachers.forEach(t=>{
    const a=avail(t); if(a==null||a<=0) return;
    let rem=a-used(t.id); const cls=clsList(t); const C=cls.length?cls:[""], cand=candidates(t.subject);
    if(o.comps!==false){ const cp=COMPS.find(([re])=>re.test(t.subject||"")); const n=4;
      if(cp&&rem>=n+2&&!S.entries.some(e=>e.kind==="comp"&&e.name===cp[1])){ const e={id:uid(),kind:"comp",dom:cp[2],name:cp[1],sessions:String(n),cls:C[0],teacher:t.id,start:"",sem:"",card:{},auto:true}; S.entries.push(e); added.push(e); rem-=n; } }
    let progress=true;
    while(progress&&rem>0){ progress=false;
      for(const c of C){ const g=grpForCls(c);
        const name=cand.find(n=>{ const s=progSess(n,g); return s>0&&s<=rem&&!taken.has(c+"|"+n); });
        if(!name) continue;
        const it=libItem(name), e={id:uid(),kind:it[0]==="per"?"per":"prog",dom:it[0],name,grp:g,cls:c,teacher:t.id,start:"",sem:"",card:{},auto:true};
        S.entries.push(e); added.push(e); taken.add(c+"|"+name); rem-=progSess(name,g); progress=true; if(rem<=0) break; }
    }
  });
  if(o.days!==false&&sunday0()){
    const g=gs[0];
    Object.keys(OCC).forEach(n=>{ if(!progSess(n,g)) return; const [m,d]=OCC[n], s=sunday0();
      for(const y of [s.getFullYear(),s.getFullYear()+1]){ const w=weekOfDate(new Date(y,m-1,d,12)); if(w&&!holSet().has(w)&&!S.entries.some(e=>e.name===n)){ const e={id:uid(),kind:"prog",dom:"day",name:n,grp:g,cls:"جميع الفصول",teacher:"",start:"",sem:"",card:{},auto:true,wk:String(w)}; S.entries.push(e); added.push(e); break; } } });
  }
  schedule(true);
  return added.length;
}

/* ===================== التوزيع على الأسابيع ===================== */
function perDay(){ return num(S.school.dayPeriods)||7; }
function schedule(assign){
  const sw=studyWeeks(), P=perDay(), out=[], warn=[], occ={}, startDef=parseInt(num((S.cal.opts||{}).start))||3;
  const key=(who,d,p)=>who+"|"+d+"|"+p;
  let ix=0;
  const order=S.entries.slice().sort((a,b)=>(a.dom==="day")-(b.dom==="day"));
  order.forEach(e=>{ if(e.day!==undefined&&e.day!==""&&e.per) { if(e.teacher) occ[key("t"+e.teacher,+e.day,+e.per)]=1; if(e.cls) occ[key("c"+e.cls,+e.day,+e.per)]=1; } });
  order.forEach(e=>{
    const n=e.kind==="comp"?(num(e.sessions)||0):sessNum(e); if(!n) return;
    if(e.dom==="day"){ const w=parseInt(num(e.wk))||0; if(!w||!sw.includes(w)){ warn.push(`${e.name}: حدد أسبوع المناسبة`); return; }
      const free=[0,1,2,3,4].filter(d=>!offDays(w).includes(d)); for(let k=0;k<n;k++){ const d=free[k%free.length], p=1+Math.floor(k/free.length); out.push({e,k:k+1,w,d,p}); } return; }
    if(!e.teacher&&!e.cls) return;
    let d=e.day===""||e.day===undefined?null:+e.day, p=e.per?+e.per:null;
    if(d===null||!p){
      /* اختيار الحصة: يوم أقل حملًا للفصل والمعلم، مع تنويع الحصص بدل تكديسها في حصة واحدة */
      const load=(who,dd)=>{ let c=0; for(let pp=1;pp<=P;pp++) if(occ[key(who,dd,pp)]) c++; return c; };
      const pref=P-(ix++%Math.max(1,P-2));
      let found=null, best=1e9;
      for(let dd=0;dd<5;dd++) for(let pp=1;pp<=P;pp++){
        if(e.teacher&&occ[key("t"+e.teacher,dd,pp)]) continue; if(e.cls&&occ[key("c"+e.cls,dd,pp)]) continue;
        const sc=(e.cls?load("c"+e.cls,dd)*10:0)+(e.teacher?load("t"+e.teacher,dd)*4:0)+Math.abs(pp-pref);
        if(sc<best){ best=sc; found=[dd,pp]; } }
      if(!found){ warn.push(`${e.name} (${e.cls||""}): لا توجد حصة شاغرة`); return; }
      [d,p]=found; if(assign){ e.day=String(d); e.per=String(p); }
    }
    if(e.teacher) occ[key("t"+e.teacher,d,p)]=1; if(e.cls) occ[key("c"+e.cls,d,p)]=1;
    const st=parseInt(num(e.wk))||startDef; let k=0;
    for(const w of sw){ if(w<st) continue; if(offDays(w).includes(d)) continue; out.push({e,k:k+1,w,d,p}); k++; if(k>=n) break; }
    if(k<n) warn.push(`${e.name} (${e.cls||""}): لا تكفي الأسابيع المتبقية لإكمال ${n} حصص — قدّم أسبوع البداية`);
  });
  return {out,warn};
}
function entryRange(e,sch){ const ss=sch.out.filter(x=>x.e===e); if(!ss.length) return null; return {a:ss[0],b:ss[ss.length-1],n:ss.length}; }
function fillCards(){
  const sch=schedule(false); let n=0;
  S.entries.forEach(e=>{ const r=entryRange(e,sch); if(!r) return; const c=e.card=e.card||{};
    const set=(k,v)=>{ if(!String(c[k]||"").trim()){ c[k]=v; n++; } };
    set("startDay",DAYS[r.a.d]); set("startWeek",String(r.a.w)); set("startDate",hj(dayDate(r.a.w,r.a.d)));
    set("endDay",DAYS[r.b.d]); set("endWeek",String(r.b.w)); set("endDate",hj(dayDate(r.b.w,r.b.d)));
    if(!String(e.start||"").trim()) e.start=hj(dayDate(r.a.w,r.a.d)); });
  return n;
}

  h+=`<div class="card"><div class="row between"><h2 style="margin:0">جدول الأسبوع</h2><select data-k="_dw" style="max-width:220px">${Array.from({length:calWeeks()},(_,k)=>`<option value="${k+1}"${k+1===wsel?" selected":""}>الأسبوع ${k+1}${holSet().has(k+1)?" (إجازة)":""}</option>`).join("")}</select></div>
    <div class="scroll" style="margin-top:10px">${weekGrid(sch,wsel,false)}</div></div>`;
  return h;

  if(e.type==="change"&&(k==="school.stage"||k==="school.dayPeriods"||/\.teacher$/.test(k)||/^cal\./.test(k)||k==="_dw"||/\.(day|per|wk)$/.test(k)||/teachers\.\d+\.pct$/.test(k))){ const y=window.scrollY; render(); window.scrollTo(0,y); }
}
view.addEventListener("input",onField); view.addEventListener("change",onField);
view.addEventListener("change",e=>{ const o=e.target.getAttribute&&e.target.getAttribute("data-opt"); if(o){ S.cal.opts[o]=e.target.checked; save(); } });
view.addEventListener("toggle",e=>{ const d=e.target; if(d.matches&&d.matches("details.cbox")) OPEN_CONTENT=d.open?d.getAttribute("data-cid"):(OPEN_CONTENT===d.getAttribute("data-cid")?null:OPEN_CONTENT); },true);
document.getElementById("steps").addEventListener("click",e=>{ const b=e.target.closest("[data-step]"); if(b) go(+b.getAttribute("data-step")); });
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(+g.getAttribute("data-go")); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.getAttribute("data-act"), i=+b.getAttribute("data-i");
  switch(a){
    case "tAdd": S.teachers.push({id:uid(),name:"",subject:"",weekly:"",weeks:"",pct:"5",avail:""}); break;
    case "tDel": if(!confirm("حذف المعلم/ة؟ ستبقى البرامج المسندة له بدون معلم.")) return; { const id=S.teachers[i].id; S.entries.forEach(x=>{ if(x.teacher===id) x.teacher=""; }); S.teachers.splice(i,1); } break;
    case "eAdd": { const n=b.getAttribute("data-n"), it=libItem(n), gs=stageGroups(); const grp=gs.find(g=>String(it[2][g])!=="0"); S.entries.push({id:uid(),kind:it[0]==="per"?"per":"prog",dom:it[0],name:n,grp:grp==null?gs[0]:grp,cls:"",teacher:"",start:"",sem:"",card:{}}); toast("أُضيف: "+n); break; }
    case "cAdd": S.entries.push({id:uid(),kind:"comp",dom:"",name:"",sessions:"",cls:"",teacher:"",start:"",sem:"",card:{}}); break;
    case "eDel": if(!confirm("حذف البرنامج من الخطة مع بطاقة تنفيذه؟")) return; S.entries.splice(i,1); OPEN_CARD=null; break;
    case "cOpen": OPEN_CARD=OPEN_CARD===i?null:i; break;
    case "calImp": if(!importCal()){ alert("لا يوجد تقويم محفوظ في أداة «الخطة الأسبوعية والفصلية» على هذا الجهاز."); return; } toast("تم جلب التقويم ✓"); break;
    case "autoBuild": { if(S.entries.some(isAutoFree)&&!confirm("ستُستبدل البرامج المُنشأة تلقائيًا (التي لم تُعبأ بطاقتها). متابعة؟")) return; const n=autoBuild(); toast(n?`✨ أُضيف ${n} برنامجًا ومسابقة ومناسبة ووُزعت على الأسابيع`:"لم يُضف شيء — تحقق من حصص المعلمين المتاحة وتخصصاتهم"); break; }
    case "fillCards": { const n=fillCards(); toast(n?`تمت تعبئة ${n} حقلًا من التوزيع ✓`:"الحقول معبأة مسبقًا أو التقويم غير مكتمل"); break; }
    case "cPrint": doPrint([cardOf(S.entries[i])]); return;
    case "doPrint": printSelected(); return;
    case "backup": if(window.PN) PN.open(); return;
    case "reset": if(!confirm("حذف جميع بيانات هذه الأداة من هذا الجهاز؟ هل صدّرت نسخة احتياطية؟")) return; if(!confirm("تأكيد نهائي؟")) return; localStorage.removeItem(KEY); S=blank(); render(); renderBackupWarn(); return;
    default: return;
  }
  save(); render();
});

/* ===== ملاءمة الجوال: تحويل جداول الإدخال إلى بطاقات، وإظهار الخطوة الحالية ===== */
function mobileFix(){
  document.querySelectorAll("#view .tbl").forEach(t=>{
    const heads=t.querySelectorAll("thead tr"); if(heads.length!==1) return;
    const ths=[...heads[0].children]; if(ths.some(th=>th.colSpan>1||th.rowSpan>1)) return;
    const labels=ths.map(th=>th.textContent.trim());
    let ok=true; t.querySelectorAll("tbody tr").forEach(tr=>{ if(tr.children.length!==labels.length) ok=false; });
    if(!ok) return;
    t.classList.add("stack");
    t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{ if(labels[i]) td.setAttribute("data-label",labels[i]); }));
  });
  const a=document.querySelector(".step.active"); if(a&&window.innerWidth<=700) a.scrollIntoView({inline:"center",block:"nearest"});
}
(function(){ const _render=render; render=function(){ _render.apply(this,arguments); mobileFix(); }; })();
renderSteps(); render(); renderBackupWarn();

<script>
(function(){
  "use strict";
  var PAGE = "activity";
  var APP = "school-tools-portal";
  var SECTIONS = [
    {id:"positive",   href:"positive.html",   title:"محلل السلوك المتميز", keys:[]},
    {id:"attendance", href:"attendance.html", title:"محلل الغياب", keys:[]},
    {id:"violations", href:"violations.html", title:"محلل المخالفات", keys:["VIOL_"]},
    {id:"forms",      href:"behavior-attendance-forms.html", title:"نماذج السلوك والمواظبة", keys:["moe_"]},
    {id:"grades",     href:"grades.html",     title:"تحليل النتائج", keys:[]},
    {id:"committees", href:"committees.html", title:"اللجان والتكليفات", keys:["SCV2"]},
    {id:"jobs",       href:"job-description.html", title:"الوصف الوظيفي للتشكيلات المدرسية", keys:["JOBDESC_"]},
    {id:"improvement", href:"improvement-plan.html", title:"تحليل الواقع وخطة التحسين", keys:["IMPPLAN_"]},
    {id:"activity", href:"activity-plan.html", title:"خطة النشاط الطلابي وبطاقات التنفيذ", keys:["ACTPLAN_"]},
    {id:"standards", href:"standards-followup.html", title:"متابعة معايير الأداء والالتزام", keys:["STDFOLLOW_"]},
    {id:"weekly", href:"weekly-semester-plan.html", title:"الخطة الأسبوعية والفصلية", keys:["WSPLAN_"]}
  ];
  var ALL_PREFIXES = ["moe_","SCV2","JOBDESC_","VIOL_","IMPPLAN_","ACTPLAN_","STDFOLLOW_","WSPLAN_"];
  var LABELS = {
    moe_behavior_records_v1:"مخالفة سلوكية", moe_absence_records_v1:"سجل غياب",
    moe_compensation_records_v1:"فرصة تعويض", moe_roster_v1:"طالب مستورد من نور",
    JOBDESC_V1:"وصف وظيفي", JOBDESC_PRINTLOG_V1:"عملية طباعة"
  };
  var REMIND_DAYS = 14;
  var cur = SECTIONS.filter(function(s){return s.id===PAGE;})[0] || null;

  function $(id){ return document.getElementById(id); }
  function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
  function matches(k, prefixes){ return prefixes.some(function(p){ return k===p || k.indexOf(p)===0; }); }
  function keysFor(prefixes){
    var s = ls(), out = []; if(!s) return out;
    for(var i=0;i<s.length;i++){ var k = s.key(i); if(k && matches(k, prefixes)) out.push(k); }
    return out.sort();
  }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString("ar-SA",{dateStyle:"medium",timeStyle:"short"}); }catch(e){ return iso; } }
  function toast(msg){
    var t = $("pnToast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }
  function lastKey(scope){ return "portal_lastBackup_" + scope; }
  function getLast(scope){ var s=ls(); return s ? s.getItem(lastKey(scope)) : null; }

  /* ---- summary of what is stored ---- */
  function summary(prefixes){
    var s = ls(), items = [], keys = keysFor(prefixes);
    keys.forEach(function(k){
      var v = s.getItem(k), p = null;
      try{ p = JSON.parse(v); }catch(e){}
      if(k === "SCV2" && p && typeof p === "object"){
        items.push((p.staff||[]).length + " منسوب");
        items.push((p.comms||[]).length + " لجنة");
        items.push((p.decs||[]).length + " قرار");
        items.push((p.meets||[]).length + " اجتماع");
      } else if(k === "VIOL_LAST_V1" && p && Array.isArray(p.arr)){
        items.push("تحليل محفوظ: " + (p.total||0) + " مخالفة لـ " + p.arr.length + " طالبًا");
      } else if(k === "IMPPLAN_V1" && p && typeof p === "object"){
        items.push("تحليل واقع وخطة تحسين");
        items.push(((p.plan && p.plan.rows) || []).length + " إجراء تحسين");
        items.push((p.exec || []).length + " أسبوع تنفيذ");
      } else if(k === "ACTPLAN_V1" && p && typeof p === "object"){
        items.push((p.entries || []).length + " برنامج نشاط");
        items.push((p.teachers || []).length + " معلم في الإسناد");
      } else if(k === "STDFOLLOW_V1" && p && typeof p === "object"){
        items.push("متابعة معايير الأداء والالتزام");
      } else if(k === "WSPLAN_V1" && p && typeof p === "object"){
        items.push("الخطة الفصلية");
        items.push((p.classes || []).length + " فصل في خطة التعلم الأسبوعية");
      } else if(Array.isArray(p) && LABELS[k]){
        items.push(p.length + " " + LABELS[k]);
      }
    });
    var meta = keys.filter(function(k){ return k.indexOf("moe_meta_")===0 && s.getItem(k); }).length;
    if(meta) items.push("بيانات المدرسة");
    var RECORD_KEYS = ["moe_behavior_records_v1","moe_absence_records_v1","moe_compensation_records_v1","JOBDESC_PRINTLOG_V1"];
    var hasData = keys.some(function(k){
      var p = null; try{ p = JSON.parse(s.getItem(k)); }catch(e){ return false; }
      if(k === "VIOL_LAST_V1") return !!(p && Array.isArray(p.arr) && p.arr.length);
      if(k === "SCV2") return !!(p && ["staff","comms","decs","meets"].some(function(x){ return (p[x]||[]).length; }));
      if(k === "IMPPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.plan && p.plan.rows && p.plan.rows.length) || (p.exec && p.exec.length) || (p.prio && p.prio.length)));
      if(k === "ACTPLAN_V1") return !!(p && typeof p === "object" && ((p.entries && p.entries.length) || (p.teachers && p.teachers.length)));
      if(k === "WSPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.cal && p.cal.start) || (p.classes && p.classes.length) || (p.prios && p.prios.length) || (p.wk && Object.keys(p.wk).length)));
      if(k === "STDFOLLOW_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.st && Object.keys(p.st).length) || (p.unexc && p.unexc.length) || (p.beh && p.beh.length)));
      return RECORD_KEYS.indexOf(k) > -1 && Array.isArray(p) && p.length > 0;
    });
    return {keys:keys, items:items, hasData:hasData};
  }

  /* ---- export ---- */
  function doExport(scope){
    var s = ls(); if(!s){ alert("المتصفح لا يسمح بالوصول للتخزين المحلي."); return; }
    var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
    var keys = keysFor(prefixes);
    if(keys.indexOf("SCV2") > -1){ // مزامنة تاريخ آخر نسخة مع تنبيه نظام اللجان
      try{
        if(PAGE === "committees" && typeof db === "object" && db && db.meta){
          db.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(db));
          if(typeof renderDbWarn === "function") renderDbWarn();
          if(typeof renderBackupInfo === "function") renderBackupInfo();
        } else {
          var sc = JSON.parse(s.getItem("SCV2")||"null");
          if(sc && typeof sc === "object"){ sc.meta = sc.meta || {}; sc.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(sc)); }
        }
      }catch(e){}
    }
    if(!keys.length){ toast("لا توجد بيانات محفوظة لتصديرها"); return; }
    var data = {}; keys.forEach(function(k){ data[k] = s.getItem(k); });
    var now = new Date();
    var pack = {app:APP, v:1, scope:scope, title: scope==="all" ? "جميع الأقسام" : cur.title,
                createdAt: now.toISOString(), keys:data};
    var name = (scope==="all" ? "جميع-الأقسام" : cur.title.replace(/\s+/g,"-")) + "-نسخة-احتياطية-" + now.toISOString().slice(0,10) + ".json";
    var blob = new Blob([JSON.stringify(pack)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    s.setItem(lastKey(scope), now.toISOString());
    if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), now.toISOString()); });
    else s.setItem(lastKey(scope), now.toISOString());
    render(); refreshDot();
    toast("تم تنزيل النسخة الاحتياطية ✓ احفظها في بريدك أو OneDrive");
  }

  /* ---- import ---- */
  function doImport(scope, file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var p; try{ p = JSON.parse(r.result); }catch(e){ alert("الملف ليس نسخة احتياطية صالحة (JSON)."); return; }
      var s = ls(); if(!s) return;
      var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
      var incoming = {};
      if(p && p.app === APP && p.keys && typeof p.keys === "object"){
        Object.keys(p.keys).forEach(function(k){ if(matches(k, prefixes) && typeof p.keys[k] === "string") incoming[k] = p.keys[k]; });
      } else if(p && Array.isArray(p.staff) && Array.isArray(p.comms) && matches("SCV2", prefixes)){
        incoming.SCV2 = JSON.stringify(p); // نسخة قديمة من نظام اللجان
      } else {
        alert("هذا الملف لا يطابق نسخ هذا الموقع، لم تتم الاستعادة."); return;
      }
      var n = Object.keys(incoming).length;
      if(!n){ alert("الملف لا يحتوي بيانات خاصة بهذا القسم. جرّب الاستيراد من «النسخة الشاملة» أو من القسم الصحيح."); return; }
      var when = p.createdAt ? "\nتاريخ النسخة: " + fmtDate(p.createdAt) : "";
      if(!confirm("سيتم استبدال بيانات " + (scope==="all" ? "جميع الأقسام" : "هذا القسم") + " على هذا الجهاز ببيانات الملف." + when + "\n\nمتابعة؟")) return;
      keysFor(prefixes).forEach(function(k){ s.removeItem(k); });
      Object.keys(incoming).forEach(function(k){ s.setItem(k, incoming[k]); });
      var stamp = p.createdAt || new Date().toISOString(); // البيانات مطابقة لهذه النسخة
      s.setItem(lastKey(scope), stamp);
      if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), stamp); });
      alert("تمت الاستعادة بنجاح ✓ سيُعاد تحميل الصفحة لعرض البيانات.");
      location.reload();
    };
    r.readAsText(file);
  }

  /* ---- UI ---- */
  var icoHome = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M3.5 11L12 4l8.5 7"/><path stroke-linejoin="round" d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
  var icoSave = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>';

  function box(scope, title, prefixes, extra){
    var sm = summary(prefixes), last = getLast(scope);
    return '<div class="pn-box"><h3>' + title + '</h3>' + (extra||"") +
      '<div class="pn-meta">آخر نسخة احتياطية من هذا الجهاز: <b>' + (last ? fmtDate(last) : "لم تُنشأ بعد") + '</b></div>' +
      (sm.items.length ? '<ul class="pn-sum">' + sm.items.map(function(x){return "<li>"+x+"</li>";}).join("") + '</ul>'
                       : '<p class="pn-note" style="margin-bottom:10px">لا توجد بيانات محفوظة على هذا الجهاز حاليًا.</p>') +
      '<div class="pn-acts"><button type="button" class="pn-exp" data-exp="' + scope + '">⬇️ تصدير نسخة</button>' +
      '<label class="pn-imp">⬆️ استيراد نسخة<input type="file" accept=".json,application/json" data-imp="' + scope + '"></label></div></div>';
  }

  function render(){
    var body = $("pnBody"); if(!body) return;
    var html = '<div class="pn-steps"><b>لنقل بياناتك إلى جهاز آخر:</b><ol>' +
      '<li>اضغط «تصدير نسخة» على هذا الجهاز، فيُنزَّل ملف بصيغة JSON.</li>' +
      '<li>أرسل الملف لنفسك (البريد، OneDrive، واتساب…).</li>' +
      '<li>افتح نفس القسم على الجهاز الآخر، ثم «استيراد نسخة» واختر الملف.</li></ol></div>';
    if(cur && cur.keys.length){
      var stale = isStale(cur.id, cur.keys);
      html += box(cur.id, "نسخة هذا القسم: " + cur.title, cur.keys,
        stale ? '<p class="pn-warn">⚠️ لديك بيانات بدون نسخة احتياطية حديثة. البيانات محفوظة في متصفح هذا الجهاز فقط، ومسح المتصفح يفقدها.</p>' : "");
    } else if(cur){
      html += '<div class="pn-box"><h3>' + cur.title + '</h3><p class="pn-note">هذا القسم لا يحفظ بيانات على الجهاز؛ فهو يحلل الملفات التي ترفعها مباشرة، لذلك لا يحتاج نسخة خاصة. لنقل بيانات الأقسام الأخرى استخدم النسخة الشاملة.</p></div>';
    }
    html += box("all", "نسخة شاملة لجميع الأقسام", ALL_PREFIXES,
      '<p class="pn-note" style="margin-bottom:6px">تشمل: نماذج السلوك والمواظبة، وآخر تحليل لمحلل المخالفات، واللجان والتكليفات، والوصف الوظيفي، وتحليل الواقع وخطة التحسين، وخطة النشاط الطلابي، ومتابعة معايير الأداء والالتزام، والخطة الأسبوعية والفصلية — في ملف واحد.</p>');
    body.innerHTML = html;
  }

  function isStale(scope, prefixes){
    if(!summary(prefixes).hasData) return false;
    var last = getLast(scope) || getLast("all");
    if(!last) return true;
    return (Date.now() - new Date(last).getTime()) / 86400000 >= REMIND_DAYS;
  }
  function refreshDot(){
    var b = $("pnBackupBtn"); if(!b) return;
    var warn = cur && cur.keys.length ? isStale(cur.id, cur.keys) : false;
    b.classList.toggle("warn", !!warn);
    b.title = warn ? "لا توجد نسخة احتياطية حديثة لبيانات هذا القسم" : "النسخ الاحتياطي ونقل البيانات";
  }

  function open(){ render(); $("pnOv").classList.add("open"); var x=$("pnOv").querySelector(".pn-x"); if(x) x.focus(); }
  function close(){ $("pnOv").classList.remove("open"); }

  function build(){
    if(PAGE !== "home"){
      var bar = document.createElement("nav");
      bar.className = "pn-bar"; bar.setAttribute("aria-label","التنقل بين الأقسام");
      var opts = SECTIONS.map(function(s){
        return '<option value="' + s.href + '"' + (s.id===PAGE?" selected":"") + (s.disabled?" disabled":"") + '>' +
          s.title + (s.disabled?" (مغلق للتطوير)":"") + '</option>';
      }).join("");
      bar.innerHTML = '<a class="pn-home" href="index.html">' + icoHome + '<span>الرئيسية</span></a>' +
        '<div class="pn-sec"><label for="pnSel">الانتقال إلى:</label><select id="pnSel">' + opts + '</select></div>' +
        '<button type="button" class="pn-btn" id="pnBackupBtn">' + icoSave + '<span class="pn-t">النسخ الاحتياطي</span><span class="pn-dot"></span></button>';
      document.body.insertBefore(bar, document.body.firstChild);
      $("pnSel").addEventListener("change", function(){ if(this.value) location.href = this.value; });
      $("pnBackupBtn").addEventListener("click", open);
    }
    var ov = document.createElement("div");
    ov.className = "pn-ov"; ov.id = "pnOv";
    ov.innerHTML = '<div class="pn-modal" role="dialog" aria-modal="true" aria-labelledby="pnTitle">' +
      '<div class="pn-mh"><h2 id="pnTitle">النسخ الاحتياطي ونقل البيانات</h2><button type="button" class="pn-x" aria-label="إغلاق">✕</button></div>' +
      '<div class="pn-mb" id="pnBody"></div></div>';
    document.body.appendChild(ov);
    var t = document.createElement("div"); t.className = "pn-toast"; t.id = "pnToast"; document.body.appendChild(t);
    ov.addEventListener("click", function(e){
      if(e.target === ov || e.target.closest(".pn-x")) return close();
      var ex = e.target.closest("[data-exp]"); if(ex) doExport(ex.getAttribute("data-exp"));
    });
    ov.addEventListener("change", function(e){
      var inp = e.target.closest("[data-imp]"); if(inp){ doImport(inp.getAttribute("data-imp"), inp.files[0]); inp.value = ""; }
    });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && ov.classList.contains("open")) close(); });
    refreshDot();
  }

  window.PN = {open:open};
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
})();
</script>
<!-- ===== /PORTAL NAV & BACKUP ===== -->
</body>
</html>
