<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة معايير الأداء والالتزام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy-900:#0a2733;--navy-800:#0f3d4c;--teal-700:#155a6c;--teal-600:#1d5c6e;--teal-500:#237e93;--gold:#c99a45;--bg:#f3f6f8;--line:#dbe4ea;--muted:#5c7180;--ink:#16232b;--rd:#b3261e;--ok:#13824a;
  --shadow:0 2px 8px rgba(10,39,51,.06),0 10px 30px rgba(10,39,51,.06);--form:#1a8a4a;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
button{font-family:inherit;}
header.top{background:linear-gradient(135deg,var(--navy-900),var(--navy-800) 60%,var(--teal-700));color:#fff;padding:22px 24px;}
header.top .in{max-width:1180px;margin:0 auto;} header.top h1{margin:0 0 4px;font-size:22px;font-weight:900;} header.top p{margin:0;font-size:13px;color:#cfe0e6;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px;}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--navy-800);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.step .n{min-width:22px;height:22px;border-radius:11px;background:#e6eef2;color:var(--navy-800);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;padding:0 5px;}
.step.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);} .step.active .n{background:var(--gold);color:#3a2a06;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:16.5px;color:var(--navy-800);border-inline-start:4px solid var(--gold);padding-inline-start:10px;}
.card h3{margin:14px 0 8px;font-size:14.5px;color:var(--teal-600);}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
.note{background:#fff8e8;border-inline-start:4px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.warnbar{background:#fbeceb;color:#8f2a22;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
label.lb{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd9de;border-radius:8px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-500);outline-offset:0;}
.g{display:grid;gap:12px;} .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr);}} @media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
.btn.primary{background:var(--teal-600);color:#fff;} .btn.gold{background:var(--gold);color:#3a2a06;} .btn.light{background:#eef3f5;color:var(--navy-800);border:1px solid var(--line);}
.btn.danger{background:#fdecea;color:var(--rd);border:1px solid #f4c7c2;padding:6px 10px;font-size:12.5px;} .btn.sm{padding:6px 11px;font-size:12.5px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .between{justify-content:space-between;}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
.std{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
.std > b{display:block;color:var(--navy-800);margin-bottom:6px;}
.ev{display:grid;grid-template-columns:1fr 210px;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);}
.ev .tx{font-size:13.5px;}
.ev .tx small{color:var(--muted);}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.tog button{border:0;background:#fff;padding:6px 12px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted);}
.tog button.on.c{background:var(--ok);color:#fff;} .tog button.on.n{background:var(--rd);color:#fff;}
.ev .nt{grid-column:1/-1;}
.ev .nt input{font-size:12.5px;padding:5px 8px;}
@media(max-width:600px){.ev{grid-template-columns:1fr;}}
.tool{font-size:12px;font-weight:800;color:var(--teal-600);margin-inline-start:6px;}
.prog{height:10px;border-radius:6px;background:#e6eef2;overflow:hidden;} .prog i{display:block;height:100%;background:var(--ok);}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;} .kpi b{display:block;font-size:24px;color:var(--navy-800);}
.stu{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fbfdfd;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;} .tbl th,.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:right;} .tbl th{background:#eef4f6;color:var(--navy-800);}
.scroll{overflow-x:auto;} .num{text-align:center !important;}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:20px;padding:1px 9px;background:#e8f3ef;color:#13704b;} .pill.warn{background:#fdecea;color:var(--rd);}
.hidden{display:none !important;}
#printArea{display:none;}
@media print{ @page{size:A4 portrait;margin:9mm;} body{background:#fff;} body.printing > *:not(#printArea){display:none !important;} body.printing #printArea{display:block;} *{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
#printArea{font-family:'Tajawal',Arial,sans-serif;color:#111;font-size:10.5pt;line-height:1.45;}
#printArea thead{display:table-header-group;}
#printArea .pg{page-break-after:always;break-after:page;} #printArea .pg:last-child{page-break-after:auto;break-after:auto;}
#printArea .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid var(--form);padding-bottom:4px;margin-bottom:8px;}
#printArea .ph .r{font-size:9.5pt;font-weight:800;line-height:1.45;} #printArea .ph img{height:15mm;}
#printArea h1{font-size:14pt;text-align:center;color:var(--form);margin:6px 0 8px;} #printArea h2{font-size:12pt;color:var(--form);margin:10px 0 5px;}
#printArea table{width:100%;border-collapse:collapse;margin-bottom:8px;}
#printArea th,#printArea td{border:1px solid #333;padding:3px 5px;font-size:9.5pt;vertical-align:middle;text-align:right;}
#printArea th{background:var(--form);color:#fff;text-align:center;} #printArea td.c{text-align:center;} #printArea td.lbl{background:var(--form);color:#fff;font-weight:800;white-space:nowrap;}
#printArea td.std{font-weight:800;background:#f4faf6;}
#printArea tr{break-inside:avoid;page-break-inside:avoid;}
#printArea .cb{display:inline-block;margin-inline-end:9px;white-space:nowrap;}
#printArea .cb i{display:inline-block;width:10px;height:10px;border:1.3px solid #222;margin-inline-end:3px;vertical-align:-1px;font-style:normal;font-size:8px;line-height:8px;text-align:center;font-weight:900;}
#printArea .tick{font-weight:900;font-size:11pt;}
#printArea .stuh{background:#eef7f1;font-weight:800;}
</style>
</head>

<header class="top"><div class="in"><h1>متابعة تطبيق معايير الأداء والالتزام</h1>
<p>جاهزية المدرسة قبل الزيارة: شواهد مجالات الإشراف التربوي والنشاط الطلابي والتوجيه الطلابي، وعينات الغياب والمخالفات وإجراءاتها — وفق استمارة متابعة أداء المدرسة 1448هـ.</p></div></header>

function blank(){ return {v:1,school:{name:"",admin:"",sector:"",stage:"",gender:"",year:"1448"},st:{},exc:{},excStu:[],unexc:[],beh:[],step:0}; }
function load(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){} const b=blank(); if(!d||typeof d!=="object") return b;
  for(const k in b) if(d[k]===undefined||d[k]===null) d[k]=b[k]; for(const k in b.school) if(d.school[k]===undefined) d.school[k]=b.school[k];
  ["excStu","unexc","beh"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; }); d.unexc.forEach(u=>{ if(!u.steps) u.steps={}; }); d.beh.forEach(x=>{ if(!x.items) x.items={}; });
  if(!(d.step>=0&&d.step<6)) d.step=0; return d; }
let S=load(), saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ S.updated=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ alert("تعذر الحفظ: "+e.message); } renderBackupWarn(); renderSteps(); },250); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function getPath(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k],S); }
function setPath(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
function inp(p,ph,ex){ const v=getPath(p); return `<input data-k="${p}" value="${esc(v==null?"":v)}" placeholder="${esc(ph||"")}" ${ex||""}>`; }
function sel(p,opts,ph){ const v=getPath(p)||""; return `<select data-k="${p}"><option value="">${esc(ph||"— اختر —")}</option>${opts.map(o=>{ const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(lab)}</option>`; }).join("")}</select>`; }
function field(l,h){ return `<div><label class="lb">${l}</label>${h}</div>`; }
function tog(path){ const v=getPath(path)||""; return `<span class="tog"><button class="c${v==="c"?" on":""}" data-tog="${path}" data-v="c">مكتمل</button><button class="n${v==="n"?" on":""}" data-tog="${path}" data-v="n">غير مكتمل</button></span>`; }

function domStats(d){ let t=0,c=0; d.stds.forEach((s,si)=>s[1].forEach((e,ei)=>{ t++; if((S.st[`${d.id}-${si}-${ei}`]||{}).s==="c") c++; })); return {t,c}; }
function guidStats(){
  let t=0,c=0;
  EXC_ITEMS.forEach((x,i)=>{ t++; if((S.exc[i]||{}).s==="c") c++; });
  S.unexc.forEach(u=>{ const tr=tierOf(u.days); if(!tr) return; UNEXC.slice(0,tr.n).forEach(r=>{ t++; if(((u.steps||{})[r[0]]||{}).s==="c") c++; }); });
  S.beh.forEach(x=>{ const L=BEH[x.deg]||[]; L.forEach((e,i)=>{ t++; if(((x.items||{})[i]||{}).s==="c") c++; }); });
  return {t,c};
}

    h+=`<div class="stu"><div class="g g4" style="align-items:end">${field("اسم الطالب/ة",inp(`unexc.${i}.name`))}${field("الصف",inp(`unexc.${i}.cls`))}${field("أيام الغياب بدون عذر",inp(`unexc.${i}.days`,"",'inputmode="numeric"'))}<div class="row" style="justify-content:flex-end">${tr?`<span class="pill">${esc(tr.label.replace("في حال كان غياب الطالب/ـة ",""))}</span>`:""}<button class="btn danger" data-act="del" data-l="unexc" data-i="${i}">حذف</button></div></div>
      ${tr?UNEXC.slice(0,tr.n).map(r=>`<div class="ev"><span class="tx"><b>${r[0]}-</b> ${esc(r[1])}<br><small>الشاهد: ${esc(r[3])} — ${esc(r[4])}</small></span>${tog(`unexc.${i}.steps.${r[0]}.s`)}<div class="nt">${inp(`unexc.${i}.steps.${r[0]}.note`,r[5]?"تعذر توفير الشاهد: "+r[5]:"التاريخ أو ملاحظة")}</div></div>`).join(""):`<p class="hint" style="margin:8px 0 0">الإجراءات تبدأ من غياب 3 أيام بدون عذر.</p>`}</div>`; });
  h+=`<button class="btn light sm" data-act="addUnexc">+ طالب/ة</button></div>`;
  h+=`<div class="card"><h2>المخالفات السلوكية (الدرجة الثالثة والرابعة والخامسة)</h2><p class="hint">${esc(BEH_STD)}</p>`;
  S.beh.forEach((x,i)=>{ const L=BEH[x.deg];
    h+=`<div class="stu"><div class="g g4" style="align-items:end">${field("اسم الطالب/ة",inp(`beh.${i}.name`))}${field("الصف",inp(`beh.${i}.cls`))}${field("درجة المخالفة",sel(`beh.${i}.deg`,[["3","الثالثة"],["4","الرابعة"],["5","الخامسة"]]))}<div class="row" style="justify-content:flex-end"><button class="btn danger" data-act="del" data-l="beh" data-i="${i}">حذف</button></div></div>
      ${L?L.map((e,k)=>`<div class="ev"><span class="tx">${esc(e)}</span>${tog(`beh.${i}.items.${k}.s`)}<div class="nt">${inp(`beh.${i}.items.${k}.note`,"ملاحظة (اختياري)")}</div></div>`).join(""):`<p class="hint" style="margin:8px 0 0">اختر درجة المخالفة لتظهر الشواهد المطلوبة.</p>`}</div>`; });
  return h+`<button class="btn light sm" data-act="addBeh">+ طالب/ة</button></div>`;
}
function missing(){
  const out=[];
  DOMAINS.forEach(d=>d.stds.forEach((st,si)=>st[1].forEach((e,ei)=>{ const v=(S.st[`${d.id}-${si}-${ei}`]||{}).s; if(v!=="c") out.push([d.title.replace(/^\d- معايير مجال /,""),e,v]); })));
  EXC_ITEMS.forEach((x,i)=>{ const v=(S.exc[i]||{}).s; if(v!=="c") out.push(["التوجيه الطلابي",x[1],v]); });
  S.unexc.forEach(u=>{ const tr=tierOf(u.days); if(!tr) return; UNEXC.slice(0,tr.n).forEach(r=>{ const v=((u.steps||{})[r[0]]||{}).s; if(v!=="c") out.push(["الغياب بدون عذر — "+(u.name||"طالب"),r[1],v]); }); });
  S.beh.forEach(x=>{ (BEH[x.deg]||[]).forEach((e,k)=>{ const v=((x.items||{})[k]||{}).s; if(v!=="c") out.push(["مخالفة الدرجة "+(DEG_NAME[x.deg]||"")+" — "+(x.name||"طالب"),e,v]); }); });
  return out;
}
function vSummary(){
  const a=domStats(DOMAINS[0]), b=domStats(DOMAINS[1]), g=guidStats(), all={t:a.t+b.t+g.t,c:a.c+b.c+g.c}, m=missing();
  return `<div class="card"><h2>ملخص جاهزية المدرسة</h2><div class="g g4">
    ${[["الإجمالي",all],["الإشراف التربوي",a],["النشاط الطلابي",b],["التوجيه الطلابي",g]].map(x=>`<div class="kpi"><b>${pct(x[1])}%</b>${x[0]}<div class="hint" style="margin:4px 0 0">${x[1].c} من ${x[1].t}</div><div class="prog"><i style="width:${pct(x[1])}%"></i></div></div>`).join("")}</div></div>
  <div class="card"><h2>الشواهد غير المكتملة أو غير المحددة <span class="pill warn">${m.length}</span></h2>
    ${m.length?`<div class="scroll"><table class="tbl"><thead><tr><th style="width:24%">المجال</th><th>الشاهد</th><th class="num" style="width:110px">الحالة</th></tr></thead><tbody>${m.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="num">${x[2]==="n"?'<span class="pill warn">غير مكتمل</span>':'<span class="pill" style="background:#eef3f5;color:#5c7180">لم يُحدد</span>'}</td></tr>`).join("")}</tbody></table></div>`:`<p class="ok" style="color:#13824a;font-weight:800">✔ جميع الشواهد مكتملة.</p>`}</div>`;

function vPrint(){

    <label class="row" style="font-weight:700"><input type="checkbox" id="pBlank" style="width:auto"> نسخة فارغة من الاستمارة</label>
    <label class="row" style="font-weight:700"><input type="checkbox" id="pMiss" checked style="width:auto"> قائمة النواقص للمتابعة الداخلية</label></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="doPrint">🖨️ طباعة / حفظ PDF</button></div></div>
  <div class="card"><h2>إدارة البيانات</h2><p class="hint">البيانات محفوظة في متصفح هذا الجهاز فقط. صدّر نسخة احتياطية بانتظام.</p>
    <div class="row"><button class="btn gold" data-act="backup">💾 النسخ الاحتياطي ونقل البيانات</button><button class="btn danger" data-act="reset" style="padding:9px 14px">مسح جميع بيانات الأداة</button></div></div>`;

/* ===================== الطباعة ===================== */
function P(v){ return esc(v==null?"":v); }
function hdr(){ const s=S.school; return `<div class="ph"><div class="r">وزارة التعليم<br>${P(s.admin||"الإدارة العامة للتعليم ..................")}<br>اللجنة التنفيذية لمتابعة معايير الأداء<br>والالتزام في مدارس التعليم العام</div><img src="${LOGO}" alt="وزارة التعليم"></div>`; }
function cb(on,l){ return `<span class="cb"><i>${on?"✓":""}</i>${esc(l)}</span>`; }
function cbs(v,o){ return o.map(x=>cb(v===x,x)).join(""); }
function mark(v,blank){ if(blank) return ["",""]; return [v==="c"?'<span class="tick">✓</span>':"", v==="n"?'<span class="tick">✓</span>':""]; }
function stdTable(rows,stdLabel,blank){
  return `<table><thead><tr><th rowspan="2" style="width:24%">المعيار</th><th rowspan="2">${stdLabel||"شواهد تحقق المعيار"}</th><th colspan="2" style="width:17%">مستوى اكتمال الشواهد</th></tr><tr><th>مكتمل</th><th>غير مكتمل</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function printForm(blank){
  const s=S.school, eastern=/الشرقية/.test(s.admin||"")||EASTERN_SECTORS.indexOf(s.sector)>-1;
  let h=`<section class="pg">${hdr()}<h1>استمارة متابعة أداء المدرسة في تطبيق معايير الأداء والالتزام للعام الدراسي ${P(s.year||"1448")}هـ</h1>
  <table><tr><td class="lbl">اسم المقيّم</td><td></td><td class="lbl">التخصص</td><td></td></tr>
  <tr><td class="lbl">القطاع</td><td colspan="3">${blank?(eastern?cbs("",EASTERN_SECTORS):""):(eastern?cbs(s.sector,EASTERN_SECTORS):(s.sector?cb(true,s.sector):""))}</td></tr>
  <tr><td class="lbl">المدرسة</td><td colspan="3">${blank?"":P(s.name)}</td></tr>
  <tr><td class="lbl">المرحلة</td><td>${cbs(blank?"":s.stage,["ابتدائي","متوسط","ثانوي"])}</td><td class="lbl">النوع</td><td>${cbs(blank?"":s.gender,["بنين","بنات"])}</td></tr></table>`;
  DOMAINS.forEach(d=>{
    let rows="";
    d.stds.forEach((st,si)=>st[1].forEach((e,ei)=>{ const m=mark((S.st[`${d.id}-${si}-${ei}`]||{}).s,blank);
      rows+=`<tr>${ei===0?`<td rowspan="${st[1].length}" class="std">${esc(st[0])}</td>`:""}<td>${esc(e)}</td><td class="c">${m[0]}</td><td class="c">${m[1]}</td></tr>`; }));
    h+=`<h2>${d.title}</h2>${stdTable(rows)}`;
  });
  /* التوجيه الطلابي */
  let rows="";
  EXC_ITEMS.forEach((x,i)=>{ const m=mark((S.exc[i]||{}).s,blank); const first=i===0||EXC_ITEMS[i-1][0]!==x[0]; const span=EXC_ITEMS.filter(y=>y[0]===x[0]).length;
    rows+=`<tr>${first?`<td rowspan="${span}" class="std">${esc(x[0])}</td>`:""}<td>${esc(x[1])}</td><td class="c">${m[0]}</td><td class="c">${m[1]}</td></tr>`; });
  h+=`<h2>3- معايير مجال التوجيه الطلابي</h2>${stdTable(rows)}`;
  const unexcList=blank||!S.unexc.length?TIERS.map(t=>({tier:t,u:null})):S.unexc.map(u=>({tier:tierOf(u.days),u})).filter(x=>x.tier);
  unexcList.forEach(({tier,u})=>{
    h+=`<table><thead><tr><th colspan="7" style="background:#fff;color:#111">${esc(tier.label)}${u?` — الطالب/ة: ${P(u.name)} ${u.cls?"("+P(u.cls)+")":""} — عدد الأيام: ${P(u.days)}`:""}</th></tr>
    <tr><th style="width:6%">اكتمال</th><th style="width:4%">م</th><th>الإجراء</th><th style="width:17%">وقت تنفيذ الإجراء</th><th style="width:20%">الشاهد الواجب توفير</th><th style="width:9%">الجهة المنفذة</th><th style="width:17%">تعذر توفير الشاهد من قبل المدرسة</th></tr></thead><tbody>
    ${UNEXC.slice(0,tier.n).map(r=>{ const v=u?(((u.steps||{})[r[0]]||{}).s):""; return `<tr><td class="c">${v==="c"?'<span class="tick">✓</span>':v==="n"?"✗":""}</td><td class="c">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td class="c">${esc(r[4])}</td><td style="font-size:8.5pt">${esc(r[5])}</td></tr>`; }).join("")}</tbody></table>`;
  });
  const behList=blank||!S.beh.length?["3","4","5"].map(d=>({deg:d,x:null})):S.beh.filter(x=>BEH[x.deg]).map(x=>({deg:x.deg,x}));
  behList.forEach(({deg,x})=>{
    const L=BEH[deg]; let r="";
    L.forEach((e,k)=>{ const m=mark(x?((x.items||{})[k]||{}).s:"",!x); r+=`<tr>${k===0?`<td rowspan="${L.length}" class="std">${esc(BEH_STD)}</td>`:""}<td>${esc(e)}</td><td class="c">${m[0]}</td><td class="c">${m[1]}</td></tr>`; });
    h+=`${x?`<p class="stuh" style="margin:6px 0 2px;padding:3px 6px">الطالب/ة: ${P(x.name)} ${x.cls?"("+P(x.cls)+")":""}</p>`:""}${stdTable(r,"شواهد تحقق المعيار / مخالفات الدرجة "+DEG_NAME[deg])}`;
  });
  return h+`</section>`;
}
function printMissing(){ const m=missing(); return `<section class="pg">${hdr()}<h1>قائمة الشواهد غير المكتملة — ${P(S.school.name)}</h1>
  <table><thead><tr><th style="width:5%">م</th><th style="width:26%">المجال</th><th>الشاهد</th><th style="width:16%">المسؤول / الموعد</th></tr></thead><tbody>
  ${m.map((x,i)=>`<tr><td class="c">${i+1}</td><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td></td></tr>`).join("")||`<tr><td colspan="4" class="c">جميع الشواهد مكتملة</td></tr>`}</tbody></table></section>`; }
function doPrint(parts){ const h=parts.join(""); if(!h){ alert("اختر جزءًا للطباعة."); return; } document.getElementById("printArea").innerHTML=h; document.body.classList.add("printing"); setTimeout(()=>window.print(),80); }
window.addEventListener("afterprint",()=>{ document.body.classList.remove("printing"); document.getElementById("printArea").innerHTML=""; });

/* ===================== النسخ الاحتياطي ===================== */
function hasData(){ return !!(S.school.name||Object.keys(S.st).length||S.unexc.length||S.beh.length); }
function renderBackupWarn(){ const box=document.getElementById("backupWarn"); if(!box) return; let last=null; try{ last=localStorage.getItem("portal_lastBackup_standards")||localStorage.getItem("portal_lastBackup_all"); }catch(e){}
  const stale=hasData()&&(!last||(Date.now()-new Date(last).getTime())/86400000>=14);
  box.innerHTML=stale?`<div class="warnbar">⚠️ ${last?"مضى أكثر من 14 يومًا على آخر نسخة احتياطية.":"لم تصدّر نسخة احتياطية لهذه الأداة بعد."} البيانات محفوظة في متصفح هذا الجهاز فقط.<button class="btn gold sm" data-act="backup">تصدير نسخة الآن</button></div>`:""; }

/* ===================== الأحداث ===================== */
const view=document.getElementById("app");
function onField(e){ const t=e.target, k=t.getAttribute&&t.getAttribute("data-k"); if(!k) return; setPath(k,t.value); save(); if(e.type==="change"&&(/\.days$/.test(k)||/\.deg$/.test(k))) render(); }
view.addEventListener("input",onField); view.addEventListener("change",onField);
document.getElementById("steps").addEventListener("click",e=>{ const b=e.target.closest("[data-step]"); if(b) go(+b.getAttribute("data-step")); });
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(+g.getAttribute("data-go")); return; }
  const t=e.target.closest("[data-tog]"); if(t){ const p=t.getAttribute("data-tog"), v=t.getAttribute("data-v"); setPath(p,getPath(p)===v?"":v); save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.getAttribute("data-act"), i=+b.getAttribute("data-i");
  switch(a){
    case "addExc": S.excStu.push({id:uid(),name:"",cls:"",dates:""}); break;
    case "addUnexc": S.unexc.push({id:uid(),name:"",cls:"",days:"",steps:{}}); break;
    case "addBeh": S.beh.push({id:uid(),name:"",cls:"",deg:"",items:{}}); break;
    case "del": if(!confirm("حذف هذا الطالب من العينة؟")) return; S[b.getAttribute("data-l")].splice(i,1); break;
    case "doPrint": { const on=id=>{ const x=document.getElementById(id); return x&&x.checked; }, parts=[]; if(on("pForm")) parts.push(printForm(false)); if(on("pBlank")) parts.push(printForm(true)); if(on("pMiss")) parts.push(printMissing()); doPrint(parts); return; }
    case "backup": if(window.PN) PN.open(); return;
    case "reset": if(!confirm("حذف جميع بيانات هذه الأداة من هذا الجهاز؟")) return; if(!confirm("تأكيد نهائي؟")) return; localStorage.removeItem(KEY); S=blank(); render(); renderBackupWarn(); return;
    default: return;
  }
  save(); const y=window.scrollY; render(); window.scrollTo(0,y);
});
render(); renderBackupWarn();
</script>

<script>

    {id:"grades",     href:"grades.html",     title:"تحليل النتائج", keys:[], disabled:true},
    {id:"committees", href:"committees.html", title:"اللجان والتكليفات", keys:["SCV2"]},
    {id:"jobs",       href:"job-description.html", title:"الوصف الوظيفي للتشكيلات المدرسية", keys:["JOBDESC_"]},
    {id:"improvement", href:"improvement-plan.html", title:"تحليل الواقع وخطة التحسين", keys:["IMPPLAN_"]},
    {id:"activity", href:"activity-plan.html", title:"خطة النشاط الطلابي وبطاقات التنفيذ", keys:["ACTPLAN_"]},
    {id:"standards", href:"standards-followup.html", title:"متابعة معايير الأداء والالتزام", keys:["STDFOLLOW_"]}
  ];
  var ALL_PREFIXES = ["moe_","SCV2","JOBDESC_","VIOL_","IMPPLAN_","ACTPLAN_","STDFOLLOW_"];
  var LABELS = {
    moe_behavior_records_v1:"مخالفة سلوكية", moe_absence_records_v1:"سجل غياب",
    moe_compensation_records_v1:"فرصة تعويض", moe_roster_v1:"طالب مستورد من نور",
    JOBDESC_V1:"وصف وظيفي", JOBDESC_PRINTLOG_V1:"عملية طباعة"
  };
  var REMIND_DAYS = 14;
  var cur = SECTIONS.filter(function(s){return s.id===PAGE;})[0] || null;

  function $(id){ return document.getElementById(id); }
  function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
  function matches(k, prefixes){ return prefixes.some(function(p){ return k===p || k.indexOf(p)===0; }); }
  function keysFor(prefixes){
    var s = ls(), out = []; if(!s) return out;
    for(var i=0;i<s.length;i++){ var k = s.key(i); if(k && matches(k, prefixes)) out.push(k); }
    return out.sort();
  }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString("ar-SA",{dateStyle:"medium",timeStyle:"short"}); }catch(e){ return iso; } }
  function toast(msg){
    var t = $("pnToast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }
  function lastKey(scope){ return "portal_lastBackup_" + scope; }
  function getLast(scope){ var s=ls(); return s ? s.getItem(lastKey(scope)) : null; }

  /* ---- summary of what is stored ---- */
  function summary(prefixes){
    var s = ls(), items = [], keys = keysFor(prefixes);
    keys.forEach(function(k){
      var v = s.getItem(k), p = null;
      try{ p = JSON.parse(v); }catch(e){}
      if(k === "SCV2" && p && typeof p === "object"){
        items.push((p.staff||[]).length + " منسوب");
        items.push((p.comms||[]).length + " لجنة");
        items.push((p.decs||[]).length + " قرار");
        items.push((p.meets||[]).length + " اجتماع");
      } else if(k === "VIOL_LAST_V1" && p && Array.isArray(p.arr)){
        items.push("تحليل محفوظ: " + (p.total||0) + " مخالفة لـ " + p.arr.length + " طالبًا");
      } else if(k === "IMPPLAN_V1" && p && typeof p === "object"){
        items.push("تحليل واقع وخطة تحسين");
        items.push(((p.plan && p.plan.rows) || []).length + " إجراء تحسين");
        items.push((p.exec || []).length + " أسبوع تنفيذ");
      } else if(k === "ACTPLAN_V1" && p && typeof p === "object"){
        items.push((p.entries || []).length + " برنامج نشاط");
        items.push((p.teachers || []).length + " معلم في الإسناد");
      } else if(k === "STDFOLLOW_V1" && p && typeof p === "object"){
        items.push("متابعة معايير الأداء والالتزام");
      } else if(Array.isArray(p) && LABELS[k]){
        items.push(p.length + " " + LABELS[k]);
      }
    });
    var meta = keys.filter(function(k){ return k.indexOf("moe_meta_")===0 && s.getItem(k); }).length;
    if(meta) items.push("بيانات المدرسة");
    var RECORD_KEYS = ["moe_behavior_records_v1","moe_absence_records_v1","moe_compensation_records_v1","JOBDESC_PRINTLOG_V1"];
    var hasData = keys.some(function(k){
      var p = null; try{ p = JSON.parse(s.getItem(k)); }catch(e){ return false; }
      if(k === "VIOL_LAST_V1") return !!(p && Array.isArray(p.arr) && p.arr.length);
      if(k === "SCV2") return !!(p && ["staff","comms","decs","meets"].some(function(x){ return (p[x]||[]).length; }));
      if(k === "IMPPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.plan && p.plan.rows && p.plan.rows.length) || (p.exec && p.exec.length) || (p.prio && p.prio.length)));
      if(k === "ACTPLAN_V1") return !!(p && typeof p === "object" && ((p.entries && p.entries.length) || (p.teachers && p.teachers.length)));
      if(k === "STDFOLLOW_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.st && Object.keys(p.st).length) || (p.unexc && p.unexc.length) || (p.beh && p.beh.length)));
      return RECORD_KEYS.indexOf(k) > -1 && Array.isArray(p) && p.length > 0;
    });
    return {keys:keys, items:items, hasData:hasData};
  }

  /* ---- export ---- */
  function doExport(scope){
    var s = ls(); if(!s){ alert("المتصفح لا يسمح بالوصول للتخزين المحلي."); return; }
    var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
    var keys = keysFor(prefixes);
    if(keys.indexOf("SCV2") > -1){ // مزامنة تاريخ آخر نسخة مع تنبيه نظام اللجان
      try{
        if(PAGE === "committees" && typeof db === "object" && db && db.meta){
          db.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(db));
          if(typeof renderDbWarn === "function") renderDbWarn();
          if(typeof renderBackupInfo === "function") renderBackupInfo();
        } else {
          var sc = JSON.parse(s.getItem("SCV2")||"null");
          if(sc && typeof sc === "object"){ sc.meta = sc.meta || {}; sc.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(sc)); }
        }
      }catch(e){}
    }
    if(!keys.length){ toast("لا توجد بيانات محفوظة لتصديرها"); return; }
    var data = {}; keys.forEach(function(k){ data[k] = s.getItem(k); });
    var now = new Date();
    var pack = {app:APP, v:1, scope:scope, title: scope==="all" ? "جميع الأقسام" : cur.title,
                createdAt: now.toISOString(), keys:data};
    var name = (scope==="all" ? "جميع-الأقسام" : cur.title.replace(/\s+/g,"-")) + "-نسخة-احتياطية-" + now.toISOString().slice(0,10) + ".json";
    var blob = new Blob([JSON.stringify(pack)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    s.setItem(lastKey(scope), now.toISOString());
    if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), now.toISOString()); });
    else s.setItem(lastKey(scope), now.toISOString());
    render(); refreshDot();
    toast("تم تنزيل النسخة الاحتياطية ✓ احفظها في بريدك أو OneDrive");
  }

  /* ---- import ---- */
  function doImport(scope, file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var p; try{ p = JSON.parse(r.result); }catch(e){ alert("الملف ليس نسخة احتياطية صالحة (JSON)."); return; }
      var s = ls(); if(!s) return;
      var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
      var incoming = {};
      if(p && p.app === APP && p.keys && typeof p.keys === "object"){
        Object.keys(p.keys).forEach(function(k){ if(matches(k, prefixes) && typeof p.keys[k] === "string") incoming[k] = p.keys[k]; });
      } else if(p && Array.isArray(p.staff) && Array.isArray(p.comms) && matches("SCV2", prefixes)){
        incoming.SCV2 = JSON.stringify(p); // نسخة قديمة من نظام اللجان
      } else {
        alert("هذا الملف لا يطابق نسخ هذا الموقع، لم تتم الاستعادة."); return;
      }
      var n = Object.keys(incoming).length;
      if(!n){ alert("الملف لا يحتوي بيانات خاصة بهذا القسم. جرّب الاستيراد من «النسخة الشاملة» أو من القسم الصحيح."); return; }
      var when = p.createdAt ? "\nتاريخ النسخة: " + fmtDate(p.createdAt) : "";
      if(!confirm("سيتم استبدال بيانات " + (scope==="all" ? "جميع الأقسام" : "هذا القسم") + " على هذا الجهاز ببيانات الملف." + when + "\n\nمتابعة؟")) return;
      keysFor(prefixes).forEach(function(k){ s.removeItem(k); });
      Object.keys(incoming).forEach(function(k){ s.setItem(k, incoming[k]); });
      var stamp = p.createdAt || new Date().toISOString(); // البيانات مطابقة لهذه النسخة
      s.setItem(lastKey(scope), stamp);
      if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), stamp); });
      alert("تمت الاستعادة بنجاح ✓ سيُعاد تحميل الصفحة لعرض البيانات.");
      location.reload();
    };
    r.readAsText(file);
  }

  /* ---- UI ---- */
  var icoHome = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M3.5 11L12 4l8.5 7"/><path stroke-linejoin="round" d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
  var icoSave = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>';

  function box(scope, title, prefixes, extra){
    var sm = summary(prefixes), last = getLast(scope);
    return '<div class="pn-box"><h3>' + title + '</h3>' + (extra||"") +
      '<div class="pn-meta">آخر نسخة احتياطية من هذا الجهاز: <b>' + (last ? fmtDate(last) : "لم تُنشأ بعد") + '</b></div>' +
      (sm.items.length ? '<ul class="pn-sum">' + sm.items.map(function(x){return "<li>"+x+"</li>";}).join("") + '</ul>'
                       : '<p class="pn-note" style="margin-bottom:10px">لا توجد بيانات محفوظة على هذا الجهاز حاليًا.</p>') +
      '<div class="pn-acts"><button type="button" class="pn-exp" data-exp="' + scope + '">⬇️ تصدير نسخة</button>' +
      '<label class="pn-imp">⬆️ استيراد نسخة<input type="file" accept=".json,application/json" data-imp="' + scope + '"></label></div></div>';
  }

  function render(){
    var body = $("pnBody"); if(!body) return;
    var html = '<div class="pn-steps"><b>لنقل بياناتك إلى جهاز آخر:</b><ol>' +
      '<li>اضغط «تصدير نسخة» على هذا الجهاز، فيُنزَّل ملف بصيغة JSON.</li>' +
      '<li>أرسل الملف لنفسك (البريد، OneDrive، واتساب…).</li>' +
      '<li>افتح نفس القسم على الجهاز الآخر، ثم «استيراد نسخة» واختر الملف.</li></ol></div>';
    if(cur && cur.keys.length){
      var stale = isStale(cur.id, cur.keys);
      html += box(cur.id, "نسخة هذا القسم: " + cur.title, cur.keys,
        stale ? '<p class="pn-warn">⚠️ لديك بيانات بدون نسخة احتياطية حديثة. البيانات محفوظة في متصفح هذا الجهاز فقط، ومسح المتصفح يفقدها.</p>' : "");
    } else if(cur){
      html += '<div class="pn-box"><h3>' + cur.title + '</h3><p class="pn-note">هذا القسم لا يحفظ بيانات على الجهاز؛ فهو يحلل الملفات التي ترفعها مباشرة، لذلك لا يحتاج نسخة خاصة. لنقل بيانات الأقسام الأخرى استخدم النسخة الشاملة.</p></div>';
    }
    html += box("all", "نسخة شاملة لجميع الأقسام", ALL_PREFIXES,
      '<p class="pn-note" style="margin-bottom:6px">تشمل: نماذج السلوك والمواظبة، وآخر تحليل لمحلل المخالفات، واللجان والتكليفات، والوصف الوظيفي، وتحليل الواقع وخطة التحسين، وخطة النشاط الطلابي، ومتابعة معايير الأداء والالتزام — في ملف واحد.</p>');
    body.innerHTML = html;
  }

  function isStale(scope, prefixes){
    if(!summary(prefixes).hasData) return false;
    var last = getLast(scope) || getLast("all");
    if(!last) return true;
    return (Date.now() - new Date(last).getTime()) / 86400000 >= REMIND_DAYS;
  }
  function refreshDot(){
    var b = $("pnBackupBtn"); if(!b) return;
    var warn = cur && cur.keys.length ? isStale(cur.id, cur.keys) : false;
    b.classList.toggle("warn", !!warn);
    b.title = warn ? "لا توجد نسخة احتياطية حديثة لبيانات هذا القسم" : "النسخ الاحتياطي ونقل البيانات";
  }

  function open(){ render(); $("pnOv").classList.add("open"); var x=$("pnOv").querySelector(".pn-x"); if(x) x.focus(); }
  function close(){ $("pnOv").classList.remove("open"); }

  function build(){
    if(PAGE !== "home"){
      var bar = document.createElement("nav");
      bar.className = "pn-bar"; bar.setAttribute("aria-label","التنقل بين الأقسام");
      var opts = SECTIONS.map(function(s){
        return '<option value="' + s.href + '"' + (s.id===PAGE?" selected":"") + (s.disabled?" disabled":"") + '>' +
          s.title + (s.disabled?" (مغلق للتطوير)":"") + '</option>';
      }).join("");
      bar.innerHTML = '<a class="pn-home" href="index.html">' + icoHome + '<span>الرئيسية</span></a>' +
        '<div class="pn-sec"><label for="pnSel">الانتقال إلى:</label><select id="pnSel">' + opts + '</select></div>' +
        '<button type="button" class="pn-btn" id="pnBackupBtn">' + icoSave + '<span class="pn-t">النسخ الاحتياطي</span><span class="pn-dot"></span></button>';
      document.body.insertBefore(bar, document.body.firstChild);
      $("pnSel").addEventListener("change", function(){ if(this.value) location.href = this.value; });
      $("pnBackupBtn").addEventListener("click", open);
    }
    var ov = document.createElement("div");
    ov.className = "pn-ov"; ov.id = "pnOv";
    ov.innerHTML = '<div class="pn-modal" role="dialog" aria-modal="true" aria-labelledby="pnTitle">' +
      '<div class="pn-mh"><h2 id="pnTitle">النسخ الاحتياطي ونقل البيانات</h2><button type="button" class="pn-x" aria-label="إغلاق">✕</button></div>' +
      '<div class="pn-mb" id="pnBody"></div></div>';
    document.body.appendChild(ov);
    var t = document.createElement("div"); t.className = "pn-toast"; t.id = "pnToast"; document.body.appendChild(t);
    ov.addEventListener("click", function(e){
      if(e.target === ov || e.target.closest(".pn-x")) return close();
      var ex = e.target.closest("[data-exp]"); if(ex) doExport(ex.getAttribute("data-exp"));
    });
    ov.addEventListener("change", function(e){
      var inp = e.target.closest("[data-imp]"); if(inp){ doImport(inp.getAttribute("data-imp"), inp.files[0]); inp.value = ""; }
    });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && ov.classList.contains("open")) close(); });
    refreshDot();
  }

  window.PN = {open:open};
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
})();
</script>
<!-- ===== /PORTAL NAV & BACKUP ===== -->
</body>
</html>
