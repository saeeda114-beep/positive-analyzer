<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطة الأسبوعية والفصلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy-900:#0a2733;--navy-800:#0f3d4c;--teal-700:#155a6c;--teal-600:#1d5c6e;--teal-500:#237e93;--gold:#c99a45;--bg:#f3f6f8;--line:#dbe4ea;--muted:#5c7180;--ink:#16232b;--rd:#b3261e;--ok:#13824a;
  --shadow:0 2px 8px rgba(10,39,51,.06),0 10px 30px rgba(10,39,51,.06);--form:#1a8a4a;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
button{font-family:inherit;}
header.top{background:linear-gradient(135deg,var(--navy-900),var(--navy-800) 60%,var(--teal-700));color:#fff;padding:22px 24px;}
header.top .in{max-width:1180px;margin:0 auto;} header.top h1{margin:0 0 4px;font-size:22px;font-weight:900;} header.top p{margin:0;font-size:13px;color:#cfe0e6;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px;}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--navy-800);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.step .n{min-width:22px;height:22px;border-radius:11px;background:#e6eef2;color:var(--navy-800);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;padding:0 5px;}
.step.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);} .step.active .n{background:var(--gold);color:#3a2a06;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:16.5px;color:var(--navy-800);border-inline-start:4px solid var(--gold);padding-inline-start:10px;}
.card h3{margin:14px 0 8px;font-size:14.5px;color:var(--teal-600);}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
.note{background:#fff8e8;border-inline-start:4px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
.warnbar{background:#fbeceb;color:#8f2a22;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
label.lb{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd9de;border-radius:8px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-500);outline-offset:0;}
.g{display:grid;gap:12px;} .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr);}} @media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
.btn.primary{background:var(--teal-600);color:#fff;} .btn.gold{background:var(--gold);color:#3a2a06;} .btn.light{background:#eef3f5;color:var(--navy-800);border:1px solid var(--line);}
.btn.danger{background:#fdecea;color:var(--rd);border:1px solid #f4c7c2;padding:6px 10px;font-size:12.5px;} .btn.sm{padding:6px 11px;font-size:12.5px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .between{justify-content:space-between;}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
.std{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
.std > b{display:block;color:var(--navy-800);margin-bottom:6px;}
.ev{display:grid;grid-template-columns:1fr 210px;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);}
.ev .tx{font-size:13.5px;}
.ev .tx small{color:var(--muted);}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.tog button{border:0;background:#fff;padding:6px 12px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted);}
.tog button.on.c{background:var(--ok);color:#fff;} .tog button.on.n{background:var(--rd);color:#fff;}
.ev .nt{grid-column:1/-1;}
.ev .nt input{font-size:12.5px;padding:5px 8px;}
@media(max-width:600px){.ev{grid-template-columns:1fr;}}
.tool{font-size:12px;font-weight:800;color:var(--teal-600);margin-inline-start:6px;}
.prog{height:10px;border-radius:6px;background:#e6eef2;overflow:hidden;} .prog i{display:block;height:100%;background:var(--ok);}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;} .kpi b{display:block;font-size:24px;color:var(--navy-800);}
.stu{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fbfdfd;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;} .tbl th,.tbl td{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:right;} .tbl th{background:#eef4f6;color:var(--navy-800);}
.scroll{overflow-x:auto;} .num{text-align:center !important;}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:20px;padding:1px 9px;background:#e8f3ef;color:#13704b;} .pill.warn{background:#fdecea;color:var(--rd);}
.hidden{display:none !important;}
#printArea{display:none;}
@media print{ @page{size:A4 landscape;margin:8mm;} body{background:#fff;} body.printing > *:not(#printArea){display:none !important;} body.printing #printArea{display:block;} *{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
#printArea{font-family:'Tajawal',Arial,sans-serif;color:#111;font-size:10.5pt;line-height:1.45;}
#printArea thead{display:table-header-group;}
#printArea .pg{page-break-after:always;break-after:page;} #printArea .pg:last-child{page-break-after:auto;break-after:auto;}
#printArea .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid var(--form);padding-bottom:4px;margin-bottom:8px;}
#printArea .ph .r{font-size:9.5pt;font-weight:800;line-height:1.45;} #printArea .ph img{height:15mm;}
#printArea h1{font-size:14pt;text-align:center;color:var(--form);margin:6px 0 8px;} #printArea h2{font-size:12pt;color:var(--form);margin:10px 0 5px;}
#printArea table{width:100%;border-collapse:collapse;margin-bottom:8px;}
#printArea th,#printArea td{border:1px solid #333;padding:3px 5px;font-size:9.5pt;vertical-align:middle;text-align:right;}
#printArea th{background:var(--form);color:#fff;text-align:center;} #printArea td.c{text-align:center;} #printArea td.lbl{background:var(--form);color:#fff;font-weight:800;white-space:nowrap;}
#printArea td.std{font-weight:800;background:#f4faf6;}
#printArea tr{break-inside:avoid;page-break-inside:avoid;}
#printArea .cb{display:inline-block;margin-inline-end:9px;white-space:nowrap;}
#printArea .cb i{display:inline-block;width:10px;height:10px;border:1.3px solid #222;margin-inline-end:3px;vertical-align:-1px;font-style:normal;font-size:8px;line-height:8px;text-align:center;font-weight:900;}
#printArea .tick{font-weight:900;font-size:11pt;}
#printArea .stuh{background:#eef7f1;font-weight:800;}

/* ===== ملاءمة الجوال ===== */
@media(max-width:700px){
  header.top{padding:14px 16px;} header.top h1{font-size:18px;} header.top p{font-size:12px;line-height:1.6;}
  .wrap{padding:10px 10px 30px;}
  .steps{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:0;z-index:30;background:var(--bg);margin:0 -10px 12px;padding:8px 10px;}
  .steps::-webkit-scrollbar{display:none;}
  .step{flex:0 0 auto;white-space:nowrap;}
  .card{padding:14px 12px;border-radius:12px;}
  .card h2{font-size:15.5px;}
  .tbl.stack thead{display:none;}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%;}
  .tbl.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fbfdfd;}
  .tbl.stack td{border:0;padding:4px 0;text-align:right !important;}
  .tbl.stack td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px;}
  .navbtns{position:sticky;bottom:0;z-index:20;background:var(--bg);padding:8px 0;margin-top:0;}
  .btn{padding:9px 13px;}
}
textarea{resize:vertical;line-height:1.55;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-800);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:9999;box-shadow:var(--shadow);}
.pill.blue{background:#e6f0f7;color:#1d5c8e;}
.dchip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;margin:2px;}
.dchip.on{background:#fdecea;color:var(--rd);border-color:#f4c7c2;} .dchip.on.ok{background:#e3f4ea;color:var(--ok);border-color:#b9e1c8;}
.days{display:inline-flex;flex-wrap:wrap;}
tr.hol td{background:#fff6e5;} tr.exam td{background:#fdf0ef;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;}
.chipb{border:1px solid #cfe0e6;background:#f4f9fa;border-radius:18px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--navy-800);cursor:pointer;text-align:right;}
.chipb:hover{background:#e3f0f3;}
.libbox details{border-top:1px dashed var(--line);padding:6px 0;} .libbox summary{cursor:pointer;font-weight:800;color:var(--teal-600);font-size:13.5px;}
.semgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px;}
.wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);}
.wcard.tw{outline:2px solid var(--gold);} .wcard.hol{background:#fffaf0;} .wcard.exam{background:#fff8f7;}
.wcard .g, .wcard > div{margin-bottom:6px;}
.wh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;} .wh b{color:var(--navy-800);font-size:15px;} .wh small{color:var(--muted);font-size:11.5px;line-height:1.5;flex:1;}
.holn{background:#fff1d6;color:#7a5410;border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;margin:0 0 8px;white-space:pre-line;}
.exn{background:#fdecea;color:var(--rd);border-radius:8px;padding:5px 10px;font-weight:800;font-size:13px;margin:0 0 8px;}
.days5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0;}
.dcol{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfdfd;} .dcol.off{background:#f6f6f6;}
.dcol textarea{font-size:12.5px;padding:6px 8px;}
.dh{font-weight:900;color:var(--navy-800);margin-bottom:6px;font-size:13.5px;} .dh small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
@media(max-width:1000px){.days5{grid-template-columns:repeat(2,1fr);}} @media(max-width:600px){.days5{grid-template-columns:1fr;}}
details.subj > summary{cursor:pointer;font-size:15px;color:var(--navy-800);display:flex;gap:8px;align-items:center;}
.chk{display:grid;gap:8px;} .ck{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;}
.ck input{width:auto;margin-top:5px;} .ck small{display:block;color:var(--teal-600);font-weight:700;margin-top:2px;}
.gl{margin:0;padding-inline-start:20px;font-size:13.5px;} .gl li{margin-bottom:5px;}
.subed{display:grid;gap:6px;background:#f7fafb;border-radius:10px;padding:10px;} .subed .row input{flex:1;}
#printArea .ph .c{text-align:center;font-weight:800;font-size:10pt;}
#printArea .sub{background:#5f5f5f;color:#fff;font-weight:800;padding:3px 10px;font-size:11pt;margin-bottom:0;}
#printArea table.sem{table-layout:fixed;margin-bottom:6px;break-inside:avoid;page-break-inside:avoid;}
#printArea table.sem th{background:#2e8b7a;} #printArea table.sem td.lbl,#printArea table.sem th.lbl{background:#2e8b7a;color:#fff;width:22mm;text-align:center;}
#printArea table.sem td{font-size:8.6pt;vertical-align:top;background:#f3faf4;} #printArea table.sem td.dt{background:#fff;font-weight:700;vertical-align:middle;}
#printArea td.hol{text-align:center;vertical-align:middle !important;color:#1a6e3a;font-weight:800;white-space:pre-line;} #printArea td.hol .hl{font-weight:500;color:#222;text-align:right;margin-top:4px;}
#printArea .ex{color:#c62828;font-weight:800;text-align:center;}
#printArea td.act{color:#1d5c8e;}
#printArea td ul{margin:0;padding-inline-start:13px;} #printArea td li{margin:0;}
#printArea .foot{font-size:8.5pt;margin-top:4px;} #printArea .foot div{margin-bottom:1px;}
#printArea table.sg td{border:0;font-weight:800;padding-top:10px;width:50%;}
#printArea table.wkp{table-layout:fixed;} #printArea table.sem td.lbl,#printArea table.wkp td.lbl{white-space:normal;} #printArea table.wkp td{font-size:8.6pt;vertical-align:top;} #printArea table.wkp td.lbl{background:#c8b98f;color:#222;vertical-align:middle;}
#printArea table.wkp th{background:#2e8b7a;} #printArea table.wkp th.lbl{background:#2e8b7a;color:#fff;} #printArea table.wkp td.dt{background:#3aa08c;color:#fff;font-weight:800;}
#printArea table.wkp td.hw{background:#2e8b7a;color:#fff;}
#printArea .k{color:#c62828;font-weight:800;} #printArea tr.blk td{height:16mm;} #printArea .offd{color:#888;font-weight:800;} #printArea td.offc{background:#f1f1f1;}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>الخطة الأسبوعية والفصلية</h1>
<p>خطة المدرسة الفصلية للأنشطة والفعاليات، وخطة التعلم الأسبوعية لكل صف، وإجراءات بنائها ونشرها مع الأسرة — وفق دليل «خطة المدرسة التعليمية ومشاركتها مع الأسرة» ونماذجه المعتمدة.</p></div></header>
<div class="wrap" id="app"><div id="backupWarn"></div><nav class="steps" id="steps"></nav><div id="view"></div></div>
<div id="printArea"></div>

   النماذج المقترحة للخطة الفصلية حسب المرحلة، نموذج خطة التعلم الأسبوعية)، والنماذج المقترحة للخطة الأسبوعية والفصلية (الإرشادات العامة)،

const GRADES={"ابتدائي":["الأول الابتدائي","الثاني الابتدائي","الثالث الابتدائي","الرابع الابتدائي","الخامس الابتدائي","السادس الابتدائي"],
  "متوسط":["الأول المتوسط","الثاني المتوسط","الثالث المتوسط"],"ثانوي":["الأول الثانوي","الثاني الثانوي","الثالث الثانوي"]};
function subjectsFor(grade){
  const st=S.school.stage, tah=S.school.type==="تحفيظ القرآن الكريم", gi=(GRADES[st]||[]).indexOf(grade);
  let a=[];
  if(st==="ابتدائي") a=(gi<=2?SUBJ_LOW:SUBJ_UP).slice();
  else if(st==="متوسط"){ a=SUBJ_UP.slice(); if(gi===2) a.push("التفكير الناقد"); }
  else if(st==="ثانوي") a=gi===0?SUBJ_SEC1.slice():[];
  if(tah&&a.length&&!(st==="ابتدائي"&&gi<=2)&&st!=="ثانوي") a.splice(1,0,"التجويد");
  return a;
}

/* ===================== الحالة والتخزين ===================== */
function blank(){ return {v:1,school:{name:"",admin:"",sector:"",stage:"",gender:"",type:"",year:"1448",sem:"",principal:"",excHead:""},
  cal:{start:"",weeks:""}, weeks:{}, proc:{}, phaseDate:{}, procX:[], prios:[], classes:[], wk:{}, chk:{}, pub:{}, semPub:"", ui:{tw:"1",cls:"",wk:"1",pcls:"",pwk:"1"}, step:0}; }
function load(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){} const b=blank(); if(!d||typeof d!=="object") return b;
  Object.keys(b).forEach(k=>{ if(d[k]==null||typeof d[k]!==typeof b[k]||Array.isArray(b[k])!==Array.isArray(d[k])) d[k]=b[k]; });
  ["school","cal","ui"].forEach(k=>{ d[k]=Object.assign({},b[k],d[k]); });
  d.classes.forEach(c=>{ if(!Array.isArray(c.subjects)) c.subjects=[]; });
  return d; }
let S=load(), saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ S.updated=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ alert("تعذر الحفظ: "+e.message); } renderBackupWarn(); renderSteps(); },250); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function getPath(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k],S); }
function setPath(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }
function inp(p,ph,ex){ const v=getPath(p); return `<input data-k="${p}" value="${esc(v==null?"":v)}" placeholder="${esc(ph||"")}" ${ex||""}>`; }
function ta(p,ph,rows){ const v=getPath(p); return `<textarea data-k="${p}" rows="${rows||3}" placeholder="${esc(ph||"")}">${esc(v==null?"":v)}</textarea>`; }
function sel(p,opts,ph){ const v=getPath(p)||""; return `<select data-k="${p}">${ph===false?"":`<option value="">${esc(ph||"— اختر —")}</option>`}${opts.map(o=>{ const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(lab)}</option>`; }).join("")}</select>`; }
function field(l,h){ return `<div><label class="lb">${l}</label>${h}</div>`; }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function lines(s){ return String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean); }

/* ===================== التقويم ===================== */
function hParts(d){ try{ const p={}; new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d).forEach(x=>{ p[x.type]=x.value; }); return p.year?{y:parseInt(p.year),m:+p.month,d:+p.day}:null; }catch(e){ return null; } }
function pd(s){ const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3],12):null; }
function addD(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function nWeeks(){ const n=parseInt(S.cal.weeks); return n>0&&n<=30?n:0; }
function sunday0(){ const d=pd(S.cal.start); return d?addD(d,-d.getDay()):null; }
function wkDays(i){ const s=sunday0(); if(!s) return null; const a=addD(s,(i-1)*7); return [0,1,2,3,4].map(k=>addD(a,k)); }
function gS(d){ return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function hS(d){ const h=hParts(d); return h?`${h.y}/${h.m}/${h.d}`:""; }
function dayLabel(d){ const h=hS(d); return (h?h+"هـ - ":"")+gS(d)+"م"; }
function rangeG(a,b){ return a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} ${GM[a.getMonth()]} ${b.getFullYear()}`:`${a.getDate()} ${GM[a.getMonth()]}${a.getFullYear()!==b.getFullYear()?" "+a.getFullYear():""} – ${b.getDate()} ${GM[b.getMonth()]} ${b.getFullYear()}`; }
function rangeH(a,b){ const x=hParts(a), y=hParts(b); if(!x||!y) return ""; return x.m===y.m?`${x.d} – ${y.d} ${HM[x.m-1]} ${y.y}هـ`:`${x.d} ${HM[x.m-1]} – ${y.d} ${HM[y.m-1]} ${y.y}هـ`; }
function W(i){ return S.weeks[i]||{}; }
function wType(i){ return W(i).type||""; }
function ORD(n){ const o=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون"]; return o[n]||String(n); }
function pubDate(i){ const s=sunday0(); if(!s) return null; return addD(s,(i-1)*7-3); } /* خميس الأسبوع السابق */
function datedIn(i){ const days=wkDays(i); if(!days) return []; const from=days[0], to=addD(days[0],6), out=[];
  DATED.forEach(o=>{ [from.getFullYear(),to.getFullYear()].filter((y,k,a)=>a.indexOf(y)===k).forEach(y=>{ let d;
    if(o.thu1){ d=new Date(y,o.m-1,1,12); while(d.getDay()!==4) d=addD(d,1); } else d=new Date(y,o.m-1,o.d,12);
    if(d>=from&&d<=to) out.push({o,d,txt:`${o.n} ${d.getDate()} ${GM[d.getMonth()]} ${d.getFullYear()}`}); }); });
  return out; }

/* ===================== روابط الأدوات الأخرى ===================== */
function readTool(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function impPrios(){ const d=readTool("IMPPLAN_V1"); if(!d) return []; const out=[];
  (Array.isArray(d.prio)?d.prio:[]).forEach(p=>{ if(p&&p.text&&out.indexOf(p.text)<0) out.push(p.text); }); return out; }
function actProgs(){ const d=readTool("ACTPLAN_V1"); if(!d||!Array.isArray(d.entries)) return []; const out=[]; d.entries.forEach(e=>{ if(e&&e.name&&out.indexOf(e.name)<0) out.push(e.name); }); return out; }
function importSchool(){ const a=readTool("IMPPLAN_V1"), b=readTool("ACTPLAN_V1"), src=[(a||{}).school,(b||{}).school].filter(Boolean); let n=0;
  src.forEach(s=>["name","admin","sector","stage","gender","principal"].forEach(k=>{ if(!S.school[k]&&s[k]){ S.school[k]=s[k]; n++; } })); return n; }

/* ===================== الخطوات ===================== */
const STEPS=[{t:"البيانات والتقويم",r:vBasic},{t:"الأسابيع",r:vWeeks},{t:"الأولويات والإجراءات",r:vProc},{t:"الخطة الفصلية",r:vSem},{t:"خطة التعلم الأسبوعية",r:vWeekly},{t:"المراجعة والنشر",r:vReview},{t:"الطباعة",r:vPrint}];
function stepDone(i){ switch(i){ case 0: return !!(S.school.name&&S.school.stage&&S.cal.start&&nWeeks()); case 1: return Object.keys(S.weeks).some(k=>W(k).type); case 2: return S.prios.length>0&&Object.values(S.proc).some(x=>x&&x.done);
  case 3: return semFilled()>0; case 4: return Object.keys(S.wk).length>0; case 5: return Object.values(S.chk).filter(Boolean).length===GUIDE_CHECK.length; default: return false; } }
function renderSteps(){ document.getElementById("steps").innerHTML=STEPS.map((s,i)=>`<button class="step${i===S.step?" active":""}" data-step="${i}"><span class="n">${stepDone(i)?"✓":i+1}</span>${s.t}</button>`).join(""); }
function go(i){ S.step=Math.max(0,Math.min(STEPS.length-1,i)); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function navBtns(){ return `<div class="navbtns">${S.step>0?`<button class="btn light" data-go="${S.step-1}">→ السابق</button>`:"<span></span>"}${S.step<STEPS.length-1?`<button class="btn primary" data-go="${S.step+1}">التالي ←</button>`:""}</div>`; }
function render(){ renderSteps(); document.getElementById("view").innerHTML=STEPS[S.step].r()+navBtns(); }

/* ---------- 4) الخطة الفصلية ---------- */
function semFilled(){ let n=0; for(let i=1;i<=nWeeks();i++){ const w=W(i); if(w.ev||w.val||w.act) n++; } return n; }
function actLabel(){ return S.school.stage==="ثانوي"?"الأنشطة اللاصفية":"الأنشطة الطلابية"; }
function modelUnits(){ const M=SEMM[S.school.stage]; if(!M) return [];
  const strip=[].concat(...DATED.map(o=>o.strip));
  return M.filter(u=>!u.hol).map(u=>({ev:u.ev.filter(x=>strip.indexOf(x)<0&&!/^اختبارات|إجازة/.test(x)),val:u.val,act:u.act.filter(x=>strip.indexOf(x)<0)})); }
function vSem(){ const n=nWeeks(); if(!n||!sunday0()) return `<div class="card"><p class="note">أكمل تقويم الفصل في الخطوة الأولى.</p></div>`;
  if(!S.school.stage) return `<div class="card"><p class="note">اختر المرحلة في الخطوة الأولى.</p></div>`;
  const tw=Math.min(Math.max(parseInt(S.ui.tw)||1,1),n), ip=impPrios(), ap=actProgs(), units=modelUnits();

function chip(t,f){ return `<button class="chipb" data-act="addTo" data-f="${f}" data-t="${esc(t)}">${f==="val"?"قيمة ":""}${esc(t)}</button>`; }
function addTo(i,f,t){ const p=`weeks.${i}.${f}`, cur=String(getPath(p)||"");
  if(f==="val"){ if(!cur.trim()) setPath(p,V(t)); else if(cur.indexOf(t)<0) setPath(p,cur.trim()+" - "+t); return; }
  if(lines(cur).indexOf(t)>=0){ toast("موجود مسبقًا في هذا الأسبوع"); return; }
  setPath(p,(cur.trim()?cur.trim()+"\n":"")+t); }
function semFill(){ const n=nWeeks(), units=modelUnits(), M=SEMM[S.school.stage]; if(!n||!units.length) return 0;
  const holU=M.find(u=>u.hol); let k=0, c=0;
  for(let i=1;i<=n;i++){ const w=S.weeks[i]=S.weeks[i]||{};
    if(w.type==="hol"){ if(!w.ev&&holU){ const hl=holU.hol.split("\n"); if(!w.note) w.note=hl[0]; w.ev=hl.slice(1).join("\n"); } continue; }
    const u=units[k++]; w.ev=""; w.val=""; w.act="";
    if(u){ w.ev=u.ev.join("\n"); w.val=u.val; w.act=u.act.join("\n"); c++; }
    else { w.act=JA; } }

  if(cur.indexOf(x.o.n)>=0) return; setPath(p,(cur.trim()?cur.trim()+"\n":"")+x.txt); c++; }); } return c; }

    rows.forEach((r,k)=>{ let span=1; if(k>0&&rows[k-1].r===r.r) span=0; else { while(k+span<rows.length&&rows[k+span].r===r.r) span++; }
      h+=`<tr>${k===0?`<td class="lbl c" rowspan="${rows.length}">${P(ph.t)}${S.phaseDate[ph.id]?`<br><span style="font-weight:500">${P(S.phaseDate[ph.id])}</span>`:""}</td>`:""}<td>${P(r.t)}</td>${span?`<td class="c" rowspan="${span}">${P(r.r)}</td>`:""}<td class="c">${r.done?"✓":""}</td></tr>`; }); });
  return h+`</tbody></table><div class="foot"><div>ملحوظة: هذا النموذج نموذج استرشادي، وكل مدرسة تختلف إجراءاتها عن الأخرى بحسب تحليل واقعها.</div></div>${sign()}</section>`; }
function printPub(){ const n=nWeeks(); if(!n||!sunday0()) return ""; let h=`<section class="pg">${hdr()}<h1>جدول نشر خطط التعلم الأسبوعية عبر منصة «مدرستي»</h1><table><thead><tr><th>خطة الأسبوع</th><th>تاريخ الأسبوع</th><th>موعد النشر (الخميس)</th><th>الفصول المكتملة</th><th>النشر</th></tr></thead><tbody>`;
  for(let i=1;i<=n;i++){ const d=wkDays(i); if(wType(i)==="hol"){ h+=`<tr><td class="c">${ORD(i)}</td><td class="c">${P(rangeG(d[0],d[4]))}</td><td class="c" colspan="3">إجازة</td></tr>`; continue; }
    const full=S.classes.filter(c=>{ const s=weekStats(c,i); return s.t&&s.f===s.t; }).length;
    h+=`<tr><td class="c">${ORD(i)}</td><td class="c">${P(rangeG(d[0],d[4]))}</td><td class="c">${P(dayLabel(pubDate(i)))}</td><td class="c">${full}/${S.classes.length}</td><td class="c">${S.pub[i]?"✓":""}</td></tr>`; }
  return h+`</tbody></table><div class="foot"><div>* نشر الخطة الأسبوعية في يوم الخميس نهاية الأسبوع استعدادا لتنفيذها الأسبوع الذي يليه.</div></div></section>`; }
function cellHTML(x){ if(!cellFilled(x)) return ""; return `${x.t?`<div><b class="k">موضوع الدرس:</b> ${P(x.t)}</div>`:""}${x.g?`<div><b class="k">هدف التعلم:</b> ${P(x.g)}</div>`:""}`; }
function mergeRow(vals,off){ /* دمج الأيام المتتالية المتطابقة كما في نموذج الدليل */ const out=[]; for(let k=0;k<5;k++){ if(off.indexOf(k)>=0){ out.push({h:'<span class="offd">إجازة</span>',span:1,off:1}); continue; }
  const v=vals[k]; const last=out[out.length-1]; if(v&&last&&!last.off&&last.h===v){ last.span++; continue; } out.push({h:v,span:1}); } return out.map(x=>`<td colspan="${x.span}"${x.off?' class="c offc"':""}>${x.h||(x.off?"":"-")}</td>`).join(""); }
function printWeekly(c,w,blankF){ const days=wkDays(w); if(!days||wType(w)==="hol") return ""; const off=W(w).off||[], e=S.wk[wkKey(c.id,w)]||{}, ss=(e.s||{});
  let h=`<section class="pg">${hdr()}<h1>خطة التعلم (الأسبوعية) للصف ${P(c.grade)}${c.sec?` — فصل (${P(c.sec)})`:""}</h1><div class="sub">الأهداف التعليمية للأسبوع ${ORD(w)}:</div>
  <table class="wkp"><thead><tr><th class="lbl" style="width:32mm">اليوم</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr><tr><td class="lbl c">التاريخ</td>${days.map(d=>`<td class="c dt">${P(dayLabel(d))}</td>`).join("")}</tr></thead><tbody>`;
  c.subjects.forEach(s=>{ const x=ss[s.id]||{}, d=x.d||{};
    if(blankF){ h+=`<tr class="blk"><td class="lbl c">${P(s.n)}</td>${DAYS.map((_,k)=>`<td${off.indexOf(k)>=0?' class="c offc"':""}>${off.indexOf(k)>=0?'<span class="offd">إجازة</span>':'<div class="k">موضوع الدرس:</div><div class="k">هدف التعلم:</div>'}</td>`).join("")}</tr><tr class="blk"><td class="lbl c hw">الواجبات المنزلية</td>${DAYS.map((_,k)=>`<td${off.indexOf(k)>=0?' class="offc"':""}></td>`).join("")}</tr>`; return; }
    h+=`<tr><td class="lbl c">${P(s.n)}</td>${mergeRow(DAYS.map((_,k)=>cellHTML(d[k])),off)}</tr>`;
    const hw=DAYS.map((_,k)=>d[k]&&d[k].h?P(d[k].h):"");
    h+=`<tr><td class="lbl c hw"${x.fam?' rowspan="2"':""}>الواجبات المنزلية</td>${mergeRow(hw,off)}</tr>${x.fam?`<tr><td colspan="5"><b class="k">نشاط أسري:</b> ${P(x.fam)}</td></tr>`:""}`; });
  return h+`</tbody></table>${blankF?"":`<div class="foot"><div>تُربط الواجبات بمشاركة الأسرة والأنشطة داخل الصف وعلى منصة مدرستي.</div></div>`}</section>`; }
function doPrint(parts){ const h=parts.join(""); if(!h){ alert("لا يوجد محتوى للطباعة — تحقق من الاختيارات والتقويم."); return; } document.getElementById("printArea").innerHTML=h; document.body.classList.add("printing"); setTimeout(()=>window.print(),80); }
window.addEventListener("afterprint",()=>{ document.body.classList.remove("printing"); document.getElementById("printArea").innerHTML=""; });

/* ===================== النسخ الاحتياطي ===================== */
function hasData(){ return !!(S.school.name||S.cal.start||S.classes.length||Object.keys(S.weeks).length||S.prios.length||Object.keys(S.wk).length); }
function renderBackupWarn(){ const box=document.getElementById("backupWarn"); if(!box) return; let last=null; try{ last=localStorage.getItem("portal_lastBackup_weekly")||localStorage.getItem("portal_lastBackup_all"); }catch(e){}
  const stale=hasData()&&(!last||(Date.now()-new Date(last).getTime())/86400000>=14);
  box.innerHTML=stale?`<div class="warnbar">⚠️ ${last?"مضى أكثر من 14 يومًا على آخر نسخة احتياطية.":"لم تصدّر نسخة احتياطية لهذه الأداة بعد."} البيانات محفوظة في متصفح هذا الجهاز فقط.<button class="btn gold sm" data-act="backup">تصدير نسخة الآن</button></div>`:""; }

const view=document.getElementById("app");
const RERENDER=/^(cal\.|ui\.|school\.stage|school\.type|school\.sem|weeks\.\d+\.type)/;
function onField(e){ const t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-ck")){ S.chk[t.getAttribute("data-ck")]=t.checked; save(); return; }
  if(t.hasAttribute&&t.hasAttribute("data-pubsem")){ S.semPub=t.checked?"1":""; save(); return; }
  const k=t.getAttribute&&t.getAttribute("data-k"); if(!k) return; setPath(k,t.value); save();
  if(e.type==="change"&&RERENDER.test(k)){ const y=window.scrollY; render(); window.scrollTo(0,y); } }
view.addEventListener("input",onField); view.addEventListener("change",onField);
view.addEventListener("toggle",e=>{ const d=e.target; if(d.matches&&d.matches("details.subj")&&d.open) S.ui.open=d.getAttribute("data-sid"); },true);

  switch(a){
    case "impSchool": { const n=importSchool(); toast(n?`جُلب ${n} حقلًا من أدوات المنصة`:"لا توجد بيانات جديدة في أدوات المنصة على هذا الجهاز"); break; }
    case "clsAdd": { const gr=b.getAttribute("data-g"), sec=String(S.classes.filter(c=>c.grade===gr).length+1); S.classes.push({id:uid(),grade:gr,sec,subjects:subjectsFor(gr).map(n=>({id:uid(),n}))}); break; }
    case "clsDel": { const c=S.classes[i]; if(!confirm(`حذف ${clsName(c)} وخططه الأسبوعية؟`)) return; Object.keys(S.wk).forEach(k=>{ if(k.indexOf(c.id+"_")===0) delete S.wk[k]; }); S.classes.splice(i,1); break; }
    case "subjEdit": { const c=S.classes[i]; S.ui.subjEdit=S.ui.subjEdit===c.id?"":c.id; break; }
    case "subjAdd": S.classes[i].subjects.push({id:uid(),n:""}); break;
    case "subjDel": if(!confirm("حذف المادة من هذا الفصل؟")) return; S.classes[i].subjects.splice(j,1); break;
    case "subjUp": if(j>0){ const s=S.classes[i].subjects; [s[j-1],s[j]]=[s[j],s[j-1]]; } break;
    case "subjReset": { const c=S.classes[i], names=subjectsFor(c.grade); if(!names.length){ toast("لا توجد مواد افتراضية لهذا الصف"); return; } names.forEach(n=>{ if(!c.subjects.some(s=>s.n===n)) c.subjects.push({id:uid(),n}); }); toast("أُضيفت مواد الخطة الدراسية الناقصة"); break; }
    case "offTog": { const w=S.weeks[i]=S.weeks[i]||{}, k=+b.getAttribute("data-k"); w.off=Array.isArray(w.off)?w.off:[]; const p=w.off.indexOf(k); if(p>=0) w.off.splice(p,1); else w.off.push(k); w.off.sort(); break; }
    case "prioGuide": { let n=0; GUIDE_PRIOS.forEach(p=>{ if(!S.prios.some(x=>x.t===p[1])){ S.prios.push({id:uid(),g:p[0],t:p[1]}); n++; } }); toast(n?`أُدرجت ${n} أولويات من الدليل`:"مدرجة مسبقًا"); break; }
    case "prioImp": { const ip=impPrios(); if(!ip.length){ alert("لا توجد أولويات محفوظة في أداة «تحليل الواقع وخطة التحسين» على هذا الجهاز."); return; } let n=0; ip.forEach(t=>{ if(!S.prios.some(x=>x.t===t)){ S.prios.push({id:uid(),g:"أولويات خطة التحسين",t}); n++; } }); toast(n?`أُدرجت ${n} أولويات من خطة التحسين`:"مدرجة مسبقًا"); break; }
    case "prioAdd": S.prios.push({id:uid(),g:"",t:""}); break;
    case "prioDel": S.prios.splice(i,1); break;
    case "procTog": { const id=b.getAttribute("data-id"); S.proc[id]=S.proc[id]||{}; S.proc[id].done=!S.proc[id].done; break; }
    case "procXAdd": S.procX.push({id:uid(),ph:b.getAttribute("data-ph"),t:"",r:"",done:false}); break;
    case "procXTog": S.procX[i].done=!S.procX[i].done; break;
    case "procXDel": S.procX.splice(i,1); break;
    case "semFill": { if(semFilled()&&!confirm("سيُستبدل محتوى أسابيع الخطة الفصلية الحالية بمقترحات النموذج. متابعة؟")) return; const c=semFill(); toast(c?`وُزّعت مقترحات النموذج على ${c} أسبوعًا — راجعها وعدّلها`:"اختر المرحلة وأكمل التقويم أولًا"); break; }
    case "semDated": { const c=semDated(); toast(c?`أُضيفت ${c} مناسبة مؤرخة`:"لا مناسبات جديدة ضمن أسابيع الفصل"); break; }
    case "semClear": if(!confirm("مسح الفعاليات والقيم والأنشطة من جميع الأسابيع؟")) return; Object.values(S.weeks).forEach(w=>{ if(w){ w.ev=""; w.val=""; w.act=""; } }); break;
    case "setTw": S.ui.tw=String(i); break;
    case "addTo": { const tw=parseInt(S.ui.tw)||1; addTo(tw,b.getAttribute("data-f"),b.getAttribute("data-t")); save(); const y=window.scrollY; render(); window.scrollTo(0,y); toast(`أُضيف إلى الأسبوع ${tw}`); return; }
    case "wkPrev": case "wkNext": { const n=nWeeks(); let w=parseInt(S.ui.wk)||1; w=Math.min(Math.max(w+(a==="wkNext"?1:-1),1),n); S.ui.wk=String(w); break; }
    case "fillDays": { const c=S.classes.find(x=>x.id===S.ui.cls), key=wkKey(c.id,S.ui.wk), sid=b.getAttribute("data-sid"), base=`wk.${key}.s.${sid}.d`, d0=getPath(base+".0")||{};
      if(!d0.t&&!d0.g){ toast("اكتب موضوع الأحد وهدفه أولًا"); return; } const off=W(S.ui.wk).off||[]; let n=0;
      for(let k=1;k<5;k++){ if(off.indexOf(k)>=0) continue; const x=getPath(`${base}.${k}`)||{}; if(!x.t&&!x.g){ setPath(`${base}.${k}.t`,d0.t||""); setPath(`${base}.${k}.g`,d0.g||""); n++; } } S.ui.open=sid; toast(n?`كُرر في ${n} أيام`:"لا أيام فارغة"); break; }
    case "copyCls": { const n=copyClassPlan(); toast(n?`نُسخت الخطة إلى ${n} فصول (المواد المتطابقة بالاسم)`:"لا توجد فصول أخرى لنفس الصف أو الخطة فارغة"); break; }
    case "printOne": { const c=S.classes.find(x=>x.id===S.ui.cls); doPrint([printWeekly(c,+S.ui.wk,false)]); return; }
    case "pubTog": S.pub[i]=!S.pub[i]; break;
    case "doPrint": { const on=id=>{ const x=document.getElementById(id); return x&&x.checked; }, parts=[], w=parseInt(S.ui.pwk)||1, cls=S.ui.pcls?S.classes.filter(x=>x.id===S.ui.pcls):S.classes;
      if(on("pSem")) parts.push(printSem()); if(on("pProc")) parts.push(printProc()); if(on("pPub")) parts.push(printPub());

    case "backup": if(window.PN) PN.open(); return;

    default: return;
  }
  save(); const y=window.scrollY; render(); window.scrollTo(0,y);
});

/* ===== ملاءمة الجوال: تحويل جداول الإدخال إلى بطاقات، وإظهار الخطوة الحالية ===== */
function mobileFix(){
  document.querySelectorAll("#view .tbl").forEach(t=>{
    const heads=t.querySelectorAll("thead tr"); if(heads.length!==1) return;
    const ths=[...heads[0].children]; if(ths.some(th=>th.colSpan>1||th.rowSpan>1)) return;
    const labels=ths.map(th=>th.textContent.trim());
    let ok=true; t.querySelectorAll("tbody tr").forEach(tr=>{ if(tr.children.length!==labels.length) ok=false; });
    if(!ok) return;
    t.classList.add("stack");
    t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{ if(labels[i]) td.setAttribute("data-label",labels[i]); }));
  });
  const a=document.querySelector(".step.active"); if(a&&window.innerWidth<=700) a.scrollIntoView({inline:"center",block:"nearest"});
}
(function(){ const _render=render; render=function(){ _render.apply(this,arguments); mobileFix(); }; })();
render(); renderBackupWarn();

    {id:"improvement", href:"improvement-plan.html", title:"تحليل الواقع وخطة التحسين", keys:["IMPPLAN_"]},
    {id:"activity", href:"activity-plan.html", title:"خطة النشاط الطلابي وبطاقات التنفيذ", keys:["ACTPLAN_"]},
    {id:"standards", href:"standards-followup.html", title:"متابعة معايير الأداء والالتزام", keys:["STDFOLLOW_"]},
    {id:"weekly", href:"weekly-semester-plan.html", title:"الخطة الأسبوعية والفصلية", keys:["WSPLAN_"]}
  ];
  var ALL_PREFIXES = ["moe_","SCV2","JOBDESC_","VIOL_","IMPPLAN_","ACTPLAN_","STDFOLLOW_","WSPLAN_"];
  var LABELS = {
    moe_behavior_records_v1:"مخالفة سلوكية", moe_absence_records_v1:"سجل غياب",
    moe_compensation_records_v1:"فرصة تعويض", moe_roster_v1:"طالب مستورد من نور",
    JOBDESC_V1:"وصف وظيفي", JOBDESC_PRINTLOG_V1:"عملية طباعة"
  };
  var REMIND_DAYS = 14;
  var cur = SECTIONS.filter(function(s){return s.id===PAGE;})[0] || null;

  function $(id){ return document.getElementById(id); }
  function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
  function matches(k, prefixes){ return prefixes.some(function(p){ return k===p || k.indexOf(p)===0; }); }
  function keysFor(prefixes){
    var s = ls(), out = []; if(!s) return out;
    for(var i=0;i<s.length;i++){ var k = s.key(i); if(k && matches(k, prefixes)) out.push(k); }
    return out.sort();
  }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString("ar-SA",{dateStyle:"medium",timeStyle:"short"}); }catch(e){ return iso; } }
  function toast(msg){
    var t = $("pnToast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }
  function lastKey(scope){ return "portal_lastBackup_" + scope; }
  function getLast(scope){ var s=ls(); return s ? s.getItem(lastKey(scope)) : null; }

  /* ---- summary of what is stored ---- */
  function summary(prefixes){
    var s = ls(), items = [], keys = keysFor(prefixes);
    keys.forEach(function(k){
      var v = s.getItem(k), p = null;
      try{ p = JSON.parse(v); }catch(e){}
      if(k === "SCV2" && p && typeof p === "object"){
        items.push((p.staff||[]).length + " منسوب");
        items.push((p.comms||[]).length + " لجنة");
        items.push((p.decs||[]).length + " قرار");
        items.push((p.meets||[]).length + " اجتماع");
      } else if(k === "VIOL_LAST_V1" && p && Array.isArray(p.arr)){
        items.push("تحليل محفوظ: " + (p.total||0) + " مخالفة لـ " + p.arr.length + " طالبًا");
      } else if(k === "IMPPLAN_V1" && p && typeof p === "object"){
        items.push("تحليل واقع وخطة تحسين");
        items.push(((p.plan && p.plan.rows) || []).length + " إجراء تحسين");
        items.push((p.exec || []).length + " أسبوع تنفيذ");
      } else if(k === "ACTPLAN_V1" && p && typeof p === "object"){
        items.push((p.entries || []).length + " برنامج نشاط");
        items.push((p.teachers || []).length + " معلم في الإسناد");
      } else if(k === "STDFOLLOW_V1" && p && typeof p === "object"){
        items.push("متابعة معايير الأداء والالتزام");
      } else if(k === "WSPLAN_V1" && p && typeof p === "object"){
        items.push("الخطة الفصلية");
        items.push((p.classes || []).length + " فصل في خطة التعلم الأسبوعية");
      } else if(Array.isArray(p) && LABELS[k]){
        items.push(p.length + " " + LABELS[k]);
      }
    });
    var meta = keys.filter(function(k){ return k.indexOf("moe_meta_")===0 && s.getItem(k); }).length;
    if(meta) items.push("بيانات المدرسة");
    var RECORD_KEYS = ["moe_behavior_records_v1","moe_absence_records_v1","moe_compensation_records_v1","JOBDESC_PRINTLOG_V1"];
    var hasData = keys.some(function(k){
      var p = null; try{ p = JSON.parse(s.getItem(k)); }catch(e){ return false; }
      if(k === "VIOL_LAST_V1") return !!(p && Array.isArray(p.arr) && p.arr.length);
      if(k === "SCV2") return !!(p && ["staff","comms","decs","meets"].some(function(x){ return (p[x]||[]).length; }));
      if(k === "IMPPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.plan && p.plan.rows && p.plan.rows.length) || (p.exec && p.exec.length) || (p.prio && p.prio.length)));
      if(k === "ACTPLAN_V1") return !!(p && typeof p === "object" && ((p.entries && p.entries.length) || (p.teachers && p.teachers.length)));
      if(k === "WSPLAN_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.cal && p.cal.start) || (p.classes && p.classes.length) || (p.prios && p.prios.length) || (p.wk && Object.keys(p.wk).length)));
      if(k === "STDFOLLOW_V1") return !!(p && typeof p === "object" && ((p.school && p.school.name) || (p.st && Object.keys(p.st).length) || (p.unexc && p.unexc.length) || (p.beh && p.beh.length)));
      return RECORD_KEYS.indexOf(k) > -1 && Array.isArray(p) && p.length > 0;
    });
    return {keys:keys, items:items, hasData:hasData};
  }

  /* ---- export ---- */
  function doExport(scope){
    var s = ls(); if(!s){ alert("المتصفح لا يسمح بالوصول للتخزين المحلي."); return; }
    var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
    var keys = keysFor(prefixes);
    if(keys.indexOf("SCV2") > -1){ // مزامنة تاريخ آخر نسخة مع تنبيه نظام اللجان
      try{
        if(PAGE === "committees" && typeof db === "object" && db && db.meta){
          db.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(db));
          if(typeof renderDbWarn === "function") renderDbWarn();
          if(typeof renderBackupInfo === "function") renderBackupInfo();
        } else {
          var sc = JSON.parse(s.getItem("SCV2")||"null");
          if(sc && typeof sc === "object"){ sc.meta = sc.meta || {}; sc.meta.lastExport = new Date().toISOString(); s.setItem("SCV2", JSON.stringify(sc)); }
        }
      }catch(e){}
    }
    if(!keys.length){ toast("لا توجد بيانات محفوظة لتصديرها"); return; }
    var data = {}; keys.forEach(function(k){ data[k] = s.getItem(k); });
    var now = new Date();
    var pack = {app:APP, v:1, scope:scope, title: scope==="all" ? "جميع الأقسام" : cur.title,
                createdAt: now.toISOString(), keys:data};
    var name = (scope==="all" ? "جميع-الأقسام" : cur.title.replace(/\s+/g,"-")) + "-نسخة-احتياطية-" + now.toISOString().slice(0,10) + ".json";
    var blob = new Blob([JSON.stringify(pack)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    s.setItem(lastKey(scope), now.toISOString());
    if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), now.toISOString()); });
    else s.setItem(lastKey(scope), now.toISOString());
    render(); refreshDot();
    toast("تم تنزيل النسخة الاحتياطية ✓ احفظها في بريدك أو OneDrive");
  }

  /* ---- import ---- */
  function doImport(scope, file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var p; try{ p = JSON.parse(r.result); }catch(e){ alert("الملف ليس نسخة احتياطية صالحة (JSON)."); return; }
      var s = ls(); if(!s) return;
      var prefixes = scope === "all" ? ALL_PREFIXES : cur.keys;
      var incoming = {};
      if(p && p.app === APP && p.keys && typeof p.keys === "object"){
        Object.keys(p.keys).forEach(function(k){ if(matches(k, prefixes) && typeof p.keys[k] === "string") incoming[k] = p.keys[k]; });
      } else if(p && Array.isArray(p.staff) && Array.isArray(p.comms) && matches("SCV2", prefixes)){
        incoming.SCV2 = JSON.stringify(p); // نسخة قديمة من نظام اللجان
      } else {
        alert("هذا الملف لا يطابق نسخ هذا الموقع، لم تتم الاستعادة."); return;
      }
      var n = Object.keys(incoming).length;
      if(!n){ alert("الملف لا يحتوي بيانات خاصة بهذا القسم. جرّب الاستيراد من «النسخة الشاملة» أو من القسم الصحيح."); return; }
      var when = p.createdAt ? "\nتاريخ النسخة: " + fmtDate(p.createdAt) : "";
      if(!confirm("سيتم استبدال بيانات " + (scope==="all" ? "جميع الأقسام" : "هذا القسم") + " على هذا الجهاز ببيانات الملف." + when + "\n\nمتابعة؟")) return;
      keysFor(prefixes).forEach(function(k){ s.removeItem(k); });
      Object.keys(incoming).forEach(function(k){ s.setItem(k, incoming[k]); });
      var stamp = p.createdAt || new Date().toISOString(); // البيانات مطابقة لهذه النسخة
      s.setItem(lastKey(scope), stamp);
      if(scope === "all") SECTIONS.forEach(function(sec){ if(sec.keys.length) s.setItem(lastKey(sec.id), stamp); });
      alert("تمت الاستعادة بنجاح ✓ سيُعاد تحميل الصفحة لعرض البيانات.");
      location.reload();
    };
    r.readAsText(file);
  }

  /* ---- UI ---- */
  var icoHome = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M3.5 11L12 4l8.5 7"/><path stroke-linejoin="round" d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
  var icoSave = '<svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>';

  function box(scope, title, prefixes, extra){
    var sm = summary(prefixes), last = getLast(scope);
    return '<div class="pn-box"><h3>' + title + '</h3>' + (extra||"") +
      '<div class="pn-meta">آخر نسخة احتياطية من هذا الجهاز: <b>' + (last ? fmtDate(last) : "لم تُنشأ بعد") + '</b></div>' +
      (sm.items.length ? '<ul class="pn-sum">' + sm.items.map(function(x){return "<li>"+x+"</li>";}).join("") + '</ul>'
                       : '<p class="pn-note" style="margin-bottom:10px">لا توجد بيانات محفوظة على هذا الجهاز حاليًا.</p>') +
      '<div class="pn-acts"><button type="button" class="pn-exp" data-exp="' + scope + '">⬇️ تصدير نسخة</button>' +
      '<label class="pn-imp">⬆️ استيراد نسخة<input type="file" accept=".json,application/json" data-imp="' + scope + '"></label></div></div>';
  }

  function render(){
    var body = $("pnBody"); if(!body) return;
    var html = '<div class="pn-steps"><b>لنقل بياناتك إلى جهاز آخر:</b><ol>' +
      '<li>اضغط «تصدير نسخة» على هذا الجهاز، فيُنزَّل ملف بصيغة JSON.</li>' +
      '<li>أرسل الملف لنفسك (البريد، OneDrive، واتساب…).</li>' +
      '<li>افتح نفس القسم على الجهاز الآخر، ثم «استيراد نسخة» واختر الملف.</li></ol></div>';
    if(cur && cur.keys.length){
      var stale = isStale(cur.id, cur.keys);
      html += box(cur.id, "نسخة هذا القسم: " + cur.title, cur.keys,
        stale ? '<p class="pn-warn">⚠️ لديك بيانات بدون نسخة احتياطية حديثة. البيانات محفوظة في متصفح هذا الجهاز فقط، ومسح المتصفح يفقدها.</p>' : "");
    } else if(cur){
      html += '<div class="pn-box"><h3>' + cur.title + '</h3><p class="pn-note">هذا القسم لا يحفظ بيانات على الجهاز؛ فهو يحلل الملفات التي ترفعها مباشرة، لذلك لا يحتاج نسخة خاصة. لنقل بيانات الأقسام الأخرى استخدم النسخة الشاملة.</p></div>';
    }
    html += box("all", "نسخة شاملة لجميع الأقسام", ALL_PREFIXES,
      '<p class="pn-note" style="margin-bottom:6px">تشمل: نماذج السلوك والمواظبة، وآخر تحليل لمحلل المخالفات، واللجان والتكليفات، والوصف الوظيفي، وتحليل الواقع وخطة التحسين، وخطة النشاط الطلابي، ومتابعة معايير الأداء والالتزام، والخطة الأسبوعية والفصلية — في ملف واحد.</p>');
    body.innerHTML = html;
  }

  function isStale(scope, prefixes){
    if(!summary(prefixes).hasData) return false;
    var last = getLast(scope) || getLast("all");
    if(!last) return true;
    return (Date.now() - new Date(last).getTime()) / 86400000 >= REMIND_DAYS;
  }
  function refreshDot(){
    var b = $("pnBackupBtn"); if(!b) return;
    var warn = cur && cur.keys.length ? isStale(cur.id, cur.keys) : false;
    b.classList.toggle("warn", !!warn);
    b.title = warn ? "لا توجد نسخة احتياطية حديثة لبيانات هذا القسم" : "النسخ الاحتياطي ونقل البيانات";
  }

  function open(){ render(); $("pnOv").classList.add("open"); var x=$("pnOv").querySelector(".pn-x"); if(x) x.focus(); }
  function close(){ $("pnOv").classList.remove("open"); }

  function build(){
    if(PAGE !== "home"){
      var bar = document.createElement("nav");
      bar.className = "pn-bar"; bar.setAttribute("aria-label","التنقل بين الأقسام");
      var opts = SECTIONS.map(function(s){
        return '<option value="' + s.href + '"' + (s.id===PAGE?" selected":"") + (s.disabled?" disabled":"") + '>' +
          s.title + (s.disabled?" (مغلق للتطوير)":"") + '</option>';
      }).join("");
      bar.innerHTML = '<a class="pn-home" href="index.html">' + icoHome + '<span>الرئيسية</span></a>' +
        '<div class="pn-sec"><label for="pnSel">الانتقال إلى:</label><select id="pnSel">' + opts + '</select></div>' +
        '<button type="button" class="pn-btn" id="pnBackupBtn">' + icoSave + '<span class="pn-t">النسخ الاحتياطي</span><span class="pn-dot"></span></button>';
      document.body.insertBefore(bar, document.body.firstChild);
      $("pnSel").addEventListener("change", function(){ if(this.value) location.href = this.value; });
      $("pnBackupBtn").addEventListener("click", open);
    }
    var ov = document.createElement("div");
    ov.className = "pn-ov"; ov.id = "pnOv";
    ov.innerHTML = '<div class="pn-modal" role="dialog" aria-modal="true" aria-labelledby="pnTitle">' +
      '<div class="pn-mh"><h2 id="pnTitle">النسخ الاحتياطي ونقل البيانات</h2><button type="button" class="pn-x" aria-label="إغلاق">✕</button></div>' +
      '<div class="pn-mb" id="pnBody"></div></div>';
    document.body.appendChild(ov);
    var t = document.createElement("div"); t.className = "pn-toast"; t.id = "pnToast"; document.body.appendChild(t);
    ov.addEventListener("click", function(e){
      if(e.target === ov || e.target.closest(".pn-x")) return close();
      var ex = e.target.closest("[data-exp]"); if(ex) doExport(ex.getAttribute("data-exp"));
    });
    ov.addEventListener("change", function(e){
      var inp = e.target.closest("[data-imp]"); if(inp){ doImport(inp.getAttribute("data-imp"), inp.files[0]); inp.value = ""; }
    });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && ov.classList.contains("open")) close(); });
    refreshDot();
  }

  window.PN = {open:open};
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
})();
</script>
<!-- ===== /PORTAL NAV & BACKUP ===== -->
</body>
</html>
